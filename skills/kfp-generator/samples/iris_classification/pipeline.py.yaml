# PIPELINE DEFINITION
# Name: iris-training-pipeline
# Description: A complete end-to-end Iris dataset training and evaluation pipeline.
# Inputs:
#    max_depth: int [Default: 3.0]
#    n_estimators: int [Default: 100.0]
#    random_state: int [Default: 42.0]
#    test_size: float [Default: 0.2]
components:
  comp-download-iris-dataset:
    executorLabel: exec-download-iris-dataset
    outputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-evaluate-iris-model:
    executorLabel: exec-evaluate-iris-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-preprocess-and-split-data:
    executorLabel: exec-preprocess-and-split-data
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        random_state:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        test_size:
          defaultValue: 0.2
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-iris-model:
    executorLabel: exec-train-iris-model
    inputDefinitions:
      artifacts:
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_depth:
          defaultValue: 3.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_estimators:
          defaultValue: 100.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        random_state:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-download-iris-dataset:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - download_iris_dataset
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn'\
          \ 'pandas'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef download_iris_dataset(dataset: Output[Dataset]):\n    \"\"\"\
          Downloads the Iris dataset using sklearn and saves it as a CSV file.\"\"\
          \"\n    import os\n    import pandas as pd\n    from sklearn.datasets import\
          \ load_iris\n\n    iris = load_iris(as_frame=True)\n    df = iris.frame\n\
          \n    os.makedirs(os.path.dirname(dataset.path), exist_ok=True)\n    df.to_csv(dataset.path,\
          \ index=False)\n\n"
        image: python:3.11
    exec-evaluate-iris-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_iris_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn'\
          \ 'pandas' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_iris_model(\n    test_dataset: Input[Dataset],\n   \
          \ model: Input[Model],\n    metrics: Output[Metrics],\n):\n    \"\"\"Evaluates\
          \ the trained model on the test dataset and logs evaluation metrics.\"\"\
          \"\n    import joblib\n    import pandas as pd\n    from sklearn.metrics\
          \ import accuracy_score, f1_score, precision_score, recall_score\n\n   \
          \ test_df = pd.read_csv(test_dataset.path)\n    x_test = test_df.drop(columns=['target'])\n\
          \    y_test = test_df['target']\n\n    classifier = joblib.load(model.path)\n\
          \    y_pred = classifier.predict(x_test)\n\n    accuracy = float(accuracy_score(y_test,\
          \ y_pred))\n    precision = float(precision_score(y_test, y_pred, average='macro'))\n\
          \    recall = float(recall_score(y_test, y_pred, average='macro'))\n   \
          \ f1 = float(f1_score(y_test, y_pred, average='macro'))\n\n    metrics.log_metric('accuracy',\
          \ accuracy)\n    metrics.log_metric('precision', precision)\n    metrics.log_metric('recall',\
          \ recall)\n    metrics.log_metric('f1_score', f1)\n\n    print(f'Accuracy:\
          \ {accuracy:.4f}')\n    print(f'Precision: {precision:.4f}')\n    print(f'Recall:\
          \ {recall:.4f}')\n    print(f'F1 Score: {f1:.4f}')\n\n"
        image: python:3.11
    exec-preprocess-and-split-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess_and_split_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn'\
          \ 'pandas'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess_and_split_data(\n    dataset: Input[Dataset],\n  \
          \  train_dataset: Output[Dataset],\n    test_dataset: Output[Dataset],\n\
          \    test_size: float = 0.2,\n    random_state: int = 42,\n):\n    \"\"\"\
          Preprocesses the Iris dataset and splits it into train and test sets.\"\"\
          \"\n    import os\n    import pandas as pd\n    from sklearn.model_selection\
          \ import train_test_split\n\n    df = pd.read_csv(dataset.path)\n    train_df,\
          \ test_df = train_test_split(\n        df, test_size=test_size, random_state=random_state,\
          \ stratify=df['target']\n    )\n\n    os.makedirs(os.path.dirname(train_dataset.path),\
          \ exist_ok=True)\n    os.makedirs(os.path.dirname(test_dataset.path), exist_ok=True)\n\
          \n    train_df.to_csv(train_dataset.path, index=False)\n    test_df.to_csv(test_dataset.path,\
          \ index=False)\n\n"
        image: python:3.11
    exec-train-iris-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_iris_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn'\
          \ 'pandas' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_iris_model(\n    train_dataset: Input[Dataset],\n    model:\
          \ Output[Model],\n    n_estimators: int = 100,\n    max_depth: int = 3,\n\
          \    random_state: int = 42,\n):\n    \"\"\"Trains a Random Forest classifier\
          \ model on the Iris training dataset.\"\"\"\n    import os\n    import joblib\n\
          \    import pandas as pd\n    from sklearn.ensemble import RandomForestClassifier\n\
          \n    train_df = pd.read_csv(train_dataset.path)\n    x_train = train_df.drop(columns=['target'])\n\
          \    y_train = train_df['target']\n\n    classifier = RandomForestClassifier(\n\
          \        n_estimators=n_estimators,\n        max_depth=max_depth,\n    \
          \    random_state=random_state,\n    )\n    classifier.fit(x_train, y_train)\n\
          \n    os.makedirs(os.path.dirname(model.path), exist_ok=True)\n    joblib.dump(classifier,\
          \ model.path)\n\n"
        image: python:3.11
pipelineInfo:
  description: A complete end-to-end Iris dataset training and evaluation pipeline.
  name: iris-training-pipeline
root:
  dag:
    tasks:
      download-iris-dataset:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-download-iris-dataset
        taskInfo:
          name: download-iris-dataset
      evaluate-iris-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-iris-model
        dependentTasks:
        - preprocess-and-split-data
        - train-iris-model
        inputs:
          artifacts:
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train-iris-model
            test_dataset:
              taskOutputArtifact:
                outputArtifactKey: test_dataset
                producerTask: preprocess-and-split-data
        taskInfo:
          name: evaluate-iris-model
      preprocess-and-split-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocess-and-split-data
        dependentTasks:
        - download-iris-dataset
        inputs:
          artifacts:
            dataset:
              taskOutputArtifact:
                outputArtifactKey: dataset
                producerTask: download-iris-dataset
          parameters:
            random_state:
              componentInputParameter: random_state
            test_size:
              componentInputParameter: test_size
        taskInfo:
          name: preprocess-and-split-data
      train-iris-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-iris-model
        dependentTasks:
        - preprocess-and-split-data
        inputs:
          artifacts:
            train_dataset:
              taskOutputArtifact:
                outputArtifactKey: train_dataset
                producerTask: preprocess-and-split-data
          parameters:
            max_depth:
              componentInputParameter: max_depth
            n_estimators:
              componentInputParameter: n_estimators
            random_state:
              componentInputParameter: random_state
        taskInfo:
          name: train-iris-model
  inputDefinitions:
    parameters:
      max_depth:
        defaultValue: 3.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      n_estimators:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      random_state:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      test_size:
        defaultValue: 0.2
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0