# Hand-maintained contract for authenticated HTTP archive endpoints.
openapi: 3.0.3
info:
  title: Kubeflow Pipelines data transfer
  version: v2beta1
  description: >-
    Self-service namespace export/import using the installation's normal HTTP
    authentication. Archives contain definitions and metadata, never artifact
    output bytes. Native and MLMD storage generations use different archive formats.
paths:
  /apis/v2beta1/transfer/export:
    post:
      operationId: exportTransfer
      summary: Download namespace metadata and definitions
      description: >-
        Requires list/get permissions for experiments, pipelines, runs and jobs.
        Includes the complete catalog and disabled-on-import schedule definitions;
        time bounds filter completed history only. Shared-read mode does not bypass
        authorization. Native storage also requires artifact list/get permissions.
        Responses are limited to 256 MiB.
      parameters:
        - $ref: '#/components/parameters/Namespace'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                completed_after:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Inclusive completion timestamp in Unix seconds; zero means unbounded.
                completed_before:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Exclusive completion timestamp in Unix seconds; zero means unbounded.
      responses:
        '200':
          description: JSON archive; preserve raw bytes, including integers above JavaScript's safe range.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="kfp-transfer.json"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /apis/v2beta1/transfer/import:
    post:
      operationId: importTransfer
      summary: Validate or import a namespace archive
      description: >-
        Requires list/create permissions for experiments, pipelines, runs and jobs,
        and applicable service-account permissions. Native storage also requires
        artifact list/create permissions. The archive must match the
        destination namespace and storage generation. Validation does not create
        Kubernetes resources or write MLMD. Apply stages disabled schedules and
        metadata before the SQL commit; retries reuse matching transfer-owned data.
        There is no distributed transaction. The maximum upload is 256 MiB.
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - name: dry_run
          in: query
          schema:
            type: boolean
            default: true
          description: Validate by default; explicitly pass false to apply the import.
        - name: name_prefix
          in: query
          schema:
            type: string
            maxLength: 63
            default: ''
          description: Prefix for imported names; retain the same value across batches and retries.
      requestBody:
        required: true
        description: The raw JSON archive downloaded from a compatible source installation.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Validation or import summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    Namespace:
      name: namespace
      in: query
      description: Required in multiuser mode; may be empty only in single-user mode. No namespace remapping.
      schema:
        type: string
  responses:
    Error:
      description: >-
        400 invalid request/archive; 401 unauthenticated; 403 forbidden; 404 missing
        resource; 409 conflict; 413 size limit; 415 unsupported content type;
        429 another transfer is active (Retry-After header); 500 internal failure;
        503 service unavailable. Retry an interrupted apply with the same archive
        and options. Only one transfer is active per API-server process.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
  schemas:
    Summary:
      type: object
      required: [counts, imported, skipped, dry_run, warnings]
      properties:
        counts:
          type: object
          required: [experiments, pipelines, pipeline_versions, runs, schedules]
          properties:
            experiments:
              type: integer
            pipelines:
              type: integer
            pipeline_versions:
              type: integer
            runs:
              type: integer
            schedules:
              type: integer
        imported:
          type: integer
        skipped:
          type: integer
        dry_run:
          type: boolean
        warnings:
          type: array
          items:
            type: string
