# PIPELINE DEFINITION
# Name: download-gcs-tgz
# Description: Download a GCS tarball and extract it to the output artifact directory.
# Inputs:
#    gcs_path: str
# Outputs:
#    folder: system.Artifact
components:
  comp-download-gcs-tgz:
    executorLabel: exec-download-gcs-tgz
    inputDefinitions:
      parameters:
        gcs_path:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        folder:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-download-gcs-tgz:
      container:
        command:
        - sh
        - -exc
        - 'uri="$0"

          output_path="$1"

          gsutil cp "$uri" artifact.tar.gz

          mkdir -p "$output_path"

          tar xvf artifact.tar.gz -C "$output_path"

          '
        - '{{$.inputs.parameters[''gcs_path'']}}'
        - '{{$.outputs.artifacts[''folder''].path}}'
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
pipelineInfo:
  name: download-gcs-tgz
root:
  dag:
    outputs:
      artifacts:
        folder:
          artifactSelectors:
          - outputArtifactKey: folder
            producerSubtask: download-gcs-tgz
    tasks:
      download-gcs-tgz:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-download-gcs-tgz
        inputs:
          parameters:
            gcs_path:
              componentInputParameter: gcs_path
        taskInfo:
          name: download-gcs-tgz
  inputDefinitions:
    parameters:
      gcs_path:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      folder:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.15.2
