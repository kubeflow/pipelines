# PIPELINE DEFINITION
# Name: kaniko
# Description: Build an image from context_uri or context_artifact and write its
#              URI/digest.
# Inputs:
#    cache: str [Default: 'true']
#    cache_ttl: str [Default: '24h']
#    context_artifact: system.Artifact
#    context_sub_path: str [Default: '']
#    context_uri: str [Default: '']
#    destination: str
#    dockerfile: str
# Outputs:
#    digest: system.Artifact
components:
  comp-kaniko:
    executorLabel: exec-kaniko
    inputDefinitions:
      artifacts:
        context_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          isOptional: true
      parameters:
        cache:
          defaultValue: 'true'
          isOptional: true
          parameterType: STRING
        cache_ttl:
          defaultValue: 24h
          isOptional: true
          parameterType: STRING
        context_sub_path:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        context_uri:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        destination:
          parameterType: STRING
        dockerfile:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        digest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-kaniko:
      container:
        command:
        - sh
        - -exc
        - "dockerfile=\"$0\"\ncontext_uri=\"$1\"\ncontext_artifact_path=\"$2\"\ncontext_sub_path=\"\
          $3\"\ndestination=\"$4\"\ndigest_output_path=\"$5\"\ncache=\"$6\"\ncache_ttl=\"\
          $7\"\ncontext=\"\"\nif [[ \"${context_uri}\" != \"\" ]]; then\n  context=\"\
          ${context_uri}\"\nelse\n  context=\"dir://${context_artifact_path}\"\nfi\n\
          digest_file=\"$(mktemp)\"\n# Reference: https://github.com/GoogleContainerTools/kaniko\n\
          # snapshotMode and use-new-run added because: https://github.com/GoogleContainerTools/kaniko/issues/1333\n\
          /kaniko/executor \\\n    --dockerfile \"${dockerfile}\" \\\n    --context\
          \ \"${context}\" \\\n    ${context_sub_path:+ --context-sub-path \"${context_sub_path}\"\
          } \\\n    --destination \"${destination}\" \\\n    --digest-file \"${digest_file}\"\
          \ \\\n    --cache=\"${cache}\" \\\n    --cache-ttl=\"${cache_ttl}\"\nmkdir\
          \ -p \"$(dirname \"${digest_output_path}\")\"\ndigest=\"$(cat $digest_file)\"\
          \necho \"${destination}@${digest}\" > \"${digest_output_path}\"\n"
        - '{{$.inputs.parameters[''dockerfile'']}}'
        - '{{$.inputs.parameters[''context_uri'']}}'
        - '{"IfPresent": {"InputName": "context_artifact", "Then": "{{$.inputs.artifacts[''context_artifact''].path}}"}}'
        - '{{$.inputs.parameters[''context_sub_path'']}}'
        - '{{$.inputs.parameters[''destination'']}}'
        - '{{$.outputs.artifacts[''digest''].path}}'
        - '{{$.inputs.parameters[''cache'']}}'
        - '{{$.inputs.parameters[''cache_ttl'']}}'
        image: gcr.io/kaniko-project/executor:v1.3.0-debug
pipelineInfo:
  name: kaniko
root:
  dag:
    outputs:
      artifacts:
        digest:
          artifactSelectors:
          - outputArtifactKey: digest
            producerSubtask: kaniko
    tasks:
      kaniko:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-kaniko
        inputs:
          artifacts:
            context_artifact:
              componentInputArtifact: context_artifact
          parameters:
            cache:
              componentInputParameter: cache
            cache_ttl:
              componentInputParameter: cache_ttl
            context_sub_path:
              componentInputParameter: context_sub_path
            context_uri:
              componentInputParameter: context_uri
            destination:
              componentInputParameter: destination
            dockerfile:
              componentInputParameter: dockerfile
        taskInfo:
          name: kaniko
  inputDefinitions:
    artifacts:
      context_artifact:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
        isOptional: true
    parameters:
      cache:
        defaultValue: 'true'
        isOptional: true
        parameterType: STRING
      cache_ttl:
        defaultValue: 24h
        isOptional: true
        parameterType: STRING
      context_sub_path:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      context_uri:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      destination:
        parameterType: STRING
      dockerfile:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      digest:
        artifactType:
          schemaTitle: system.Artifact
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
