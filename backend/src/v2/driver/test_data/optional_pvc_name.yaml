pipelineInfo:
  name: optional-pvc-name
root:
  dag:
    tasks:
      nested:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-nested
        inputs:
          parameters:
            child_pvc_name:
              componentInputParameter: optional_pvc_name
        taskInfo:
          name: nested
      noop:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-noop
        taskInfo:
          name: noop
      noop-2:
        cachingOptions: {}
        componentRef:
          name: comp-noop-2
        taskInfo:
          name: noop-2
      noop-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-noop-3
        taskInfo:
          name: noop-3
      noop-4:
        cachingOptions: {}
        componentRef:
          name: comp-noop-4
        taskInfo:
          name: noop-4
  inputDefinitions:
    parameters:
      optional_pvc_name:
        isOptional: true
        parameterType: STRING
      optional_secret_name:
        isOptional: true
        parameterType: STRING
      required_pvc_name:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-noop:
          pvcMount:
          - componentInputParameter: optional_pvc_name
            mountPath: /mnt/pvc
            pvcNameParameter:
              componentInputParameter: optional_pvc_name
        exec-noop-2:
          pvcMount:
          - componentInputParameter: optional_pvc_name
            mountPath: /mnt/pvc
            pvcNameParameter:
              componentInputParameter: optional_pvc_name
        exec-noop-3:
          pvcMount:
          - componentInputParameter: required_pvc_name
            mountPath: /mnt/pvc
            pvcNameParameter:
              componentInputParameter: required_pvc_name
        exec-noop-4:
          secretAsVolume:
          - mountPath: /mnt/secret
            optional: true
            secretNameParameter:
              componentInputParameter: optional_secret_name
        exec-noop-5:
          pvcMount:
          - componentInputParameter: child_pvc_name
            mountPath: /mnt/pvc
            pvcNameParameter:
              componentInputParameter: child_pvc_name
