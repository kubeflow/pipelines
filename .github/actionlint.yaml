paths:
  .github/workflows/ai-analyzer.lock.yml:
    ignore:
      # GitHub supports these gh-aw fields; actionlint v1.7.12 does not yet.
      # Keep exceptions file-scoped and remove once actionlint supports them.
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
      - '^unknown permission scope "copilot-requests"\. all available permission scopes are .+$'
      # job.workflow_ref is a GitHub job-context field gh-aw v0.93 reads; the
      # pattern is pinned to actionlint's exact job-context type signature.
      - '^property "workflow_ref" is not defined in object type \{check_run_id: number; container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
      # gh-aw v1.2 isolates the agent from cache writes; actionlint lacks this field.
      - '^unexpected key "cache\-mode" for "job" section\. expected one of "concurrency", "container", "continue\-on\-error", "defaults", "env", "environment", "if", "name", "needs", "outputs", "permissions", "runs\-on", "secrets", "services", "snapshot", "steps", "strategy", "timeout\-minutes", "uses", "with"$'
