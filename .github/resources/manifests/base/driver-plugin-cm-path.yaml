apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-pipeline-driver-agent
data:
  sidecar.container: |
    name: driver-plugin
    image: kind-registry:5000/driver:ci
    terminationMessagePolicy: FallbackToLogsOnError
    imagePullPolicy: IfNotPresent
    env:
      - name: KFP_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
    ports:
      - containerPort: 8080
    resources:
      requests:
        cpu: "0.1"
        memory: "64Mi"
      limits:
        cpu: "0.5"
        memory: "0.5Gi"
    securityContext:
      # Match Argo's agent init UID to read the shared authentication token.
      runAsNonRoot: true
      runAsUser: 8737
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: var-run-argo
      mountPath: /kfp/log
      subPath: driver-plugin
      readOnly: false
