apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../manifests/kustomize/env/platform-agnostic
  - ../../base

# Exercise the opt-in image pull failure handling in the canonical standalone
# job so backend/test/v2/api/image_pull_failure_api_test.go runs against a real
# persistence agent. The grace period is shortened to keep that test fast.
components:
  - ../../../../../manifests/kustomize/components/image-pull-failure-handling

images:
  - name: ghcr.io/kubeflow/kfp-api-server
    newName: kind-registry:5000/apiserver
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-persistence-agent
    newName: kind-registry:5000/persistenceagent
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
    newName: kind-registry:5000/scheduledworkflow
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-frontend
    newName: kind-registry:5000/frontend
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-viewer-crd-controller
    newName: kind-registry:5000/viewer-crd-controller
    newTag: latest
patches:
  - path: ../../base/apiserver-env.yaml
    target:
      kind: Deployment
      name: ml-pipeline
  - path: ../../base/persistenceagent-image-pull-grace-period.yaml
  - path: ../../base/ci-stability-tuning.yaml
  - path: ../../base/viewer-crd-pull-policy.yaml
    target:
      kind: Deployment
      name: ml-pipeline-viewer-crd
replacements:
  - source:
      kind: ConfigMap
      name: dns-config
      fieldPath: data.namespaceDns
    targets:
      - select:
          kind: Deployment
          name: ml-pipeline
        fieldPaths:
          - spec.template.spec.dnsConfig.searches.[=NAMESPACE.svc.cluster.local]
