# Run the scheduled workflow controller with leader election in the multi-user
# lanes that use this patch. The other lanes keep the default (leader election
# off).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-scheduledworkflow
spec:
  template:
    spec:
      containers:
        - name: ml-pipeline-scheduledworkflow
          env:
            - name: LEADER_ELECT
              value: "true"
