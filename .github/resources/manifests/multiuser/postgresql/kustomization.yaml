apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CI overlay for Multi-user + PostgreSQL testing
# This CI overlay does three things:
# 1. It uses `platform-agnostic-multi-user-postgresql` as its base
# 2. It applies CI-specific environment variables
# 3. It overrides image names to use locally built images from Kind registry
resources:
  - ../../base
  - ../../../../../manifests/kustomize/env/platform-agnostic-multi-user-postgresql

# The Kind PostgreSQL instance does not use TLS. Configure that deliberate CI
# choice through the same ConfigMap input consumed by both database clients.
configMapGenerator:
  - name: pipeline-install-config
    behavior: merge
    literals:
      - postgresExtraParams={"sslmode":"disable"}

images:
  - name: ghcr.io/kubeflow/kfp-api-server
    newName: kind-registry:5000/apiserver
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-persistence-agent
    newName: kind-registry:5000/persistenceagent
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
    newName: kind-registry:5000/scheduledworkflow
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-frontend
    newName: kind-registry:5000/frontend
    newTag: latest
  - name: ghcr.io/kubeflow/kfp-viewer-crd-controller
    newName: kind-registry:5000/viewer-crd-controller
    newTag: latest
patches:
  - path: ../../base/apiserver-env.yaml
    target:
      kind: Deployment
      name: ml-pipeline
  - path: ../../base/ci-stability-tuning.yaml
  - path: apiserver-env.yaml
    target:
      kind: Deployment
      name: ml-pipeline
  - path: ../../base/viewer-crd-pull-policy.yaml
    target:
      kind: Deployment
      name: ml-pipeline-viewer-crd
replacements:
  - source:
      kind: ConfigMap
      name: dns-config
      fieldPath: data.namespaceDns
    targets:
      - select:
          kind: Deployment
          name: ml-pipeline
        fieldPaths:
          - spec.template.spec.dnsConfig.searches.[=NAMESPACE.svc.cluster.local]
