name: Documentation

# CI validation only — publishing is handled by Read the Docs
# (.readthedocs.yml), not by this workflow.

on:
  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact queue candidate SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_ref:
        description: Queue target branch, master or main (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_sha:
        description: Current target branch SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
  merge_group:
    types: [checks_requested]
    branches: [master, main]
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup-python/**"
      - "docs/**"
      - "sdk/python/kfp/**"
      - ".readthedocs.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [master, main]
    paths:
      - "**/pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup-python/**"
      - "docs/**"
      - "sdk/python/kfp/**"
      - ".readthedocs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  queue-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    permissions:
      contents: read
    uses: ./.github/workflows/queue-dispatch-guard.yml
    with:
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_ref: ${{ inputs.queue_base_ref }}
      queue_base_sha: ${{ inputs.queue_base_sha }}

  build:
    runs-on: ubuntu-latest
    name: Build Documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"

      - name: Install protobuf dependencies & kfp-pipeline-spec
        id: install-protobuf-deps
        uses: ./.github/actions/protobuf

      - name: Build documentation (warnings treated as errors)
        run: uv run python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 7

  linkcheck:
    runs-on: ubuntu-latest
    name: Check Links
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"

      - name: Install protobuf dependencies & kfp-pipeline-spec
        id: install-protobuf-deps
        uses: ./.github/actions/protobuf

      - name: Check links
        run: uv run python -m sphinx -b linkcheck docs docs/_build/linkcheck || true
