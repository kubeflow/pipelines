name: KFP Docs Freshness

on:
  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact queue candidate SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_ref:
        description: Queue target branch, release-2.18 (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_sha:
        description: Current target branch SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
  merge_group:
    types: [checks_requested]
    branches: [release-2.18]
  push:
    branches: [ master ]
  pull_request:
    paths:
      - .github/workflows/**
      - third_party/**
      - README.md


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  queue-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    permissions:
      contents: read
    uses: ./.github/workflows/queue-dispatch-guard.yml
    with:
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_ref: ${{ inputs.queue_base_ref }}
      queue_base_sha: ${{ inputs.queue_base_sha }}

  test-docs-freshness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install ruamel.yaml

      - name: Verify Argo compatibility matrix freshness
        run: |
          python3 .github/scripts/verify-argo-matrix.py
