name: KFP SDK Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - 'api/**'
      - 'sdk/**'
      - 'kubernetes_platform/**'
      - 'backend/api/**'
      - '.github/actions/protobuf/**'
      - '.github/resources/scripts/check_python_distribution.py'
      - 'test/presubmit-tests-sdk-unit.sh'
      - '.github/workflows/kfp-sdk-unit-tests.yml'
      - '.github/actions/setup-python/**'
      - '!**/*.md'
      - '!**/OWNERS'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python with uv
      uses: ./.github/actions/setup-python
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install protobuf dependencies & generate proto files
      uses: ./.github/actions/protobuf

    - name: Run SDK Tests
      id: run-tests
      env:
        # We setup the env in the CI
        SETUP_ENV: false
        REPO_NAME: ${{ github.repository }}
        PULL_NUMBER: ${{ github.event.pull_request.number }}
        JUNIT_XML: "sdk-unit.xml"
      run: |
        ./test/presubmit-tests-sdk-unit.sh
        echo "JUNIT_XML=$JUNIT_XML" >> "$GITHUB_OUTPUT"

    - name: Run generated API client tests
      run: uv run pytest backend/api/v2/python_http_client_smoke backend/api/hack/generate_python_compat_test.py

    - name: Check unified wheel and standalone sdist
      run: |
        uv build --package kfp --out-dir "$RUNNER_TEMP/kfp-dist"
        uv run python .github/resources/scripts/check_python_distribution.py "$RUNNER_TEMP/kfp-dist"

    - name: Publish Junit Summary
      id: summary
      uses: ./.github/actions/junit-summary
      if: (!cancelled())
      with:
        xml_files: ${{ steps.run-tests.outputs.JUNIT_XML }}
      continue-on-error: true
