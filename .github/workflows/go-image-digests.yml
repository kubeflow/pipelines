name: Go Builder Image Digests

on:
  merge_group:
    types: [checks_requested]
    branches: [master]
  pull_request:
    paths:
      - '.github/resources/scripts/update_go_version.py'
      - '.github/workflows/go-image-digests.yml'
      - 'docs/agents/go-version-policy.md'
      - '**/Dockerfile*'
      - '**/Containerfile*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Go versions in pinned builder images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: python3 .github/resources/scripts/update_go_version.py --check-image-digests
