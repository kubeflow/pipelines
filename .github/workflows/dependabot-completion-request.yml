# This unprivileged signal carries no PR files or executable artifacts.
name: Dependabot completion request
on:
  pull_request:
permissions: {}
jobs:
  request:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'The trusted completion workflow will inspect this exact head.'
