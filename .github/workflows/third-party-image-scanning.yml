name: Third-party Image Evidence
on:
  workflow_call:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - name: Install Kustomize
        env:
          KUSTOMIZE_VERSION: '5.8.1'
          KUSTOMIZE_SHA256: '029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d'
        run: |
          kustomize_archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/${kustomize_archive}" \
            --output "${RUNNER_TEMP}/${kustomize_archive}"
          echo "${KUSTOMIZE_SHA256}  ${RUNNER_TEMP}/${kustomize_archive}" | \
            sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${kustomize_archive}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/kustomize"

      - name: Resolve branch heads and render third-party inventory
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PYTHONPATH: release
        run: |
          python .github/resources/scripts/third_party_image_scan.py discover \
            --repository "$REPOSITORY" --kustomize "$RUNNER_TEMP/kustomize" \
            --output third-party-inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-inventory-${{ github.run_attempt }}
          path: third-party-inventory
          if-no-files-found: error
          retention-days: 7

  scan:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - uses: ./.github/actions/setup-osv-scanner
        with:
          arch: amd64
      - name: Scan exact pulled image with full package inventory
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_KEY: ${{ matrix.key }}
          PYTHONPATH: release
        run: |
          python .github/resources/scripts/third_party_image_scan.py scan \
            --image "$IMAGE" --output "evidence/$IMAGE_KEY"
      - name: Preserve raw evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-scan-${{ matrix.key }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 7

  report:
    if: always()
    needs: [inventory, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          name: third-party-inventory-${{ github.run_attempt }}
          path: inventory
          required-files: inventory.json
      - name: List required scan evidence
        id: files
        run: |
          python - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          inventory = json.load(open('inventory/inventory.json'))
          print('required<<EOF')
          for scan in inventory['scans']:
              for filename in ('subject.json', 'scan.json', 'osv-report.json'):
                  print(scan['key'] + '/' + filename)
          print('EOF')
          PYCODE
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          required-files: ${{ steps.files.outputs.required }}
          pattern: third-party-scan-*-${{ github.run_attempt }}
          path: evidence
          merge-multiple: 'true'
      - name: Require complete coverage and report image-level actions
        env:
          PYTHONPATH: release
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          test "$INVENTORY_RESULT" = success
          test "$SCAN_RESULT" = success
          python .github/resources/scripts/third_party_image_report.py \
            --inventory inventory/inventory.json --evidence evidence --output report
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-image-report-${{ github.run_attempt }}
          path: report
          if-no-files-found: error
          retention-days: 7
