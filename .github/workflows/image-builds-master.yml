name: Build and Push for master
on:
  push:
    branches:
      - master
jobs:
  build-images-for-master:
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: kfp-api-server
            dockerfile: backend/Dockerfile
            context: .
          - name: kfp-frontend
            dockerfile: frontend/Dockerfile
            context: .
          - name: kfp-persistence-agent
            dockerfile: backend/Dockerfile.persistenceagent
            context: .
          - name: kfp-scheduled-workflow-controller
            dockerfile: backend/Dockerfile.scheduledworkflow
            context: .
          - name: kfp-viewer-crd-controller
            dockerfile: backend/Dockerfile.viewercontroller
            context: .
          - name: kfp-launcher
            dockerfile: backend/Dockerfile.launcher
            context: .
          - name: kfp-driver
            dockerfile: backend/Dockerfile.driver
            context: .
          - name: kfp-profile-controller
            dockerfile: manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/Dockerfile
            context: manifests/kustomize/base/installs/multi-user/pipelines-profile-controller

        arch:
          - arch_name: amd64
            runs_on: ubuntu-latest
            platform: linux/amd64
          - arch_name: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64

    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit
    with:
      src_branch: ${{ github.sha }}
      target_tag: master
      arch_tag: ${{ matrix.arch.arch_name }}
      overwrite_imgs: True
      set_latest: False
      add_sha_tag: False
      app_to_build: ${{ matrix.image.name }}
      image_context: ${{ matrix.image.context }}
      docker_file: ${{ matrix.image.dockerfile }}
      platforms: ${{ matrix.arch.platform }}
      runs_on: ${{ matrix.arch.runs_on }}
      push: true

  create-manifests:
    needs: build-images-for-master
    strategy:
      fail-fast: true
      matrix:
        component:
          - image: kfp-api-server
          - image: kfp-frontend
          - image: kfp-persistence-agent
          - image: kfp-scheduled-workflow-controller
          - image: kfp-viewer-crd-controller
          - image: kfp-launcher
          - image: kfp-driver
          - image: kfp-profile-controller
    uses: ./.github/workflows/create-manifest.yml
    secrets: inherit
    with:
      target_tag: master
      app_to_build: ${{ matrix.component.image }}
      source_sha: ${{ github.sha }}
      expected_platforms: linux/amd64,linux/arm64
      set_latest: ${{ 'false' }}

  arm64-smoke:
    needs: create-manifests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: List required published image records
        id: image-records
        shell: bash
        run: bash .github/resources/scripts/ci-image-artifacts.sh --github-output published-image-files
      - name: Download this publication's verified index references
        id: published-images
        uses: ./.github/actions/download-artifact-with-retry
        with:
          pattern: published-index-*-${{ github.run_attempt }}
          path: published-indexes
          merge-multiple: 'true'
          required-files: ${{ steps.image-records.outputs.required-files }}
      - uses: ./.github/actions/arm64-smoke
        with:
          image_records: ${{ steps.published-images.outputs.download-path }}
          source_sha: ${{ github.sha }}
