name: pre-commit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.4'
      - uses: ./.github/actions/setup-go
      - name: Check repository Go version policy
        run: make check-go-version

      - name: Configure pre-commit range
        id: pre-commit-range
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base_sha="${EVENT_BASE_SHA}"
          if [[ -z "${base_sha}" ]] ||
              ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::error::Unable to resolve the event base commit"
            exit 1
          fi

          config_changed=true
          if git diff --quiet "${base_sha}" HEAD -- .pre-commit-config.yaml .golangci.yaml pyproject.toml uv.lock; then
            config_changed=false
          fi

          echo "base-sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "config-changed=${config_changed}" >> "${GITHUB_OUTPUT}"
          echo "PRE_COMMIT_FROM_REF=${base_sha}" >> "${GITHUB_ENV}"

      - name: Run pre-commit on changed files
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --from-ref ${{ steps.pre-commit-range.outputs.base-sha }} --to-ref HEAD

      - name: Smoke-test applicable hooks after configuration changes
        if: steps.pre-commit-range.outputs.config-changed == 'true'
        run: >-
          pre-commit run
          --show-diff-on-failure
          --color=always
          --files
          .pre-commit-config.yaml
          .github/workflows/pre-commit.yml
          .golangci.yaml
          frontend/package.json
          .github/resources/scripts/update_go_version.py
          sdk/python/kfp/cli/__init__.py
          sdk/python/kfp/dsl/structures.py
          backend/src/common/types.go
