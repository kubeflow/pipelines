name: pre-commit
on:
  pull_request:
    branches: [codex/precommit-event-20261117-native, codex/precommit-event-20261117-dispatch]
  merge_group:
    types: [checks_requested]
    branches: [codex/precommit-event-20261117-native]
  workflow_dispatch:
permissions: {}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check isolated event and candidate identity
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          case "$EVENT:$REF:$BASE" in
            pull_request:refs/pull/*:codex/precommit-event-20261117-native|pull_request:refs/pull/*:codex/precommit-event-20261117-dispatch) ;;
            merge_group:refs/heads/gh-readonly-queue/codex/precommit-event-20261117-native/*:*|workflow_dispatch:refs/heads/gh-readonly-queue/codex/precommit-event-20261117-dispatch/*:*) ;;
            *) exit 1 ;;
          esac
          echo "$EVENT $REF $SHA"
