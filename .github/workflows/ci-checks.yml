# Only trusted base-branch code is executed by this status publisher.
name: CI Check

on:
  schedule:
    # Scheduled PR-head and release queue recovery share the repository's
    # hourly GITHUB_TOKEN API budget; event-driven validation remains prompt.
    - cron: '7 * * * *'
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed, ready_for_review, converted_to_draft]
  workflow_run:
    # Explicit constituents prevent CI Check from recursively triggering itself.
    workflows:
      - 'API Server Tests'
      - 'Build tools images'
      - 'Build tools images merge group'
      - 'CI Scripts Tests'
      - 'Check uv.lock and requirements.txt sync'
      - 'Check uv.lock sync'
      - 'Workflow Compiler Tests'
      - 'KFP Docs Freshness'
      - 'Documentation'
      - 'KFP e2e frontend tests'
      - 'KFP E2E Pipeline tests'
      - 'KFP ARM64 Presubmit'
      - 'Frontend Tests'
      - 'Go Builder Image Digests'
      - 'kfp-kubernetes library tests'
      - 'KFP Python Client Tests'
      - 'KFP SDK Tests'
      - 'KFP SDK Unit Tests'
      - 'KFP Webhook Integration'
      - 'KFP Manifests'
      - 'KFP Kubernetes Native Migration Tests'
      - 'KFP API Integration V2 (Legacy)'
      - 'KFP API Integration v1 tests'
      - 'pre-commit'
      - 'KFP Backend Tests'
      - 'KFP backend visualization tests'
      - 'Python Syntax'
      - 'KFP Readthedocs Release Readiness'
      - 'Runtime Base Images'
      - 'Runtime Base Images Merge Group'
      - 'KFP SDK Docformatter Test'
      - 'KFP SDK Isort Test'
      - 'KFP SDK Upgrade Test'
      - 'KFP SDK YAPF Tests'
      - 'KFP upgrade tests'
      - 'Validate Generated Files'
    types: [requested, in_progress, completed]

permissions:
  contents: read

jobs:
  recovery_candidates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: read
      contents: read
    outputs:
      candidates: ${{ steps.list.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: list
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {recoveryCandidates} = require('./.github/resources/scripts/ci_passed.js');
            return await recoveryCandidates({github, context});

  queue_candidates:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'merge_group') ||
      (github.event_name == 'pull_request_target' &&
        (github.event.pull_request.base.ref == 'release-2.18' ||
         (github.event.action == 'edited' &&
          github.event.changes.base.ref.from == 'release-2.18')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      candidates: ${{ steps.list.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: list
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {queueEventCandidates, queueHeads, queueRecoveryCandidates, queueStatus,
              queueInvalidationDescription} =
              require('./.github/resources/scripts/ci_passed.js');
            if (context.eventName === 'schedule') {
              return await queueRecoveryCandidates({github, context});
            }
            if (context.eventName === 'pull_request_target') {
              return await queueEventCandidates({github, context});
            }
            const heads = await queueHeads({github, context});
            if (context.eventName === 'workflow_run' &&
                ['requested', 'in_progress'].includes(context.payload.action)) {
              // This job has no concurrency group. Record the rerun before a
              // replaceable per-SHA validation job can be queued behind it.
              for (const sha of heads) {
                await queueStatus(github, context, sha, 'pending',
                  queueInvalidationDescription(context));
              }
            }
            return heads.map(sha => ({sha}));

  check_ci_status:
    name: check_ci_status
    needs: recovery_candidates
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.recovery_candidates.outputs.candidates || '[{"number":0,"head":""}]') }}
    if: >-
      always() && !cancelled() && (
      (github.event_name == 'schedule' && needs.recovery_candidates.result == 'success' && needs.recovery_candidates.outputs.candidates != '[]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'ok-to-test' || github.event.label.name == 'needs-ok-to-test' ||
         github.event.label.name == 'lgtm' || github.event.label.name == 'approved' ||
         github.event.label.name == 'do-not-merge' ||
         github.event.label.name == 'do-not-merge/hold' ||
         github.event.label.name == 'do-not-merge/invalid-owners-file' ||
         github.event.label.name == 'do-not-merge/work-in-progress' ||
         github.event.label.name == 'needs-rebase')))
    concurrency:
      # GitHub can replace pending runs. Each survivor reads current PR, CI,
      # and durable retarget history; correctness never depends on event order.
      group: ci-passed-reconcile-${{ matrix.candidate.head || github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check out the trusted workflow revision
        if: github.event_name != 'pull_request_target' || github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the trusted default branch for a closed PR
        if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
        uses: actions/checkout@v7
        with:
          # After merge, github.sha equals the PR merge SHA and checkout's
          # fork guard rejects it. Use the base repo's named trusted branch.
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up trusted workflow inventory parser
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install trusted workflow parser dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Resolve PR and verify expected CI workflows
        # Invalidate earlier success even when parser setup failed. The poll
        # still requires successful prerequisite steps before it can run.
        if: always() && !cancelled()
        env:
          CI_RECOVERY_NUMBER: ${{ matrix.candidate.number }}
          CI_RECOVERY_HEAD: ${{ matrix.candidate.head }}
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {prepare} = require('./.github/resources/scripts/ci_passed.js');
            await prepare({github, context, core, recovery: {
              number: Number(process.env.CI_RECOVERY_NUMBER),
              head: process.env.CI_RECOVERY_HEAD}});

      - name: Check all current CI results
        id: poll
        if: steps.prepare.outputs.ready == 'true'
        continue-on-error: true
        uses: wechuli/allcheckspassed@e4240aa9cc76fd6828ce27a71ad16c406c25adb3
        with:
          commit_sha: ${{ steps.prepare.outputs.head_sha }}
          # Completion events and scheduled sweeps drive recovery. Never hold
          # the shared writer while waiting for external checks.
          poll: 'false'
          # The pinned action waits one minute before its first API call even
          # with polling disabled, holding the shared writer lock (#14552 P3).
          delay: '0'
          ignore_superseded_runs: 'true'
          # Expected workflow completion is verified independently; these
          # exclusions cannot hide a failing constituent workflow.
          checks_exclude: '^check_ci_status( \(.*\))?$,^Cleanup artifacts$,^Upload results$,^Agent$,^Prepare$'
          token: ${{ github.token }}

      - name: Reconcile status and informational label
        if: always() && steps.prepare.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CI_PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
          CI_HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          CI_PR_SNAPSHOT: ${{ steps.prepare.outputs.snapshot }}
          CI_POLL_PASSED: ${{ steps.poll.outcome == 'success' }}
          CI_POLL_SKIPPED: ${{ steps.poll.outcome == 'skipped' && steps.prepare.outcome == 'success' && steps.prepare.outputs.ready == 'false' }}
        with:
          script: |
            const {finalize} = require('./.github/resources/scripts/ci_passed.js');
            await finalize({github, context, core,
              number: process.env.CI_PR_NUMBER,
              head: process.env.CI_HEAD_SHA,
              before: process.env.CI_PR_SNAPSHOT,
              pollPassed: process.env.CI_POLL_PASSED === 'true',
              pollSkipped: process.env.CI_POLL_SKIPPED === 'true'});

  invalidate_queue_status:
    name: invalidate_queue_status
    needs: queue_candidates
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.queue_candidates.outputs.candidates || '[{"sha":""}]') }}
    if: >-
      always() && !cancelled() && needs.queue_candidates.result == 'success' &&
      needs.queue_candidates.outputs.candidates != '[]' &&
      !(github.event_name == 'workflow_run' &&
        (github.event.action == 'requested' || github.event.action == 'in_progress'))
    concurrency:
      group: release-2.18-queue-ci-${{ matrix.candidate.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out trusted default-branch publisher code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Revoke prior success for this queue SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CI_QUEUE_SHA: ${{ matrix.candidate.sha }}
        with:
          script: |
            const {queueStatus, queueInvalidationDescription} =
              require('./.github/resources/scripts/ci_passed.js');
            await queueStatus(github, context, process.env.CI_QUEUE_SHA,
              'pending', queueInvalidationDescription(context));

  check_queue_status:
    name: check_queue_status
    needs: [queue_candidates, invalidate_queue_status]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.queue_candidates.outputs.candidates || '[{"sha":""}]') }}
    if: >-
      always() && !cancelled() && needs.queue_candidates.result == 'success' &&
      needs.invalidate_queue_status.result == 'success' &&
      needs.queue_candidates.outputs.candidates != '[]'
    concurrency:
      # Each matrix job writes one SHA. Per-SHA locks allow all scheduled
      # candidates to run without replacing siblings in a global pending slot.
      group: release-2.18-queue-ci-${{ matrix.candidate.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch publisher code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up trusted workflow inventory parser
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install trusted workflow parser dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Reconcile release merge-group CI on the exact queue SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CI_QUEUE_SHA: ${{ matrix.candidate.sha }}
        with:
          script: |
            const {reconcileQueue} = require('./.github/resources/scripts/ci_passed.js');
            await reconcileQueue({github, context, core,
              recovery: {sha: process.env.CI_QUEUE_SHA}, alreadyPending: true});
