# Only trusted base-branch code is executed by this status publisher.
name: CI Check

on:
  workflow_dispatch:
    inputs:
      merged_pr:
        description: Merged release PR whose pending aggregate needs recovery
        type: string
        required: true
      head_sha:
        description: Exact 40-character tested PR head SHA
        type: string
        required: true
  schedule:
    - cron: '7,22,37,52 * * * *'
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed, ready_for_review, converted_to_draft]
  workflow_run:
    # Explicit constituents prevent CI Check from recursively triggering itself.
    workflows:
      - 'API Server Tests'
      - 'Build tools images'
      - 'CI Scripts Tests'
      - 'Check Python dependency artifacts'
      - 'Check uv.lock sync'
      - 'Workflow Compiler Tests'
      - 'KFP Docs Freshness'
      - 'Documentation'
      - 'KFP e2e frontend tests'
      - 'KFP E2E Pipeline tests'
      - 'KFP ARM64 Presubmit'
      - 'Frontend Tests'
      - 'Go Builder Image Digests'
      - 'kfp-kubernetes library tests'
      - 'KFP Python Client Tests'
      - 'KFP SDK Tests'
      - 'KFP SDK Unit Tests'
      - 'KFP Webhook Integration'
      # Release branches still run legacy CI; their reruns must update ci-passed.
      - 'KFP API Integration V2 (Legacy)'
      - 'KFP Manifests'
      - 'KFP Kubernetes Native Migration Tests'
      - 'pre-commit'
      - 'KFP Backend Tests'
      - 'Python Syntax'
      - 'KFP Readthedocs Release Readiness'
      - 'Runtime Base Images'
      - 'Shared CI Images'
      - 'Third-party Image Upgrade Checks'
      - 'Main PostgreSQL image retained-data upgrade'
      - 'KFP SDK Docformatter Test'
      - 'Python Ruff Lint'
      - 'KFP SDK Upgrade Test'
      - 'Python Ruff Format'
      - 'KFP upgrade tests'
      - 'Validate Generated Files'
      # Release-only lane names are published by their default-branch controller.
      - 'Artifact storage acceptance'
      - 'KFP backend visualization tests'
      - 'Build tools images merge group'
      - 'Legacy cache rolling upgrade'
      - 'KFP API Integration v1 tests'
      - 'PostgreSQL image retained-data upgrade'
      - 'Runtime Base Images Merge Group'
      - 'TensorBoard runtime acceptance'
      - 'Upgrade readiness tool'
      - 'KFP SDK Isort Test'
      - 'KFP SDK YAPF Tests'
    types: [requested, in_progress, completed]

permissions:
  contents: read

jobs:
  recovery_candidates:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
      statuses: read
      contents: read
    outputs:
      candidates: ${{ steps.list.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up trusted workflow inventory parser
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install trusted workflow parser dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - id: list
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/.github/resources/scripts/node_http_accounting.cjs"
          CI_HTTP_ACCOUNTING_SCOPE: recovery
        with:
          script: |
            const {withRequestAccounting} = require('./.github/resources/scripts/github_request_accounting.js');
            const {recoveryCandidates} = require('./.github/resources/scripts/ci_passed.js');
            return await withRequestAccounting({github, core, scope: 'recovery'},
              () => recoveryCandidates({github, context}));

  check_ci_status:
    name: ${{ matrix.candidate.head && format('check_ci_status ({0}, {1})', matrix.candidate.number, matrix.candidate.head) || 'check_ci_status (0)' }}
    needs: recovery_candidates
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.recovery_candidates.outputs.candidates || '[{"number":0,"head":""}]') }}
    if: >-
      always() && !cancelled() && (
      (github.event_name == 'schedule' && needs.recovery_candidates.result == 'success' && needs.recovery_candidates.outputs.candidates != '[]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'ok-to-test' || github.event.label.name == 'needs-ok-to-test')))
    concurrency:
      # GitHub can replace pending runs. Each survivor reads current PR, CI,
      # and durable retarget history; correctness never depends on event order.
      group: ci-passed-reconcile-${{ matrix.candidate.head || github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    uses: ./.github/workflows/ci-publish-status.yml
    with:
      recovery_number: ${{ matrix.candidate.number }}
      recovery_head: ${{ matrix.candidate.head }}
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
      statuses: write

  recover_merged_release:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-passed-reconcile-${{ inputs.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/.github/resources/scripts/node_http_accounting.cjs"
          CI_HTTP_ACCOUNTING_SCOPE: merged_prepare
          RECOVERY_PR: ${{ inputs.merged_pr }}
          RECOVERY_HEAD: ${{ inputs.head_sha }}
        with:
          script: |
            const {withRequestAccounting} = require('./.github/resources/scripts/github_request_accounting.js');
            const {prepareMergedRecovery} = require('./.github/resources/scripts/ci_passed.js');
            return await withRequestAccounting({github, core, scope: 'merged_prepare'},
              () => prepareMergedRecovery({github, context, core,
                number: process.env.RECOVERY_PR, head: process.env.RECOVERY_HEAD}));
      - if: success() && steps.prepare.outcome == 'success' && steps.prepare.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/.github/resources/scripts/node_http_accounting.cjs"
          CI_HTTP_ACCOUNTING_SCOPE: merged_finalize
          RECOVERY_PR: ${{ steps.prepare.outputs.pr_number }}
          RECOVERY_HEAD: ${{ steps.prepare.outputs.head_sha }}
          RECOVERY_SNAPSHOT: ${{ steps.prepare.outputs.snapshot }}
        with:
          script: |
            const {withRequestAccounting} = require('./.github/resources/scripts/github_request_accounting.js');
            const {finalizeMergedRecovery} = require('./.github/resources/scripts/ci_passed.js');
            return await withRequestAccounting({github, core, scope: 'merged_finalize'},
              () => finalizeMergedRecovery({github, context, core,
                number: process.env.RECOVERY_PR, head: process.env.RECOVERY_HEAD,
                before: process.env.RECOVERY_SNAPSHOT, preparationSucceeded: true, validationReady: true}));

  check_merge_group_status:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'merge_group' || github.event.workflow_run.event == 'workflow_dispatch') &&
      (startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/master/') ||
       startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/main/') ||
       startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/release-2.18/')) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: ci-passed-merge-group-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: Check out the trusted publisher revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install trusted workflow parser dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Reconcile exact merge-group status
        if: always() && !cancelled()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/.github/resources/scripts/node_http_accounting.cjs"
          CI_HTTP_ACCOUNTING_SCOPE: merge_group
        with:
          script: |
            const {reconcile} = require('./.github/resources/scripts/ci_merge_group.js');
            const {withRequestAccounting} = require('./.github/resources/scripts/github_request_accounting');
            return await withRequestAccounting({github, core, scope: 'merge_group'},
              async () => await reconcile({github, context, core}));

  queue_admission:
    # Events reconcile their PR or candidate. The scheduled sweep covers
    # missed events, rebuilt candidates and failing PR Gate aggregates.
    if: >-
      always() && !cancelled() && (
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
       (github.event.workflow_run.event == 'pull_request' ||
        ((github.event.workflow_run.event == 'merge_group' || github.event.workflow_run.event == 'workflow_dispatch') &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         (startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/master/') ||
          startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/main/') ||
          startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/release-2.18/'))))))
    uses: ./.github/workflows/merge-queue-admission.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
