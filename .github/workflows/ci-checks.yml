# This workflow checks whether all CI checks passed, publishes the SHA-bound
# ci-passed commit status, and maintains the informational ci-passed label.
# Eligibility changes for one PR head share a single writer and finish by
# reconciling current live PR state. A completed workflow run on the same
# head SHA re-derives the aggregate from current check state so a later
# same-SHA re-run cannot leave a stale green.
name: CI Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]
  workflow_run:
    types: [completed]

jobs:
  check_ci_status:
    # GitHub Actions cannot filter pull_request_target events by label name.
    # Skip unrelated labels before entering concurrency so Dependabot/Prow label
    # bursts cannot leave cancelled checks on the current head SHA.
    # The first clause admits opened/synchronize/reopened/closed (any action
    # other than labeled/unlabeled/edited). A closed event must reach the
    # close-handling step below to remove the informational ci-passed label.
    if: >-
      github.event_name == 'pull_request_target' &&
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.action != 'edited') ||
        (github.event.action == 'edited' && github.event.changes.base.ref.from != '') ||
        (github.event.action == 'labeled' && (github.event.label.name == 'ok-to-test' || github.event.label.name == 'needs-ok-to-test')) ||
        (github.event.action == 'unlabeled' && (github.event.label.name == 'needs-ok-to-test' || github.event.label.name == 'ok-to-test'))
      )
    concurrency:
      # Every event that can change eligibility for one PR head shares a
      # single writer keyed on the head SHA. A queued invalidation must never
      # be silently replaced, so in-progress runs are not cancelled.
      group: ci-passed-reconcile-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Determine whether CI polling is needed
        id: eligibility
        env:
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          OLD_BASE_REF: ${{ github.event.changes.base.ref.from }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        shell: bash
        run: |
          should_poll=false
          reason="CI polling is not needed for this pull request event."

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'needs-ok-to-test') }}" == "true" ]]; then
            reason="PR still has the needs-ok-to-test label."
          elif [[ "${EVENT_ACTION}" == "edited" && -n "${OLD_BASE_REF}" ]]; then
            reason="Base branch changed from '${OLD_BASE_REF}'; push or update the branch to revalidate CI against the new base."
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'ok-to-test') }}" == "true" ]]; then
            should_poll=true
            reason="PR is eligible; running CI status polling."
          elif [[ "${PR_AUTHOR}" == "dependabot[bot]" ]]; then
            should_poll=true
            reason="Dependabot PR is eligible; running CI status polling."
          elif [[ "${AUTHOR_ASSOCIATION}" == "MEMBER" || "${AUTHOR_ASSOCIATION}" == "OWNER" || "${AUTHOR_ASSOCIATION}" == "COLLABORATOR" ]]; then
            should_poll=true
            reason="Trusted contributor PR is eligible; running CI status polling."
          elif [[ "${EVENT_ACTION}" == "labeled" && "${LABEL_NAME}" != "ok-to-test" ]]; then
            reason="Added label '${LABEL_NAME}' does not change CI eligibility."
          elif [[ "${EVENT_ACTION}" == "unlabeled" && "${LABEL_NAME}" != "needs-ok-to-test" ]]; then
            reason="Removed label '${LABEL_NAME}' does not change CI eligibility."
          else
            reason="PR is not yet labeled ok-to-test."
          fi

          echo "should_poll=${should_poll}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "${reason}"

      - name: Remove informational ci-passed label on close
        if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            // A closed PR cannot be merged, so the informational ci-passed
            // label must not linger on an unmergeable head. The SHA-bound
            // ci-passed commit status needs no action here: reconcile never
            // publishes success to a closed head, and any prior status is
            // historical (bound to a specific commit).
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: "ci-passed",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Mark ci-passed pending while current head is revalidated
        if: steps.eligibility.outputs.should_poll == 'true' && github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const sha = context.payload.pull_request.head.sha;

            // I1: a base-retarget revalidation marker (a ci-passed failure
            // whose description starts with "Base branch retargeted") must
            // survive label-only and reopen events on the same head SHA.
            // Overwriting it with "pending" here would let the reconcile step
            // re-derive success from CI results that were never revalidated
            // against the new base. Detect the marker before writing and
            // preserve it; only a real head update (synchronize) that re-runs
            // CI on a new SHA clears the requirement.
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            const ciPassed = statuses.find((s) => s.context === "ci-passed");
            const baseRevalidationRequired = Boolean(ciPassed &&
              ciPassed.state === "failure" &&
              (ciPassed.description || "").startsWith("Base branch retargeted"));
            if (baseRevalidationRequired) {
              core.info(`Preserving base-retarget revalidation marker on ${sha}; not marking pending.`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              context: "ci-passed",
              state: "pending",
              description: "CI Check is revalidating this commit.",
            });

      - name: Wait for action_required workflow runs to be approved
        id: approval_gate
        if: steps.eligibility.outputs.should_poll == 'true' && github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const headSha = context.payload.pull_request.head.sha;
            // Timing: approve window (60s) < this gate (300s) < allcheckspassed delay (5min)
            const maxAttempts = 31;
            const intervalMs = 10_000;
            const initialDelayMs = 15_000;

            const listRequest = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: "pull_request",
              status: "action_required",
              head_sha: headSha,
            };

            // Wait for GitHub to finish registering workflow runs before the first check
            core.info(`Waiting ${initialDelayMs / 1000}s for workflow runs to be registered...`);
            await new Promise(r => setTimeout(r, initialDelayMs));

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              core.info(`[Attempt ${attempt}/${maxAttempts}] Checking for action_required runs for ${headSha}`);
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, listRequest);

              if (runs.length === 0) {
                core.info("No action_required workflow runs found. All runs have been approved.");
                return;
              }

              core.info(`Found ${runs.length} action_required run(s): ${runs.map(r => r.name).join(', ')}`);

              if (attempt < maxAttempts) {
                core.info(`Waiting ${intervalMs / 1000}s for approval...`);
                await new Promise(r => setTimeout(r, intervalMs));
              }
            }

            core.setFailed(
              `${headSha} still has action_required workflow runs after ${(maxAttempts - 1) * intervalMs / 1000}s. ` +
              `CI cannot pass while workflows are awaiting approval.`
            );

      - name: Check if all CI checks passed
        id: poll
        if: steps.eligibility.outputs.should_poll == 'true' && steps.approval_gate.outcome == 'success' && github.event.action != 'closed'
        uses: wechuli/allcheckspassed@e4240aa9cc76fd6828ce27a71ad16c406c25adb3
        with:
          delay: '5'
          retries: '10'
          polling_interval: '5'
          # Exclude check runs created by the GitHub Copilot code review. Each
          # entry is an anchored regex matched against the check name by
          # allcheckspassed (app_id unset, so any app). Mapping (Copilot code
          # review job/check names): "Cleanup artifacts", "Upload results",
          # "Agent", "Prepare". Only "Cleanup artifacts" and "Upload results"
          # are confirmed from public Copilot code review runs; "Agent" and
          # "Prepare" follow the same naming scheme but are not independently
          # verifiable from this repo's source. RISK: app_id is unset, so an
          # anchored exact match also masks a genuinely required check of the
          # same name from any other app (single-word patterns are the widest).
          # Re-check names if Copilot renames its checks.
          checks_exclude: '^Cleanup artifacts$,^Upload results$,^Agent$,^Prepare$'
          # allcheckspassed authenticates via its `token` input (defaults to
          # github.token); a GITHUB_TOKEN env var is not read. The token is
          # scoped by this job's permissions above (checks: read, contents: read).
          token: ${{ github.token }}

      - name: Skip CI polling with success
        if: steps.eligibility.outputs.should_poll != 'true'
        run: echo "${{ steps.eligibility.outputs.reason }}"

      - name: Reconcile ci-passed status and informational label
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const prNumber = context.payload.pull_request.number;
            const eventHeadSha = context.payload.pull_request.head.sha;
            const eventBaseRef = context.payload.pull_request.base.ref;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pullRequest.state !== "open" ||
                pullRequest.head.sha !== eventHeadSha ||
                pullRequest.base.ref !== eventBaseRef) {
              core.info(`PR #${prNumber} closed, moved from ${eventHeadSha}, or retargeted from ${eventBaseRef}; this run will not publish.`);
              return;
            }

            const labels = new Set(pullRequest.labels.map((label) => label.name));
            const association = pullRequest.author_association;
            const eligible = !labels.has("needs-ok-to-test") && (
              labels.has("ok-to-test") ||
              pullRequest.user.login === "dependabot[bot]" ||
              association === "MEMBER" ||
              association === "OWNER" ||
              association === "COLLABORATOR"
            );

            // P1 #2: persist a base-retarget revalidation requirement. A base
            // change does not re-run pull_request CI, so the requirement must
            // survive label-only events until a head update revalidates CI.
            const baseRetargetEvent = context.payload.action === "edited" &&
              context.payload.changes &&
              context.payload.changes.base &&
              context.payload.changes.base.ref &&
              context.payload.changes.base.ref.from;
            let baseRevalidationRequired = false;
            {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: eventHeadSha,
              });
              const ciPassed = statuses.find((s) => s.context === "ci-passed");
              baseRevalidationRequired = Boolean(ciPassed &&
                ciPassed.state === "failure" &&
                (ciPassed.description || "").startsWith("Base branch retargeted"));
            }

            const passed = eligible &&
              "${{ steps.eligibility.outputs.should_poll }}" === "true" &&
              "${{ steps.poll.outcome }}" === "success" &&
              !baseRevalidationRequired;

            let state;
            let description;
            if (baseRetargetEvent || baseRevalidationRequired) {
              state = "failure";
              description = "Base branch retargeted; CI revalidation is required.";
            } else if (passed) {
              state = "success";
              description = "All CI checks passed on this exact commit.";
            } else {
              state = "failure";
              description = "CI checks did not pass or the PR requires revalidation.";
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: eventHeadSha,
              context: "ci-passed",
              state,
              description,
            });

            if (passed) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ["ci-passed"],
              });
              // Close the read-publish interleaving with a second
              // full-state read immediately after the mutation. Any drift
              // (head move, base change, close, or loss of eligibility)
              // publishes an explicit failure.
              const { data: afterLabel } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const afterLabels = new Set(afterLabel.labels.map((label) => label.name));
              const afterAssociation = afterLabel.author_association;
              const afterEligible = !afterLabels.has("needs-ok-to-test") && (
                afterLabels.has("ok-to-test") ||
                afterLabel.user.login === "dependabot[bot]" ||
                afterAssociation === "MEMBER" ||
                afterAssociation === "OWNER" ||
                afterAssociation === "COLLABORATOR"
              );
              if (afterLabel.state !== "open" ||
                  afterLabel.head.sha !== eventHeadSha ||
                  afterLabel.base.ref !== eventBaseRef ||
                  !afterEligible) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: "ci-passed",
                });
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: eventHeadSha,
                  context: "ci-passed",
                  state: "failure",
                  description: "PR state changed during reconciliation; CI revalidation is required.",
                });
              }
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: "ci-passed",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

  reconcile_workflow_run:
    # Reconcile ci-passed when a trusted constituent workflow completes. Skip
    # our own CI Check run and housekeeping/approval workflows; only trusted
    # constituent workflows re-derive the aggregate from current check state.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name != 'CI Check' &&
      github.event.workflow_run.name != 'Approve Workflow Runs' &&
      github.event.workflow_run.name != 'Mark stale issues and pull requests' &&
      github.event.workflow_run.name != 'CI Health Report'
    concurrency:
      group: ci-passed-reconcile-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Resolve pull request for workflow_run head SHA
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const headRepository = context.payload.workflow_run.head_repository;
            const headBranch = context.payload.workflow_run.head_branch;

            let matched = "false";
            let prNumber = "";
            let prBaseRef = "";

            if (headRepository && headBranch) {
              try {
                const { data: pulls } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: `${headRepository.owner.login}:${headBranch}`,
                  state: "open",
                });
                const pr = pulls.find((p) => p.head.sha === headSha);
                if (pr) {
                  matched = "true";
                  prNumber = String(pr.number);
                  prBaseRef = pr.base.ref;
                }
              } catch (error) {
                core.info(`SHA-to-PR mapping failed: ${error.message}`);
              }
            }

            core.setOutput("matched", matched);
            core.setOutput("pr_number", prNumber);
            core.setOutput("pr_base_ref", prBaseRef);
            core.info(`workflow_run head ${headSha} maps to PR ${prNumber || "(none)"} (matched=${matched})`);

      - name: Read current ci-passed status for the workflow_run head SHA
        id: status
        if: steps.resolve.outputs.matched == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const conclusion = context.payload.workflow_run.conclusion;

            // Only genuine check failures (failure/timed_out) force a re-poll
            // to re-derive the aggregate from current check state. Cancelled,
            // skipped, neutral, and action_required completions are not check
            // failures and must not redden a green gate. A success completion
            // re-polls when the current ci-passed status is failure, pending,
            // or absent, so a successful re-run can clear a stale red or a
            // stuck pending.
            let needsRepoll = "false";
            if (conclusion === "failure" || conclusion === "timed_out") {
              needsRepoll = "true";
            } else if (conclusion === "success") {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });
              const ciPassed = statuses.find((s) => s.context === "ci-passed");
              needsRepoll = !ciPassed ||
                ciPassed.state === "failure" ||
                ciPassed.state === "pending" ? "true" : "false";
            }

            core.setOutput("needs_repoll", needsRepoll);
            core.info(`workflow_run head ${headSha}: needs_repoll=${needsRepoll} (conclusion=${conclusion})`);

      - name: Re-poll all CI checks for the workflow_run head SHA
        id: repoll
        if: steps.resolve.outputs.matched == 'true' && steps.status.outputs.needs_repoll == 'true'
        uses: wechuli/allcheckspassed@e4240aa9cc76fd6828ce27a71ad16c406c25adb3
        with:
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          delay: '5'
          retries: '10'
          polling_interval: '5'
          # Exclude check runs created by the GitHub Copilot code review. Each
          # entry is an anchored regex matched against the check name by
          # allcheckspassed (app_id unset, so any app). Mapping (Copilot code
          # review job/check names): "Cleanup artifacts", "Upload results",
          # "Agent", "Prepare". Only "Cleanup artifacts" and "Upload results"
          # are confirmed from public Copilot code review runs; "Agent" and
          # "Prepare" follow the same naming scheme but are not independently
          # verifiable from this repo's source. RISK: app_id is unset, so an
          # anchored exact match also masks a genuinely required check of the
          # same name from any other app (single-word patterns are the widest).
          # Re-check names if Copilot renames its checks.
          checks_exclude: '^Cleanup artifacts$,^Upload results$,^Agent$,^Prepare$'
          # allcheckspassed authenticates via its `token` input (defaults to
          # github.token); a GITHUB_TOKEN env var is not read. The token is
          # scoped by this job's permissions above (checks: read, contents: read).
          token: ${{ github.token }}

      - name: Reconcile ci-passed for the workflow_run head SHA
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 3
          script: |
            const matched = "${{ steps.resolve.outputs.matched }}";
            const headSha = context.payload.workflow_run.head_sha;
            const conclusion = context.payload.workflow_run.conclusion;

            if (matched !== "true") {
              core.info(`No reconcile needed (matched=${matched}).`);
              return;
            }

            const prNumber = Number("${{ steps.resolve.outputs.pr_number }}");
            const resolvedBaseRef = "${{ steps.resolve.outputs.pr_base_ref }}";

            // Publish onto the event's own SHA only; never onto the live PR
            // head. Re-read live PR state immediately before publishing.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pullRequest.state !== "open" ||
                pullRequest.head.sha !== headSha ||
                pullRequest.base.ref !== resolvedBaseRef) {
              core.info(`PR #${prNumber} moved/closed/retargeted from ${headSha}; not publishing for a stale SHA.`);
              return;
            }

            // Only an eligible PR can earn the gate. needs-ok-to-test rejects
            // unconditionally; otherwise eligible iff ok-to-test, a Dependabot
            // PR, or a trusted (MEMBER/OWNER/COLLABORATOR) author.
            const labels = new Set(pullRequest.labels.map((label) => label.name));
            const association = pullRequest.author_association;
            const eligible = !labels.has("needs-ok-to-test") && (
              labels.has("ok-to-test") ||
              pullRequest.user.login === "dependabot[bot]" ||
              association === "MEMBER" ||
              association === "OWNER" ||
              association === "COLLABORATOR"
            );

            // Honor the P1#2 base-retarget revalidation marker. A base
            // change does not re-run pull_request CI, so the marker must
            // persist on the head SHA and block any re-derivation back to
            // success until the head is updated and revalidated.
            let baseRevalidationRequired = false;
            let currentStatusIsSuccess = false;
            {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });
              const ciPassed = statuses.find((s) => s.context === "ci-passed");
              baseRevalidationRequired = Boolean(ciPassed &&
                ciPassed.state === "failure" &&
                (ciPassed.description || "").startsWith("Base branch retargeted"));
              currentStatusIsSuccess = Boolean(ciPassed && ciPassed.state === "success");
            }

            if (baseRevalidationRequired) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                context: "ci-passed",
                state: "failure",
                description: "Base branch retargeted; CI revalidation is required.",
              });
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: "ci-passed",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              core.info(`Base branch retargeted for ${headSha}; revalidation is required.`);
              return;
            }

            // An ineligible PR can never hold a green gate. Publish failure
            // and drop the label even when the re-poll is green, so a
            // needs-ok-to-test added after a green cannot survive a
            // workflow_run completion.
            if (!eligible) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                context: "ci-passed",
                state: "failure",
                description: "CI checks did not pass or the PR requires revalidation.",
              });
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: "ci-passed",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              core.info(`PR #${prNumber} is ineligible; published failure for ${headSha}.`);
              return;
            }

            // Only genuine check conclusions (failure, timed_out, success)
            // re-derive the aggregate. Cancelled, skipped, neutral, and
            // action_required completions are not check results and must not
            // redden a green gate.
            if (conclusion !== "failure" &&
                conclusion !== "timed_out" &&
                conclusion !== "success") {
              core.info(`Workflow run conclusion ${conclusion} is not a check result; not reconciling.`);
              return;
            }

            // A success conclusion re-polls when the current ci-passed status
            // is failure, pending, or absent. Only an already-green status is
            // a no-op; anything else re-derives from the re-poll.
            if (conclusion === "success" && currentStatusIsSuccess) {
              core.info(`Current ci-passed status is already success; no reconcile needed.`);
              return;
            }

            const pollPassed = "${{ steps.repoll.outcome }}" === "success";
            const passed = eligible && pollPassed;
            const state = passed ? "success" : "failure";
            const description = passed
              ? "All CI checks passed on this exact commit."
              : "CI checks did not pass or the PR requires revalidation.";

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              context: "ci-passed",
              state,
              description,
            });

            if (state === "success") {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ["ci-passed"],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: "ci-passed",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
