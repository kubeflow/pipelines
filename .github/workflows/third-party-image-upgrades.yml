name: SeaweedFS and Metacontroller candidate comparison
on:
  workflow_dispatch:
permissions:
  contents: read
cache-mode: none
env:
  PYTHONPATH: tooling/release:source/.github/resources/scripts:experiment/.github/resources/scripts/external_compare
  CHECKS: experiment/.github/resources/scripts/external_compare
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: [metacontroller-baseline, metacontroller-combined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: experiment
          sparse-checkout: .github/resources/scripts/external_compare
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 62b3ef0d3a97be1c916def4058e8034036b16e06
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f7422e1e7ed1eb64e6d2a1b5f0b1de105b221e79
          path: source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 boto3==1.40.76 requests==2.33.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376
        with:
          install_only: true
          version: v0.32.0
          kubectl_version: v1.36.1
      - name: Install checksum-verified Kustomize and Buildx
        run: |
          curl -fsSL --retry 5 --retry-all-errors \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/kustomize.tar.gz"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          bash tooling/.github/resources/scripts/setup-buildx-with-retry.sh
      - name: Test probe assertions
        run: python -m unittest discover -s "$CHECKS" -p '*_test.py'
      - name: Exercise pinned release runtime compatibility
        env:
          LANE: ${{ matrix.lane }}
        run: |
          if [ "$LANE" = seaweed-upgrade ]; then
            python "$CHECKS/seaweed_compat.py" --source source --pairs "$CHECKS/pairs.json" --evidence evidence
          else
            seaweed=baseline
            if [ "$LANE" = metacontroller-combined ]; then seaweed=candidate; fi
            python "$CHECKS/metacontroller_compat.py" --source source --pairs "$CHECKS/pairs.json" --evidence evidence --seaweed "$seaweed"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: external-compatibility-${{ matrix.lane }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
