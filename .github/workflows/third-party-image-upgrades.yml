name: Third-party archive diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
cache-mode: none
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 62b3ef0d3a97be1c916def4058e8034036b16e06
          persist-credentials: false
      - name: Reproduce archive validation without changing images
        env:
          IMAGE: quay.io/jetstack/cert-manager-acmesolver@sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
          PYTHONPATH: release
        run: |
          mkdir evidence
          docker version > evidence/docker-version.txt
          docker info > evidence/docker-info.txt
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" > evidence/image.json
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          docker save --output evidence/image.tar "$image_id"
          python3 - <<'PY'
          import json,tarfile
          from pathlib import Path
          from kfpr.osv_image_scan import verify_archive
          root=Path('evidence')
          image=json.loads((root/'image.json').read_text())[0]
          with tarfile.open(root/'image.tar') as tar:
              members=tar.getmembers()
              (root/'members.json').write_text(json.dumps([{'name':m.name,'type':m.type.decode(),'link':m.linkname,'size':m.size} for m in members],indent=2))
              for name in ['manifest.json','index.json']:
                  (root/name).write_bytes(tar.extractfile(name).read())
          try:
              digest=verify_archive(root/'image.tar',image['Id'],'linux/amd64')
              result={'passed':True,'archive_sha256':digest}
          except Exception as e:
              result={'passed':False,'error':str(e)}
          print(json.dumps(result))
          (root/'result.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cert-manager-archive-diagnostic
          path: evidence/
          retention-days: 7
