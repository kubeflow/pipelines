name: Third-party Image Upgrade Checks
on:
  pull_request:
    paths:
      - 'manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/**'
      - 'manifests/kustomize/third-party/seaweedfs/**'
      - 'manifests/kustomize/third-party/argo/**'
      - '.github/resources/scripts/third_party_upgrade_*.py'
      - '.github/workflows/third-party-image-upgrades.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: third-party-image-upgrades-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 boto3==1.40.76 pytest==8.4.2 requests==2.33.0
      - uses: helm/kind-action@v1.15.0
        with:
          install_only: true
          version: v0.32.0
          kubectl_version: v1.36.1
      - name: Install checksum-verified Kustomize
        run: |
          curl -fsSL --retry 5 --retry-all-errors \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/kustomize.tar.gz"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test compatibility assertions and profile reconciliation
        env:
          AWS_ACCESS_KEY_ID: compatibility
          AWS_SECRET_ACCESS_KEY: compatibility
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -m unittest discover -s .github/resources/scripts -p 'third_party_upgrade_compatibility_test.py'
          python -m pytest manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/test_sync.py
      - name: Upgrade the persistent store and exercise the actual profile image
        run: python .github/resources/scripts/third_party_upgrade_compatibility.py --evidence compatibility-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: third-party-upgrade-compatibility-${{ github.run_attempt }}
          path: compatibility-evidence
          if-no-files-found: error
          retention-days: 7
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [profile-controller, seaweedfs, argo-controller, argo-executor]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'release-2.18' }}
          path: baseline
          persist-credentials: false
      # Reuse the production OSV acquisition and full-evidence validation code.
      - uses: actions/checkout@v7
        with:
          ref: a8cea873385c8b98e0d65cb87c3c432296beb1da
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r tooling/.github/scripts/requirements.txt
      - uses: ./tooling/.github/actions/setup-osv-scanner
        with:
          arch: amd64
      - name: Verify scan evidence contracts
        env:
          PYTHONPATH: tooling/release:.github/resources/scripts
        run: python -m unittest third_party_upgrade_scan_test
      - name: Scan immutable baseline and candidate images
        env:
          PYTHONPATH: tooling/release
          TARGET: ${{ matrix.target }}
        run: |
          python .github/resources/scripts/third_party_upgrade_scan.py \
            --baseline baseline --candidate . --target "$TARGET" --output evidence
          cat evidence/comparison.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: third-party-upgrade-osv-${{ matrix.target }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
