name: Istio Image Scan Comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [pilot, proxyv2, install-cni]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - uses: ./.github/actions/setup-osv-scanner
        with:
          arch: amd64
      - name: Scan baseline and candidate by immutable image ID
        env:
          PYTHONPATH: release:.github/resources/scripts
          COMPONENT: ${{ matrix.component }}
        run: python .github/resources/scripts/istio_scan_comparison.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: istio-${{ matrix.component }}-${{ github.run_attempt }}
          path: istio-evidence
          if-no-files-found: error
          retention-days: 7
