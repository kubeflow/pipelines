name: Create Multi-Arch Manifest
on:
  workflow_call:
    inputs:
      target_tag:
        type: string
        description: 'Target Image Tag'
        required: true
      app_to_build:
        type: string
        description: 'Provide the app name'
        required: true
      source_sha:
        type: string
        description: 'Immutable source commit shared by every platform build'
        required: true
      expected_platforms:
        type: string
        description: 'Exact comma-separated runnable platforms expected in the index'
        required: true
      set_latest:
        type: string
        default: 'true'
        description: 'Set latest tag'
        required: false

env:
  TARGET_IMAGE_TAG: ${{ inputs.target_tag }}
  IMAGE_REGISTRY: ghcr.io
  IMAGE_ORG: ${{ github.repository_owner }}
  APP_NAME: ${{ inputs.app_to_build }}
  SET_LATEST: ${{ inputs.set_latest }}

jobs:
  create-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download digests
        uses: ./.github/actions/download-artifact-with-retry
        with:
          path: /tmp/digests
          pattern: digests-${{ env.APP_NAME }}-*-${{ github.run_attempt }}
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # imagetools only reads and writes registry manifests. Use the
          # daemon-backed driver so this job does not pull a BuildKit image.
          driver: docker

      - name: Create, verify, and publish manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_PLATFORMS: ${{ inputs.expected_platforms }}
          RUN_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 .github/resources/scripts/publish_image_index.py \
            --image "${IMAGE_REGISTRY}/${IMAGE_ORG}/${APP_NAME}" \
            --source-sha "$SOURCE_SHA" --platforms "$EXPECTED_PLATFORMS" \
            --digests /tmp/digests --run-tag "$RUN_TAG" \
            --target-tag "$TARGET_IMAGE_TAG" --set-latest "$SET_LATEST" \
            --output "/tmp/published-index/${APP_NAME}.json"

      - name: Upload verified index reference
        uses: actions/upload-artifact@v7
        with:
          name: published-index-${{ inputs.app_to_build }}-${{ github.run_attempt }}
          path: /tmp/published-index/${{ inputs.app_to_build }}.json
          if-no-files-found: error
          retention-days: 1
