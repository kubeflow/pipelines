name: KFP Webhook Integration

on:
  push:
    branches:
      - master
      - main
  pull_request:
    paths:
      - '.github/actions/create-cluster/**'
      - '.github/actions/deploy/**'
      - '.github/actions/download-artifact-with-retry/**'
      - '.github/resources/**'
      - '.github/workflows/kfp-webhooks.yml'
      - '.github/workflows/image-builds.yml'
      - 'backend/**'
      - '!**/*.md'
      - '!**/OWNERS'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/image-builds.yml

  webhook-tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        k8s_version: [ "v1.33.12", "v1.36.1" ]
    name: KFP Webhooks - K8s ${{ matrix.k8s_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create KFP cluster
        id: create-kfp-cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: ${{ matrix.k8s_version }}
        continue-on-error: true

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        if: ${{ steps.create-kfp-cluster.outcome == 'success' }}
        with:
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
          pipeline_store: kubernetes

      - name: Run Webhook Integration Tests
        id: tests
        if: ${{ steps.deploy.outcome == 'success' }}
        run: |
          export GOPROXY="${GOPROXY:-https://proxy.golang.org|direct}"
          make -C backend/test/v2/integration test-webhook
        continue-on-error: true

      - name: Collect failed logs
        if: ${{ steps.create-kfp-cluster.outcome != 'success' || steps.deploy.outcome != 'success' || steps.tests.outcome != 'success' }}
        run: |
          ./.github/resources/scripts/collect-logs.sh --ns kubeflow --output /tmp/tmp_pod_log.txt
          exit 1

      - name: Collect test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kfp-samples-tests-artifacts-k8s-${{ matrix.k8s_version }}
          path: /tmp/tmp*/*
