name: Check Python dependency artifacts

on:
  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact queue candidate SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_ref:
        description: Queue target branch, master or main (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_sha:
        description: Current target branch SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
  merge_group:
    types: [checks_requested]
    branches: [master, main]
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements.txt'
      - '**/pyproject.toml'
      - 'sdk/python/**'
      - '**/requirements.txt'
      - '.github/workflows/check-requirements-txt.yml'
      - 'release/kfpr/steps.py'
      - '.github/resources/scripts/export_python_requirements.sh'

permissions:
  contents: read

jobs:
  queue-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    permissions:
      contents: read
    uses: ./.github/workflows/queue-dispatch-guard.yml
    with:
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_ref: ${{ inputs.queue_base_ref }}
      queue_base_sha: ${{ inputs.queue_base_sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
      - name: Check and install the frozen workspace
        run: |
          uv lock --check
          uv sync --python 3.11 --frozen --no-dev
      - name: Build SDK distributions
        run: uv build --package kfp --out-dir "$RUNNER_TEMP/python-dist"
      - name: Check pip artifacts in a clean environment
        run: |
          bash .github/resources/scripts/export_python_requirements.sh "$RUNNER_TEMP/python-exports"
          uv venv --python 3.11 --seed "$RUNNER_TEMP/pip-compat"
          for requirements in "$RUNNER_TEMP/python-exports/"*.txt; do
            "$RUNNER_TEMP/pip-compat/bin/python" -m pip install \
              --dry-run --ignore-installed -r "$requirements"
          done
          "$RUNNER_TEMP/pip-compat/bin/python" -m pip install "$RUNNER_TEMP/python-dist/"*.whl
          "$RUNNER_TEMP/pip-compat/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pip-compat/bin/python" -c 'import kfp; import kfp.dsl; import kfp.kubernetes; import kfp.server_api; import kfp.pipeline_spec.pipeline_spec_pb2'
