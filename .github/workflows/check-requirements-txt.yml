name: Check uv.lock and requirements.txt sync

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements.txt'
      - '**/pyproject.toml'
      - '**/requirements.txt'
      - '.github/workflows/check-requirements-txt.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check requirements exports
        run: |
          uv export --frozen --no-dev --format requirements-txt -o requirements.txt
          uv export --frozen --no-dev --package kfp --format requirements-txt -o sdk/python/requirements.txt
          uv export --frozen --no-dev --package kfp-kubernetes --format requirements-txt -o kubernetes_platform/python/requirements.txt
          uv export --frozen --no-dev --package kfp-pipeline-spec --format requirements-txt -o api/v2alpha1/python/requirements.txt
          git diff --exit-code -- requirements.txt sdk/python/requirements.txt \
            kubernetes_platform/python/requirements.txt api/v2alpha1/python/requirements.txt
