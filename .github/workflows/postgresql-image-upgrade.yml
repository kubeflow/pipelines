name: PostgreSQL image retained-data upgrade

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - manifests/kustomize/third-party/postgresql/**
      - backend/src/apiserver/client_manager/**
      - backend/src/apiserver/common/**
      - backend/src/apiserver/model/**
      - backend/src/apiserver/storage/**
      - go.mod
      - go.sum
      - .github/resources/postgresql-upgrade/**
      - .github/resources/scripts/postgresql_image_upgrade*
      - .github/workflows/postgresql-image-upgrade.yml
      - .github/actions/create-cluster/**
      - .github/actions/setup-go/**
      - .github/actions/setup-python-pip-cache/**
  merge_group:
    types: [checks_requested]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Retained PostgreSQL ${{ matrix.major }} data (image compatibility only)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        major: ['18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-python-pip-cache
        with:
          python-version: '3.13'
          cache-scope: postgresql-image-upgrade
          cache-dependency-hash: ${{ hashFiles('.github/scripts/requirements.txt') }}
      - name: Install manifest parser
        run: python -m pip install PyYAML==6.0.3
      - name: Build real KFP database initialization helper
        run: go build -o /tmp/kfp-schema .github/resources/postgresql-upgrade/kfp-schema.go
      - uses: ./.github/actions/create-cluster
        with:
          k8s_version: v1.36.1
          cluster_name: postgres-upgrade
      - name: Upgrade using the rendered deployment and retained PVC
        shell: bash
        env:
          PG_MAJOR: ${{ matrix.major }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/postgresql-upgrade
          python .github/resources/scripts/postgresql_image_upgrade.py \
            --lane "$PG_MAJOR" --output /tmp/postgresql-upgrade \
            2>&1 | tee /tmp/postgresql-upgrade/acceptance.log
          python -c 'import json; assert json.load(open("/tmp/postgresql-upgrade/receipt.json"))["status"] == "passed"'
      - name: Preserve rendered resources, receipt, logs and volume events
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: postgresql-${{ matrix.major }}-retained-data
          path: /tmp/postgresql-upgrade
          if-no-files-found: warn
