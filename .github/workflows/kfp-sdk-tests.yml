name: MQ cap fixture kfp-sdk-tests
on:
  merge_group:
    types: [checks_requested]
    branches: [codex-mq-cap-test-20261114]
  workflow_dispatch:
    inputs:
      queue_head_sha:
        type: string
        required: true
      queue_base_ref:
        type: string
        required: true
      queue_base_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify isolated queue identity
        env:
          EXPECTED_HEAD: ${{ inputs.queue_head_sha || github.event.merge_group.head_sha }}
          EXPECTED_BASE: ${{ inputs.queue_base_ref || github.event.merge_group.base_ref }}
          ACTUAL_HEAD: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          test "$EXPECTED_HEAD" = "$ACTUAL_HEAD"
          case "$ACTUAL_REF" in refs/heads/gh-readonly-queue/codex-mq-cap-test-20261114/*) ;; *) exit 1;; esac
          case "$EXPECTED_BASE" in codex-mq-cap-test-20261114|refs/heads/codex-mq-cap-test-20261114) ;; *) exit 1;; esac
          sleep 2
