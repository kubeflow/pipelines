# Keep the legacy file path: CI Check matches paths from the PR base.
name: Python Ruff Lint

on:
  push:
    branches: [master]

  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - '**/*.py'
      - '**/*.pyi'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'test/presubmit-ruff.sh'
      - '.github/workflows/sdk-isort.yml'
      - '.github/actions/setup-python/**'
      - '!**/*.md'
      - '!**/OWNERS'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'

      - name: Check Python imports and escapes with Ruff
        run: uv run --frozen --extra lint ruff check .
