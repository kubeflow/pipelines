name: Upgrade readiness tool

on:
  pull_request:
    paths:
      - tools/upgrade-readiness/**
      - .github/workflows/upgrade-readiness.yml
  push:
    branches: [master]
    paths:
      - tools/upgrade-readiness/**
      - .github/workflows/upgrade-readiness.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standalone readiness tests
        run: python3 -m unittest discover -s tools/upgrade-readiness -p 'test_*.py' -v
