name: Upgrade readiness tool

on:
  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact queue candidate SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_ref:
        description: Queue target branch, release-2.18 (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_sha:
        description: Current target branch SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
  merge_group:
    types: [checks_requested]
    branches: [release-2.18]
  pull_request:
    paths:
      - tools/upgrade-readiness/**
      - .github/workflows/upgrade-readiness.yml
      - .github/resources/scripts/readiness-schedules.sh
      - .github/resources/scripts/readiness-adoption.sh
      - .github/resources/scripts/readiness-reporting.sh
  push:
    branches: [release-2.18]
    paths:
      - tools/upgrade-readiness/**
      - .github/workflows/upgrade-readiness.yml
      - .github/resources/scripts/readiness-schedules.sh
      - .github/resources/scripts/readiness-adoption.sh
      - .github/resources/scripts/readiness-reporting.sh

permissions:
  contents: read

jobs:
  queue-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    permissions:
      contents: read
    uses: ./.github/workflows/queue-dispatch-guard.yml
    with:
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_ref: ${{ inputs.queue_base_ref }}
      queue_base_sha: ${{ inputs.queue_base_sha }}

  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standalone readiness tests
        run: python3 -m unittest discover -s tools/upgrade-readiness -p 'test_*.py' -v

  reporting-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Test reporting proxy and concurrency
        run: go test -race ./tools/upgrade-readiness/reporting-proxy

  policy-conformance:
    name: Pinned policy code conformance (not live upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Checkout modeled policy source
        uses: actions/checkout@v7
        with:
          # Keep synchronized with schedule_policy.POLICY_SOURCE. This proposed
          # policy is not a claim that the release branch contains it.
          ref: 8a0aa285b4440505b20c8b2d84bbd4f0bacaba3a
          path: policy-source
      # Use the repository-managed compiler; the tested backend source stays pinned.
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Download pinned policy dependencies
        run: python3 tools/upgrade-readiness/download_policy_dependencies.py --backend-source policy-source
      - name: Compare predictions with backend policy
        run: python3 tools/upgrade-readiness/conformance.py --backend-source policy-source
