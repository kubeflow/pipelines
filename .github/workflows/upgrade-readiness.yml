name: Upgrade readiness tool

on:
  pull_request:
    paths:
      - tools/upgrade-readiness/**
      - .github/workflows/upgrade-readiness.yml
      - .github/resources/scripts/readiness-schedules.sh
  push:
    branches: [master]
    paths:
      - tools/upgrade-readiness/**
      - .github/workflows/upgrade-readiness.yml
      - .github/resources/scripts/readiness-schedules.sh

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standalone readiness tests
        run: python3 -m unittest discover -s tools/upgrade-readiness -p 'test_*.py' -v

  policy-conformance:
    name: Pinned policy code conformance (not live upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Checkout modeled policy source
        uses: actions/checkout@v7
        with:
          # Keep synchronized with schedule_policy.POLICY_SOURCE. This proposed
          # policy is not a claim that the release branch contains it.
          ref: 8a0aa285b4440505b20c8b2d84bbd4f0bacaba3a
          path: policy-source
      # Use the repository-managed compiler; the tested backend source stays pinned.
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare predictions with backend policy
        run: python3 tools/upgrade-readiness/conformance.py --backend-source policy-source

  source-observation:
    name: Pinned 2.17.2 observation adapter (not live upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Checkout exact observation source
        uses: actions/checkout@v7
        with:
          ref: 2511cdbd74cd531c6633f2e094d235082a32917d
          path: observation-source
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply source adapter after exact revision and cleanliness checks
        run: python3 tools/upgrade-readiness/observation/apply_adapter.py --source observation-source --apply
      - name: Check bounded recorder and source request boundaries
        working-directory: observation-source
        run: |
          go test -race ./backend/src/apiserver/readinessobservation
          go test ./backend/src/apiserver/server ./backend/src/apiserver/resource ./backend/src/apiserver -run 'Test.*(Authoriz|Upload|CreateRun|CreateJob|Recurring|RunLog|Artifact)' -count=1
