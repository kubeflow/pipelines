name: PR Gate

on:
  pull_request_target:
    types: [opened, labeled, unlabeled, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-pr-author:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'copybara-service[bot]'
    concurrency:
      group: pr-gate-check-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted admission script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/pr-gate.cjs
          sparse-checkout-cone-mode: false
      - name: Evaluate PR admission
        uses: actions/github-script@v9
        with:
          script: |
            const { handlePrGate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-gate.cjs`);
            const result = await handlePrGate({ github, context });
            core.info(JSON.stringify(result));
            if (result.status === 'closed') {
              core.setFailed('PR admission requires a linked ready issue or a maintainer /allow override.');
            }

  allow-pr:
    # This is only a scheduling filter; the trusted script validates the exact command and permissions.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/allow')
    concurrency:
      # A label/push event or another comment must not replace a pending /allow command.
      group: pr-gate-allow-${{ github.event.issue.number }}-${{ github.event.comment.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted admission script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/pr-gate.cjs
          sparse-checkout-cone-mode: false
      - name: Apply maintainer admission override
        uses: actions/github-script@v9
        with:
          script: |
            const { handlePrGate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-gate.cjs`);
            const result = await handlePrGate({ github, context });
            core.info(JSON.stringify(result));
