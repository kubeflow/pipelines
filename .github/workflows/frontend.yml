name: Frontend Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/**'
      - 'test/seaweedfs/artifact_authorization*'
      - 'test/seaweedfs/external_storage*'
      - 'test/artifact-proxy/*external_storage*'
      - 'manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/sync.py'
      - 'api/v2alpha1/*.proto'
      - 'kubernetes_platform/proto/*.proto'
      - 'backend/api/v2/swagger/**'
      - '.github/workflows/frontend.yml'
      - '!**/*.md'
      - '!**/OWNERS'
      - 'backend/src/apiserver/config/sample_config.json'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: frontend/.nvmrc

    - name: Set up Python for profile-controller regression tests
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.13'

    - name: Set up npm
      working-directory: frontend
      run: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
        npm --version

    - name: Check for toolchain version drift
      if: github.event_name == 'pull_request'
      run: |
        git fetch origin ${{ github.base_ref }} --depth=1
        git fetch --deepen=100 2>/dev/null || true
        cd frontend && node scripts/check-lockfile-drift.mjs --base-ref "origin/${{ github.base_ref }}"

    - name: Clean npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: cd ./frontend && npm ci

    - name: Verify generated API clients are up to date
      run: |
        cd ./frontend
        npm run apis:all
        git diff --exit-code -- \
          src/apis \
          src/apisv2 \
          server/src/generated/apis \
          server/src/generated/apisv2

    - name: Verify pipeline and platform spec generation
      working-directory: frontend
      run: |
        # Protobuf only needs Ubuntu sources, not the runner's third-party repositories.
        test -s /etc/apt/sources.list.d/ubuntu.sources
        apt_sources=(
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=-
        )
        sudo apt-get "${apt_sources[@]}" update
        sudo apt-get "${apt_sources[@]}" install --yes protobuf-compiler
        bash scripts/check-spec-generation.sh

    - name: Run Frontend Tests
      run: cd ./frontend && npm run test:ci

    - name: Verify artifact authorization against real namespace storage
      timeout-minutes: 10
      run: |
        python -m venv /tmp/kfp-artifact-storage-test
        /tmp/kfp-artifact-storage-test/bin/pip install 'boto3==1.35.99'
        PYTHON=/tmp/kfp-artifact-storage-test/bin/python bash test/seaweedfs/artifact_authorization_test.sh

    - name: Verify external artifact storage with rotating session credentials
      timeout-minutes: 10
      run: |
        PYTHON=/tmp/kfp-artifact-storage-test/bin/python bash test/seaweedfs/external_storage_test.sh --evidence "$RUNNER_TEMP/external-storage-evidence.json"

    - name: Upload external artifact storage evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: external-artifact-storage-evidence
        path: ${{ runner.temp }}/external-storage-evidence.json
        if-no-files-found: ignore

    - name: Verify production bundle startup
      working-directory: frontend
      run: |
        npx playwright install --with-deps chromium
        npm run test:bundle
