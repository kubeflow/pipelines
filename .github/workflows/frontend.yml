name: Frontend Tests

on:
  merge_group:
    types: [checks_requested]
    branches: [release-2.18]
  push:
    branches:
      - master
      - release-2.18
  pull_request:
    branches:
      - master
      - release-2.18
    paths:
      - 'frontend/**'
      - 'manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/sync.py'
      - 'api/v2alpha1/*.proto'
      - 'kubernetes_platform/proto/*.proto'
      - 'backend/api/v1beta1/swagger/**'
      - 'backend/api/v2beta1/swagger/**'
      - '.github/workflows/frontend.yml'
      - '!**/*.md'
      - '!**/OWNERS'
      - 'backend/src/apiserver/config/sample_config.json'


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: frontend/.nvmrc

    - name: Set up Python for profile-controller regression tests
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Set up npm
      working-directory: frontend
      run: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
        npm --version

    - name: Check for toolchain version drift
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      env:
        BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      run: |
        cd frontend && node scripts/check-lockfile-drift.mjs --base-ref "$BASE_SHA"

    - name: Clean npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: cd ./frontend && npm ci

    - name: Verify generated API clients are up to date
      run: |
        cd ./frontend
        npm run apis:all
        git diff --exit-code -- \
          src/apis \
          src/apisv2beta1 \
          server/src/generated/apis \
          server/src/generated/apisv2beta1

    - name: Verify pipeline and platform spec generation
      working-directory: frontend
      run: |
        # Protobuf only needs Ubuntu sources, not the runner's third-party repositories.
        test -s /etc/apt/sources.list.d/ubuntu.sources
        apt_sources=(
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=-
        )
        sudo apt-get "${apt_sources[@]}" update
        sudo apt-get "${apt_sources[@]}" install --yes protobuf-compiler
        bash scripts/check-spec-generation.sh

    - name: Run Frontend Tests
      run: cd ./frontend && npm run test:ci
