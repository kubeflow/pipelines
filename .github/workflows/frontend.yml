name: Frontend Tests

on:
  merge_group:
    types: [checks_requested]
    branches: [master]
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - 'manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/sync.py'
      - 'api/v2alpha1/*.proto'
      - 'kubernetes_platform/proto/*.proto'
      - 'backend/api/v2/swagger/**'
      - '.github/workflows/frontend.yml'
      - '!**/*.md'
      - '!**/OWNERS'
      - 'backend/src/apiserver/config/sample_config.json'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [static, ui, server, bundle]
    env:
      CI: 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: frontend/.nvmrc
        cache: npm
        cache-dependency-path: |
          frontend/package-lock.json
          frontend/server/package-lock.json
          frontend/mock-backend/package-lock.json

    - name: Set up Python for profile-controller regression tests
      if: matrix.check == 'server'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.13'

    - name: Set up npm
      working-directory: frontend
      run: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
        npm --version

    - name: Check for toolchain version drift
      if: matrix.check == 'static' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
      env:
        BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      run: |
        git fetch origin "$BASE_SHA" --depth=1
        git fetch --deepen=100 2>/dev/null || true
        cd frontend && node scripts/check-lockfile-drift.mjs --base-ref "$BASE_SHA"

    - name: Install dependencies
      working-directory: frontend
      # Recover the intermittent npm cache race without discarding warm caches.
      run: npm ci || (npm cache clean --force && npm ci)

    - name: Verify generated API clients are up to date
      if: matrix.check == 'static'
      run: |
        cd ./frontend
        npm run apis:all
        git diff --exit-code -- \
          src/apis \
          src/apisv2 \
          server/src/generated/apis \
          server/src/generated/apisv2

    - name: Verify pipeline and platform spec generation
      if: matrix.check == 'static'
      working-directory: frontend
      run: |
        # Protobuf only needs Ubuntu sources, not the runner's third-party repositories.
        test -s /etc/apt/sources.list.d/ubuntu.sources
        apt_sources=(
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=-
        )
        sudo apt-get "${apt_sources[@]}" update
        sudo apt-get "${apt_sources[@]}" install --yes protobuf-compiler
        bash scripts/check-spec-generation.sh

    - name: Run static checks
      if: matrix.check == 'static'
      working-directory: frontend
      run: npm run test:static

    - name: Run UI tests
      if: matrix.check == 'ui'
      working-directory: frontend
      run: npm run test:ui:coverage

    - name: Run server tests
      if: matrix.check == 'server'
      working-directory: frontend
      run: npm run test:server:coverage

    - name: Verify production bundle startup
      if: matrix.check == 'bundle'
      working-directory: frontend
      run: |
        npx playwright install --with-deps chromium
        npm run test:bundle:ci

  # Preserve the existing check name and require every matrix lane to pass.
  frontend-tests:
    needs: frontend-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all frontend checks
        env:
          CHECK_RESULT: ${{ needs.frontend-checks.result }}
        run: test "$CHECK_RESULT" = success
