name: Frontend Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/**'
      - 'manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/sync.py'
      - 'api/v2alpha1/*.proto'
      - 'kubernetes_platform/proto/*.proto'
      - 'backend/api/v2beta1/swagger/**'
      - '.github/workflows/frontend.yml'
      - '!**/*.md'
      - '!**/OWNERS'
      - 'backend/src/apiserver/config/sample_config.json'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: frontend/.nvmrc

    - name: Set up Python for profile-controller regression tests
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Set up npm
      working-directory: frontend
      run: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
        npm --version

    - name: Check for toolchain version drift
      if: github.event_name == 'pull_request'
      run: |
        git fetch origin ${{ github.base_ref }} --depth=1
        git fetch --deepen=100 2>/dev/null || true
        cd frontend && node scripts/check-lockfile-drift.mjs --base-ref "origin/${{ github.base_ref }}"

    - name: Clean npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: cd ./frontend && npm ci

    - name: Verify generated API clients are up to date
      run: |
        cd ./frontend
        npm run apis:all
        git diff --exit-code -- \
          src/apis \
          src/apisv2beta1 \
          server/src/generated/apis \
          server/src/generated/apisv2beta1

    - name: Verify pipeline and platform spec generation
      working-directory: frontend
      run: |
        # Protobuf only needs Ubuntu sources, not the runner's third-party repositories.
        test -s /etc/apt/sources.list.d/ubuntu.sources
        apt_sources=(
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=-
        )
        sudo apt-get "${apt_sources[@]}" update
        sudo apt-get "${apt_sources[@]}" install --yes protobuf-compiler
        bash scripts/check-spec-generation.sh

    - name: Run Frontend Tests
      run: cd ./frontend && npm run test:ci

    - name: Verify browser evidence runner
      working-directory: frontend
      run: npm run test:browser-runner

    - name: Build shared production bundle
      working-directory: frontend
      run: npm run build

    - name: Upload shared production bundle
      uses: actions/upload-artifact@v7
      with:
        name: frontend-production-bundle
        path: frontend/build
        if-no-files-found: error
        overwrite: true
        retention-days: 7

  browser-tests:
    name: Browser / ${{ matrix.os }} / ${{ matrix.browser }}
    needs: frontend-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      KFP_BROWSER: ${{ matrix.browser }}
      KFP_BROWSER_REPORT_DIR: browser-results

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: frontend/.nvmrc

    - name: Set up npm
      run: |
        npm install --global "$(node -p 'require("./package.json").packageManager')"
        npm --version

    - name: Install browser test dependencies
      # The shared bundle needs neither native build scripts nor nested server installs.
      run: npm ci --ignore-scripts

    - name: Download shared production bundle
      uses: actions/download-artifact@v8
      with:
        name: frontend-production-bundle
        path: frontend/build

    - name: Install browser
      run: npx playwright install --with-deps "${KFP_BROWSER}"

    - name: Run full production browser suite
      id: suite
      run: npm run test:bundle:built

    - name: Record workflow outcome
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
        SUITE_OUTCOME: ${{ steps.suite.outcome }}
      run: |
        node --input-type=module <<'NODE'
        import { mkdirSync, writeFileSync } from 'node:fs';
        import { arch, platform, release } from 'node:os';
        const directory = process.env.KFP_BROWSER_REPORT_DIR;
        mkdirSync(directory, { recursive: true });
        writeFileSync(`${directory}/workflow.json`, JSON.stringify({
          sourceSha: process.env.GITHUB_SHA,
          runId: process.env.GITHUB_RUN_ID,
          runAttempt: process.env.GITHUB_RUN_ATTEMPT,
          runnerOS: process.env.RUNNER_OS,
          runnerImage: process.env.ImageOS,
          runnerImageVersion: process.env.ImageVersion,
          platform: platform(), release: release(), arch: arch(),
          requestedEngine: process.env.KFP_BROWSER,
          jobStatus: process.env.JOB_STATUS,
          suiteOutcome: process.env.SUITE_OUTCOME,
        }, null, 2) + '\n');
        NODE

    - name: Upload browser evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: frontend-browser-${{ matrix.os }}-${{ matrix.browser }}
        path: frontend/browser-results
        if-no-files-found: error
        overwrite: true
        retention-days: 14
