name: Approve Workflow Runs

permissions:
  actions: write
  contents: read
  pull-requests: read

on:
  schedule:
    # Recover runs registered after the pull_request_target approval window.
    - cron: '2,17,32,47 * * * *'
  pull_request_target:
    types:
      - opened
      - labeled
      - synchronize
      - reopened

jobs:
  ok-to-test:
    # Run immediately for trusted authors and when an external contributor is
    # approved. Other labels do not affect workflow-run approval.
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'ok-to-test')
    concurrency:
      # Label and reopen events use a unique group because cancelling a run for
      # the same head SHA would make that commit's check rollup red.
      group: >-
        ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{
          (github.event.action == 'opened' || github.event.action == 'synchronize')
          && 'head-update' || github.run_id
        }}
      # A synchronize event moves the PR to a new head SHA, so cancelling the
      # prior run cannot make the current commit's check rollup red.
      cancel-in-progress: ${{ github.event.action == 'synchronize' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check if author is a Kubeflow GitHub member
        id: membership-check
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "::group::PR Information"
          echo "PR Number: #$PR_NUMBER"
          echo "PR Author: $PR_AUTHOR"
          echo "Author Association: $AUTHOR_ASSOCIATION"
          echo "::endgroup::"
          
          # MEMBER = org member, OWNER = org owner, COLLABORATOR = invited collaborator
          if [[ "$AUTHOR_ASSOCIATION" == "MEMBER" || "$AUTHOR_ASSOCIATION" == "OWNER" || "$AUTHOR_ASSOCIATION" == "COLLABORATOR" ]]; then
            echo "::notice::Author '$PR_AUTHOR' is a trusted contributor (association: $AUTHOR_ASSOCIATION). Auto-approving workflow runs."
            echo "is_member=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Author '$PR_AUTHOR' is not a trusted contributor (association: $AUTHOR_ASSOCIATION). Checking for 'ok-to-test' label."
            echo "is_member=false" >> $GITHUB_OUTPUT
          fi

      - name: Approve Pending Workflow Runs
        if: steps.membership-check.outputs.is_member == 'true' || contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        uses: actions/github-script@v9
        env:
          IS_MEMBER: ${{ steps.membership-check.outputs.is_member }}
        with:
          retries: 3 # github-script level: retries the entire script on transient API errors
          script: |
            // Poll for runs that may not exist yet due to race with workflow creation
            const maxAttempts = 7;
            const intervalMs = 10_000;
            const {number, head} = context.payload.pull_request;
            const headSha = head.sha;
            const headRepoId = head.repo.id;
            const headBranch = head.ref;
            const headOwner = head.repo.owner.login;
            const isMember = process.env.IS_MEMBER === 'true';

            const matchesHead = run =>
              run.event === 'pull_request' &&
              run.head_sha === headSha &&
              run.head_repository?.id === headRepoId &&
              run.head_branch === headBranch &&
              (!run.pull_requests?.length ||
                run.pull_requests.some(pr => pr.number === number));

            const listRequest = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: "pull_request",
              status: "action_required",
              head_sha: headSha,
            };

            const approvedRunIds = new Set();
            let totalApproved = 0;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const {data: current} = await github.rest.pulls.get({
                ...context.repo, pull_number: number,
              });
              if (current.state !== 'open' || current.head.sha !== headSha ||
                  current.head.repo?.id !== headRepoId ||
                  current.head.ref !== headBranch) {
                core.notice('PR head changed or closed; skipping old-head approval.');
                return;
              }
              const labels = new Set(current.labels.map(label => label.name));
              if (!isMember && (!labels.has('ok-to-test') ||
                  labels.has('needs-ok-to-test'))) {
                core.notice('PR approval label changed; skipping workflow approval.');
                return;
              }
              const headPRs = await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: 'open',
                head: `${headOwner}:${headBranch}`, per_page: 100,
              });
              const matches = headPRs.filter(pr =>
                pr.head.sha === headSha &&
                pr.head.repo?.id === headRepoId &&
                pr.head.ref === headBranch);
              if (matches.length !== 1 || matches[0].number !== number) {
                core.setFailed('PR head does not identify exactly one open PR; ' +
                  'pending workflow runs need manual approval.');
                return;
              }

              core.info(`[Attempt ${attempt}/${maxAttempts}] Querying action_required runs for ${headSha}`);
              const runs = (await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo, listRequest
              )).filter(matchesHead);

              let newRunsFound = false;
              for (const run of runs) {
                if (!approvedRunIds.has(run.id)) {
                  core.info(`Approving workflow run ${run.id} (${run.name})`);
                  try {
                    await github.rest.actions.approveWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id,
                    });
                    approvedRunIds.add(run.id);
                    totalApproved++;
                    newRunsFound = true;
                  } catch (err) {
                    core.error(`Failed to approve run ${run.id}: ${err.message}`);
                  }
                }
              }

              if (attempt < maxAttempts) {
                core.info(`Waiting ${intervalMs / 1000}s for any additional runs to register...`);
                await new Promise(r => setTimeout(r, intervalMs));
              }
            }

            // Check if there are any remaining unresolved runs
            const finalRuns = (await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo, listRequest
            )).filter(matchesHead);
            const unresolvedRuns = finalRuns.filter(run => !approvedRunIds.has(run.id));

            if (unresolvedRuns.length > 0) {
              core.setFailed(
                `Failed to approve ${unresolvedRuns.length} workflow run(s): ` +
                unresolvedRuns.map(r => `${r.id} (${r.name})`).join(', ')
              );
            } else if (totalApproved === 0) {
              core.warning(`No action_required workflow runs found for ${headSha} after ${maxAttempts} attempts.`);
            } else {
              core.info(`Successfully approved ${totalApproved} workflow run(s) in total.`);
            }

  scheduled-recovery:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Approve pending runs for uniquely identified admitted PRs
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const identity = pr => {
              if (!pr.head?.repo?.id || !pr.head.ref || !pr.head.sha) return null;
              return JSON.stringify([pr.head.repo.id, pr.head.ref, pr.head.sha]);
            };
            const admitted = pr => {
              const labels = new Set(pr.labels.map(label => label.name));
              return labels.has('ok-to-test') && !labels.has('needs-ok-to-test');
            };

            // Include every open PR in the uniqueness check, even unadmitted ones.
            const openPRs = await github.paginate(github.rest.pulls.list, {
              ...repo, state: 'open', per_page: 100,
            });
            const byHead = new Map();
            for (const pr of openPRs) {
              const key = identity(pr);
              if (!key) continue;
              if (!byHead.has(key)) byHead.set(key, []);
              byHead.get(key).push(pr);
            }

            for (const [key, matches] of byHead) {
              if (matches.length !== 1) {
                core.info(`Skipping ${matches.length} PRs sharing head ${key}.`);
                continue;
              }
              const pr = matches[0];
              if (!admitted(pr)) continue;

              // Query by eligible SHA; a repository-wide pending query exceeds
              // the Actions API's 1,000-result cap in this repository.
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...repo, event: 'pull_request', status: 'action_required',
                head_sha: pr.head.sha, per_page: 100,
              });
              for (const run of runs) {
                if (run.event !== 'pull_request' || run.conclusion !== 'action_required' ||
                    run.head_sha !== pr.head.sha ||
                    run.head_repository?.id !== pr.head.repo.id ||
                    run.head_branch !== pr.head.ref) continue;
                // Fork runs can have an empty pull_requests array. When GitHub
                // does provide a PR association, it must identify this PR.
                if (run.pull_requests?.length &&
                    !run.pull_requests.some(link => link.number === pr.number)) continue;

                const {data: current} = await github.rest.pulls.get({
                  ...repo, pull_number: pr.number,
                });
                if (current.state !== 'open' || identity(current) !== key ||
                    !admitted(current)) continue;

                // Another PR may have appeared since the initial list. The
                // workflow run does not reliably identify a PR for forks.
                const peers = await github.paginate(github.rest.pulls.list, {
                  ...repo, state: 'open',
                  head: `${current.head.repo.owner.login}:${current.head.ref}`,
                  per_page: 100,
                });
                const currentHeadPRs = peers.filter(peer => identity(peer) === key);
                if (currentHeadPRs.length !== 1 ||
                    currentHeadPRs[0].number !== pr.number) {
                  core.info(`Skipping run ${run.id}: its PR head is ambiguous.`);
                  continue;
                }

                try {
                  await github.rest.actions.approveWorkflowRun({
                    ...repo, run_id: run.id,
                  });
                  core.info(`Approved run ${run.id} for PR #${pr.number}.`);
                } catch (error) {
                  // A concurrent approver may have resolved the same run.
                  const {data: latest} = await github.rest.actions.getWorkflowRun({
                    ...repo, run_id: run.id,
                  });
                  if (latest.conclusion === 'action_required') throw error;
                  core.info(`Run ${run.id} was already resolved.`);
                }
              }
            }
