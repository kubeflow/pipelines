name: Build tools images

on:
  merge_group:
    types: [checks_requested]
    branches: [master]
  push:
    branches:
      - master
      - main
      - 'release-*'
  pull_request:
    branches:
      - master
      - main
      - 'release-*'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_ORG: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name == 'main' && 'master' || github.ref_name }}

concurrency:
  group: build-tools-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-tools-check:
    name: Check tools images (${{ matrix.arch }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-tools-images
        with:
          arch: ${{ matrix.arch }}

  build-tools:
    name: Build tools images (${{ matrix.arch }})
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       (github.ref_name != 'master' && github.ref_name != 'main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: linux/${{ matrix.arch }}
      SOURCE_SHA: ${{ github.sha }}
      RUN_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-tools-images
        with:
          arch: ${{ matrix.arch }}

      - name: Stage tested images without changing shared tags
        run: |
          source ./.github/resources/scripts/helper-functions.sh
          source .github/resources/scripts/ci-image-artifacts.sh
          for image in "${TOOL_IMAGE_ARTIFACTS[@]}"; do
            repository="${IMAGE_REGISTRY}/${IMAGE_ORG}/${image}"
            uploaded="${repository}:${RUN_TAG}-${ARCH}-image"
            docker tag "${image}:ci" "$uploaded"
            retry 3 20 docker push "$uploaded"
            # Wrap the single native image in an index for the shared publisher.
            metadata="$RUNNER_TEMP/${image}-index.json"
            retry 3 20 docker buildx imagetools create --prefer-index=true \
              --metadata-file "$metadata" --tag "${repository}:${RUN_TAG}-${ARCH}" "$uploaded"
            digest=$(jq -er '."containerimage.descriptor".digest' "$metadata")
            mkdir -p "$RUNNER_TEMP/tool-digests/$image"
            jq -n --arg digest "$digest" --arg source_sha "$SOURCE_SHA" --arg platform "$PLATFORM" \
              '{digest: $digest, source_sha: $source_sha, platform: $platform}' \
              > "$RUNNER_TEMP/tool-digests/$image/$ARCH.json"
          done

      - name: Upload staged image references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tool-digests-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tool-digests
          if-no-files-found: error

  compare-generated:
    name: Compare AMD64 and ARM64 generated sources
    needs: [build-tools-check, build-tools]
    # Exactly one producer runs for each event; a skipped sibling is expected.
    if: >-
      !cancelled() &&
      (needs.build-tools-check.result == 'success' || needs.build-tools.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: List required generated tool outputs
        id: tool-outputs
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash .github/resources/scripts/ci-image-artifacts.sh --github-output tool-output-artifacts "$RUN_ATTEMPT"
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          pattern: tool-output-*-${{ github.run_attempt }}
          path: tool-output
          required-files: ${{ steps.tool-outputs.outputs.required-files }}
      - name: Require architecture-independent generated output
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: diff -ru "tool-output/tool-output-amd64-$RUN_ATTEMPT" "tool-output/tool-output-arm64-$RUN_ATTEMPT"

  publish-tools:
    name: Publish verified tooling indexes
    needs: [build-tools, compare-generated]
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-tools.result == 'success' && needs.compare-generated.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: List required tool digest records
        id: tool-digests
        shell: bash
        run: bash .github/resources/scripts/ci-image-artifacts.sh --github-output tool-digest-files
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          pattern: tool-digests-*-${{ github.run_attempt }}
          path: tool-digests
          merge-multiple: 'true'
          required-files: ${{ steps.tool-digests.outputs.required-files }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker
      - name: Verify both platforms before shared-tag promotion
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          source .github/resources/scripts/ci-image-artifacts.sh
          for image in "${TOOL_IMAGE_ARTIFACTS[@]}"; do
            python3 .github/resources/scripts/publish_image_index.py \
              --image "${IMAGE_REGISTRY}/${IMAGE_ORG}/${image}" --source-sha "$SOURCE_SHA" \
              --platforms linux/amd64,linux/arm64 --digests "tool-digests/$image" \
              --run-tag "$RUN_TAG" --target-tag "$IMAGE_TAG" --set-latest false \
              --output "published-tool-indexes/$image.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-tool-indexes-${{ github.run_attempt }}
          path: published-tool-indexes
          if-no-files-found: error
