name: Build Images
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      architecture:
        description: 'Native build architecture (amd64 or arm64)'
        type: string
        default: amd64
    outputs:
      IMAGE_PATH:
        description: 'A description of my output'
        value: ${{ jobs.image-build.outputs.image_path }}
      IMAGE_TAG:
        description: 'A description of my output'
        value: ${{ jobs.image-build.outputs.image_tag }}
      IMAGE_REGISTRY:
        description: 'A description of my output'
        value: ${{ jobs.image-build.outputs.registry }}

env:
  IMAGE_TAG: "latest"
  REGISTRY: "kind-registry:5000"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_SHA: ${{ github.sha }}

jobs:
  cache-benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/image-builds.yml@') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET_ARCH: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Docker Hub mirror
        shell: bash
        run: bash ./.github/resources/scripts/configure-docker-hub-mirror.sh

      - name: Compare cold and warm API server compilation
        shell: bash
        run: python3 .github/resources/scripts/benchmark_image_cache.py "$RUNNER_TEMP/image-cache-benchmark"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-cache-benchmark
          path: ${{ runner.temp }}/image-cache-benchmark
          if-no-files-found: warn
          retention-days: 7

  runtime-base-images:
    # The ARM smoke pulls its small set of runtime dependencies natively.
    if: ${{ inputs.architecture == 'amd64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_NAME: "runtime-base-images"
      ARTIFACTS_PATH: "runtime-base-images-cache"
      RUNTIME_IMAGE_FILES: |
        runtime-base-images.tar
        modelcar.tar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure runtime base image artifact
        id: configure-runtime-base-images
        shell: bash
        run: |
          set -euo pipefail
          archive_fingerprint=$(python3 \
            .github/resources/scripts/runtime_base_image_artifacts.py fingerprint \
            .github/resources/scripts/runtime_image_bundles.py \
            .github/resources/runtime-base-images.txt \
            .github/resources/scripts/helper-functions.sh \
            .github/resources/scripts/build-runtime-base-images.sh \
            .github/workflows/runtime-base-images.yml \
            test_data/sdk_compiled_pipelines/valid/critical/modelcar/Dockerfile)
          echo "artifact-name=runtime-base-images-${archive_fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Find runtime base image producer
        id: runtime-base-images-producer
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.configure-runtime-base-images.outputs.artifact-name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 3); do
            reference=""
            if artifacts=$(
              for bundle in fixtures mysql argo-v3.7.18 argo-v4.1.2 modelcar; do
                gh api --method GET --paginate --slurp \
                  "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
                  -f name="${ARTIFACT_NAME}-${bundle}" -f per_page=100 || exit 1
              done | jq -s add
            ); then
              if ! reference=$(python3 \
                .github/resources/scripts/runtime_base_image_artifacts.py \
                select-bundles --source-sha "${SOURCE_SHA}" \
                --repository-id "$GITHUB_REPOSITORY_ID" <<< "$artifacts"); then
                reference=""
                echo "::warning::Invalid shared runtime artifact metadata; retrying lookup"
              fi
            else
              echo "::warning::Failed to query runtime base image artifacts"
            fi
            if [[ -n "$reference" ]]; then
              mkdir -p "$ARTIFACTS_PATH"
              printf '%s\n' "$reference" > "$ARTIFACTS_PATH/runtime-reference.json"
              echo "shared=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
          done
          echo "::warning::No eligible shared runtime image archive found; building from this checkout."

      - name: Configure Docker Hub mirror
        if: steps.runtime-base-images-producer.outputs.shared != 'true'
        shell: bash
        run: bash ./.github/resources/scripts/configure-docker-hub-mirror.sh

      - name: Build runtime base image archives
        id: build-runtime-base-images
        if: steps.runtime-base-images-producer.outputs.shared != 'true'
        shell: bash
        env:
          REQUIRED_FILES: ${{ env.RUNTIME_IMAGE_FILES }}
        run: |
          echo "No shared runtime image archive; rebuilding locally"
          echo "Rebuilding and verifying runtime archives locally." >> "$GITHUB_STEP_SUMMARY"
          # This job owns one fixed directory. Never accept an arbitrary
          # cleanup path before allocating the fresh rebuild.
          if [[ "$ARTIFACTS_PATH" != 'runtime-base-images-cache' ]]; then
            echo "::error::Unexpected runtime image cache path: $ARTIFACTS_PATH"
            exit 1
          fi
          rm -rf -- "${GITHUB_WORKSPACE:?}/runtime-base-images-cache"
          rebuilt_path=$(mktemp -d "$RUNNER_TEMP/runtime-base-images.XXXXXX")
          bash .github/resources/scripts/build-runtime-base-images.sh "$rebuilt_path"
          DOWNLOAD_PATH="$rebuilt_path" bash .github/resources/scripts/artifact-files.sh verify
          echo "path=$rebuilt_path" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.build-runtime-base-images.outputs.path || env.ARTIFACTS_PATH }}
          if-no-files-found: error
          retention-days: 1

  image-build:
    # A direct dispatch runs only the cache benchmark. Manually dispatched
    # callers retain their own github.workflow_ref and still build CI images.
    if: ${{ github.event_name != 'workflow_dispatch' || !contains(github.workflow_ref, '/.github/workflows/image-builds.yml@') }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      image_path: ${{ steps.configure.outputs.artifact_path }}
      image_tag: ${{ steps.configure.outputs.image_tag }}
      registry: ${{ steps.configure.outputs.registry }}
    strategy:
      # A single failing image build must not cancel the other builds in the
      # matrix: cancelled jobs skip their rebuild fallback (a cancelled build
      # step has outcome 'cancelled', not 'failure'), so fail-fast turns one
      # transient failure into a full workflow failure.
      fail-fast: false
      matrix:
        include:
          - image: apiserver
            dockerfile: backend/Dockerfile
            context: .
          - image: persistenceagent
            dockerfile: backend/Dockerfile.persistenceagent
            context: .
          - image: scheduledworkflow
            dockerfile: backend/Dockerfile.scheduledworkflow
            context: .
          - image: launcher
            dockerfile: backend/Dockerfile.launcher
            context: .
          - image: driver
            dockerfile: backend/Dockerfile.driver
            context: .
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: .
          - image: viewer-crd-controller
            dockerfile: backend/Dockerfile.viewercontroller
            context: .

    env:
      ARTIFACT_NAME: "${{ matrix.image }}${{ inputs.architecture == 'arm64' && '-arm64' || '' }}"
      TARGET_ARCH: ${{ inputs.architecture }}
      ARTIFACTS_PATH: "images_${{ github.run_id }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read frontend Node version
        id: frontend_node
        run: echo "version=$(tr -d '\r\n' < frontend/.nvmrc | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Verify native build architecture
        shell: bash
        run: |
          case "${TARGET_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "::error::Unsupported architecture or non-native build runner"; exit 1 ;;
          esac

      - name: Create Artifacts Path Directory
        id: configure
        run: |
          mkdir -p ${{ env.ARTIFACTS_PATH }}
          {
            echo "artifact_path=${{ env.ARTIFACTS_PATH }}"
            echo "image_tag=${{ env.IMAGE_TAG }}"
            echo "registry=${{ env.REGISTRY }}"
          } >> "$GITHUB_OUTPUT"

      - name: Locate retained image and compiler artifacts
        id: retained-cache
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          # The complete tree includes Dockerfiles, COPY inputs and build args.
          # Conservative invalidation is preferable to reusing a stale image.
          image_key="ci-image-artifact-v2-${CI_IMAGE}-${TARGET_ARCH}-$(git rev-parse 'HEAD^{tree}')"
          go_key="ci-go-artifact-v2-${TARGET_ARCH}-$(python3 .github/resources/scripts/runtime_base_image_artifacts.py fingerprint "$DOCKERFILE" go.mod go.sum api/go.mod kubernetes_platform/go.mod)"
          echo "image-key=$image_key" >> "$GITHUB_OUTPUT"
          echo "go-key=$go_key" >> "$GITHUB_OUTPUT"
          for kind in image go; do
            [[ "$kind" != go || "$CI_IMAGE" == apiserver ]] || continue
            key="$image_key"
            [[ "$kind" != go ]] || key="$go_key"
            selected=$(gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$key" -f per_page=100 | \
              python3 .github/resources/scripts/image_cache_artifacts.py \
                --name "$key" --head-repository-id "$HEAD_REPOSITORY_ID" --head-branch "$HEAD_BRANCH")
            echo "$kind-id=$(jq -r '.artifact_id // empty' <<< "$selected")" >> "$GITHUB_OUTPUT"
            echo "$kind-run=$(jq -r '.run_id // empty' <<< "$selected")" >> "$GITHUB_OUTPUT"
          done

      - name: Restore retained image
        if: ${{ steps.retained-cache.outputs.image-id != '' }}
        id: retained-image
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/download-artifact-with-retry
        with:
          required-files: ${{ env.ARTIFACT_NAME }}.tar
          retry-delay-seconds: '5'
          artifact-ids: ${{ steps.retained-cache.outputs.image-id }}
          run-id: ${{ steps.retained-cache.outputs.image-run }}
          github-token: ${{ github.token }}
          path: ${{ env.ARTIFACTS_PATH }}
          merge-multiple: true

      - name: Validate retained image
        env:
          CI_IMAGE: ${{ matrix.image }}
        if: ${{ steps.retained-image.outcome == 'success' }}
        id: validate-image
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ARTIFACTS_PATH/$ARTIFACT_NAME.tar"
          docker load --input "$ARTIFACTS_PATH/$ARTIFACT_NAME.tar"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REGISTRY/$CI_IMAGE:ci")" = "linux/$TARGET_ARCH"

      - name: Configure Docker Hub mirror
        if: ${{ steps.validate-image.outcome != 'success' }}
        shell: bash
        run: bash ./.github/resources/scripts/configure-docker-hub-mirror.sh

      - name: Set up Docker Buildx
        if: ${{ steps.validate-image.outcome != 'success' }}
        id: buildx
        shell: bash
        run: bash ./.github/resources/scripts/setup-buildx-with-retry.sh

      - name: Restore Go compiler cache
        if: ${{ matrix.image == 'apiserver' && steps.validate-image.outcome != 'success' && steps.retained-cache.outputs.go-id != '' }}
        id: go-cache
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/download-artifact-with-retry
        with:
          required-files: go-build-cache.tar.gz
          retry-delay-seconds: '5'
          artifact-ids: ${{ steps.retained-cache.outputs.go-id }}
          run-id: ${{ steps.retained-cache.outputs.go-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/go-build-cache
          merge-multiple: true

      - name: Restore Go compiler cache into BuildKit
        id: restore-go-cache
        if: ${{ matrix.image == 'apiserver' && steps.validate-image.outcome != 'success' && steps.go-cache.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILDER_NAME: ${{ steps.buildx.outputs.builder_name }}
        run: |
          test -s "$RUNNER_TEMP/go-build-cache/go-build-cache.tar.gz"
          bash .github/resources/scripts/buildkit-go-cache.sh restore "$DOCKERFILE" "$BUILDER_NAME"

      - name: Build and save Docker image
        if: ${{ steps.validate-image.outcome != 'success' }}
        uses: docker/build-push-action@v7
        id: save-image
        continue-on-error: true
        # A step timeout remains retryable; the job timeout cancels recovery.
        timeout-minutes: ${{ matrix.image == 'frontend' && 9 || 30 }}
        env:
          # Disable the job summary report in the GitHub Actions UI
          DOCKER_BUILD_SUMMARY: false
        with:
          builder: ${{ steps.buildx.outputs.builder_name }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/${{ inputs.architecture }}
          build-args: |
            NODE_VERSION=${{ steps.frontend_node.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:ci
          outputs: type=docker,dest=${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.tar

      - name: Wait before rebuilding
        if: ${{ steps.save-image.outcome == 'failure' }}
        run: sleep 10

      - name: Reset frontend builder before retry
        if: ${{ matrix.image == 'frontend' && steps.save-image.outcome == 'failure' }}
        # GitHub implicitly adds success() to the rebuild's condition, so a
        # failed reset would skip the rebuild entirely.
        continue-on-error: true
        # Allow 120s of helper backoff, 45s of cleanup, and time for Docker work.
        timeout-minutes: 5
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.builder_name }}
        run: |
          # Preserve daemon diagnostics before discarding a potentially stuck builder.
          timeout 15s docker logs --tail 200 "buildx_buildkit_${BUILDER_NAME}0" || true
          # setup_builder removes the builder again under its own retry.
          if ! timeout 30s docker buildx rm --force "$BUILDER_NAME"; then
            echo "::warning::Could not remove builder $BUILDER_NAME"
          fi
          bash ./.github/resources/scripts/setup-buildx-with-retry.sh "$BUILDER_NAME"

      - name: Rebuild Images in case of failure
        uses: docker/build-push-action@v7
        if: ${{ steps.save-image.outcome == 'failure' }}
        id: rebuild
        timeout-minutes: ${{ matrix.image == 'frontend' && 9 || 30 }}
        env:
          # Disable the job summary report in the GitHub Actions UI
          DOCKER_BUILD_SUMMARY: false
        with:
          builder: ${{ steps.buildx.outputs.builder_name }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/${{ inputs.architecture }}
          no-cache: true
          build-args: |
            NODE_VERSION=${{ steps.frontend_node.outputs.version }}
            GO_BUILD_CACHE_ID=kfp-go-build-retry
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:ci
          outputs: type=docker,dest=${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.tar

      - name: Record ARM image identity
        if: ${{ inputs.architecture == 'arm64' && (steps.validate-image.outcome == 'success' || steps.save-image.outcome == 'success' || steps.rebuild.outcome == 'success') }}
        env:
          CI_IMAGE: ${{ matrix.image }}
        run: >-
          python3 .github/resources/scripts/arm64_presubmit_image.py
          "$CI_IMAGE" "$GITHUB_SHA" "$REGISTRY"
          "$ARTIFACTS_PATH/$ARTIFACT_NAME.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ steps.validate-image.outcome == 'success' || steps.save-image.outcome == 'success' || steps.rebuild.outcome == 'success' }}
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.tar
            ${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Retain successful image archive
        if: ${{ steps.validate-image.outcome != 'success' && steps.retained-cache.outputs.image-key != '' && (steps.save-image.outcome == 'success' || steps.rebuild.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.retained-cache.outputs.image-key }}
          path: ${{ env.ARTIFACTS_PATH }}/${{ env.ARTIFACT_NAME }}.tar
          retention-days: 7
          compression-level: 1
          overwrite: true
          if-no-files-found: error

      - name: Extract Go compiler cache from BuildKit
        if: ${{ matrix.image == 'apiserver' && steps.restore-go-cache.outcome != 'success' && steps.retained-cache.outputs.go-key != '' && (steps.save-image.outcome == 'success' || steps.rebuild.outcome == 'success') }}
        id: extract-go-cache
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILDER_NAME: ${{ steps.buildx.outputs.builder_name }}
          CACHE_ID: ${{ steps.rebuild.outcome == 'success' && 'kfp-go-build-retry' || 'kfp-go-build' }}
        run: bash .github/resources/scripts/buildkit-go-cache.sh save "$DOCKERFILE" "$BUILDER_NAME" "$CACHE_ID"

      - name: Save Go compiler cache
        if: ${{ steps.extract-go-cache.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.retained-cache.outputs.go-key }}
          path: ${{ runner.temp }}/go-build-cache/go-build-cache.tar.gz
          retention-days: 7
          compression-level: 0
          overwrite: true
          if-no-files-found: error
