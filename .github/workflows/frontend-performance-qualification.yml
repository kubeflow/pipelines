name: Frontend Performance Qualification

on:
  # Not a required gate until reliability follow-up #14754 and a separate promotion decision.
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build performance / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: legacy
            ref: '02cbc725ac9ddcd950f4400d8355dd78bfcd6c57'
          - variant: checkpoint
            ref: 'e79f8d423e6b118e5df94815ee2f36f68570a9a9'
          - variant: previous
            ref: 'dc1b3cfbaba17444408c9a59eb8ab9354b2dfd79'
          - variant: candidate
            ref: ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Set up source-pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Build immutable source
        run: npm run build
      - name: Record source and every emitted asset
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { cp, mkdir, readFile, readdir, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          const root = resolve('build');
          const assets = await Promise.all((await readdir(root, {recursive:true, withFileTypes:true}))
            .filter(item => item.isFile()).map(item => resolve(item.parentPath, item.name)).sort()
            .map(async path => { const bytes = await readFile(path); return {
              path: path.slice(root.length+1), bytes: bytes.length,
              sha256: createHash('sha256').update(bytes).digest('hex')
            }; }));
          if (!assets.length) throw new Error('Build is empty');
          await mkdir('performance-build', {recursive:true});
          await cp('build', 'performance-build/build', {recursive:true});
          await writeFile('performance-build/provenance.json', JSON.stringify({
            sourceSha: execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), assets
          },null,2)+'\n');
          NODE
      - name: Archive complete performance build
        run: tar -czf performance-build.tar.gz -C performance-build .
      - uses: actions/upload-artifact@v7
        with:
          name: performance-build-${{ matrix.variant }}
          path: frontend/performance-build.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  measure:
    name: Matched hosted performance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      KFP_PERFORMANCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      KFP_PERFORMANCE_BUILDS: ${{ github.workspace }}/performance-builds
      KFP_PERFORMANCE_OUTPUT: ${{ github.workspace }}/frontend/performance-results
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Set up pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix mock-backend --ignore-scripts
      - run: npm ci --prefix server --ignore-scripts
      - name: Verify performance evidence helpers without browsers
        run: node --test scripts/performance-evidence.check.mjs
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          name: performance-build-legacy
          path: ${{ runner.temp }}/performance-legacy
          required-files: performance-build.tar.gz
      - name: Extract legacy performance build
        run: |
          mkdir -p "../performance-builds/legacy"
          tar -xzf "$RUNNER_TEMP/performance-legacy/performance-build.tar.gz" -C "../performance-builds/legacy"
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          name: performance-build-checkpoint
          path: ${{ runner.temp }}/performance-checkpoint
          required-files: performance-build.tar.gz
      - name: Extract checkpoint performance build
        run: |
          mkdir -p "../performance-builds/checkpoint"
          tar -xzf "$RUNNER_TEMP/performance-checkpoint/performance-build.tar.gz" -C "../performance-builds/checkpoint"
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          name: performance-build-previous
          path: ${{ runner.temp }}/performance-previous
          required-files: performance-build.tar.gz
      - name: Extract previous performance build
        run: |
          mkdir -p "../performance-builds/previous"
          tar -xzf "$RUNNER_TEMP/performance-previous/performance-build.tar.gz" -C "../performance-builds/previous"
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          name: performance-build-candidate
          path: ${{ runner.temp }}/performance-candidate
          required-files: performance-build.tar.gz
      - name: Extract candidate performance build
        run: |
          mkdir -p "../performance-builds/candidate"
          tar -xzf "$RUNNER_TEMP/performance-candidate/performance-build.tar.gz" -C "../performance-builds/candidate"
      - name: Configure bounded Ubuntu browser dependencies
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 ../.github/resources/scripts/configure_frontend_apt.py
      - name: Install locked Playwright Chromium on hosted runner
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - name: Measure matched builds and evaluate performance budgets
        run: node scripts/run-performance-qualification.mjs
      - name: Summarize measurements and configured budget status
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          try {
            const report = JSON.parse(await readFile('performance-results/performance.json'));
            await appendFile(process.env.GITHUB_STEP_SUMMARY,
              `Performance measurement: ${report.status}\n\nAcceptance: ${report.acceptance}\n\nBudget comparisons pass: ${report.proposedBudgetsPass ?? 'not evaluated'}\n\nSee retained raw samples and Chromium traces. First editor-open gates: display median at most 4 s; initialized worker median at most 5 s.\n`);
          } catch { await appendFile(process.env.GITHUB_STEP_SUMMARY, 'No complete performance report; inspect setup logs.\n'); }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-performance-evidence
          path: frontend/performance-results
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
