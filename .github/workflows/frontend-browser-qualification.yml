name: Frontend Browser Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/frontend-browser-qualification.yml'
      - 'frontend/scripts/qualified-browsers.json'
      - 'frontend/scripts/install-qualified-browser*'
      - 'frontend/scripts/run-apple-qualification*'
      - 'frontend/scripts/run-native-qualification*'
      - 'frontend/scripts/ui-modernization-browser-floor.mjs'
      - 'frontend/scripts/ui-modernization-native*'
      - 'frontend/scripts/run-browser-suite*'
      - 'frontend/scripts/*.smoke.mjs'
      - 'frontend/mock-backend/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/.nvmrc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      vendors: ${{ steps.matrix.outputs.vendors }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Set up pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Check qualification helpers without launching browsers
        run: |
          node --test scripts/install-qualified-browser.check.mjs scripts/run-apple-qualification.check.mjs scripts/run-native-qualification.check.mjs
          node --check scripts/run-native-qualification.mjs
          node --check scripts/ui-modernization-browser-floor.mjs
      - name: Resolve dated vendor matrix
        id: matrix
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('scripts/qualified-browsers.json', 'utf8'));
          const include = manifest.browsers.map(({ id, browser }) => ({ id, browser }));
          if (!include.length) throw new Error('The qualification matrix must not be empty');
          appendFileSync(process.env.GITHUB_OUTPUT, `vendors=${JSON.stringify({ include })}\n`);
          NODE
      - name: Build shared production bundle
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-production-bundle
          path: frontend/build
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-version-manifest
          path: frontend/scripts/qualified-browsers.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  vendor-browser:
    name: Vendor / ${{ matrix.id }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.vendors) }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      CI: 'true'
      KFP_BROWSER_REPORT_DIR: browser-results/vendor-${{ matrix.id }}
      KFP_BROWSER_FLOOR_OUTPUT: browser-results/vendor-${{ matrix.id }}/native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Set up pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - name: Install native fixture dependencies
        if: matrix.browser == 'firefox'
        run: npm ci --prefix mock-backend --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: qualification-production-bundle
          path: frontend/build
      - name: Install exact vendor browser in disposable runner storage
        id: browser
        env:
          BROWSER_ID: ${{ matrix.id }}
        run: node scripts/install-qualified-browser.mjs "$BROWSER_ID"
      - name: Run full Chromium-family production workflows
        if: matrix.browser == 'chromium'
        env:
          KFP_BROWSER: chromium
          KFP_BROWSER_EXECUTABLE_PATH: ${{ steps.browser.outputs.binary }}
          KFP_EXPECTED_BROWSER_VERSION: ${{ steps.browser.outputs.version }}
        run: npm run test:bundle:built
      - name: Run native Firefox workflows
        if: matrix.browser == 'firefox'
        env:
          KFP_FIREFOX_BINARY: ${{ steps.browser.outputs.binary }}
          KFP_GECKODRIVER_BINARY: ${{ steps.browser.outputs.driver }}
          KFP_BROWSER_FLOOR_VERSION: ${{ steps.browser.outputs.version }}
        run: node scripts/run-native-qualification.mjs
      - name: Verify final Edge identity and detach owned read-only volume
        if: always() && startsWith(matrix.id, 'edge-')
        env:
          BROWSER_ID: ${{ matrix.id }}
        run: node scripts/install-qualified-browser.mjs --finalize "$BROWSER_ID"
      - name: Retain installation provenance
        if: always()
        env:
          BROWSER_ID: ${{ matrix.id }}
        run: |
          mkdir -p "$KFP_BROWSER_REPORT_DIR"
          provenance="$RUNNER_TEMP/kfp-qualified-browsers/$BROWSER_ID/provenance.json"
          if test -f "$provenance"; then
            cp "$provenance" "$KFP_BROWSER_REPORT_DIR/distribution.json"
          fi
      - name: Record lane outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BROWSER_ID: ${{ matrix.id }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { platform, release, arch } from 'node:os';
          const directory = process.env.KFP_BROWSER_REPORT_DIR;
          mkdirSync(directory, { recursive: true });
          writeFileSync(`${directory}/workflow.json`, JSON.stringify({
            sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, status: process.env.JOB_STATUS,
            browserId: process.env.BROWSER_ID, platform: platform(), release: release(),
            arch: arch(), image: process.env.ImageOS, imageVersion: process.env.ImageVersion,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualification-${{ matrix.id }}
          path: frontend/browser-results/vendor-${{ matrix.id }}
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  apple-browser:
    name: Apple / ${{ matrix.mode }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: desktop
            runner: macos-26
          - mode: iphone
            runner: macos-26
          - mode: ipad
            runner: macos-26
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      CI: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Set up pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix mock-backend --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: qualification-production-bundle
          path: frontend/build
      - name: Run native Apple qualification
        env:
          APPLE_MODE: ${{ matrix.mode }}
        run: node scripts/run-apple-qualification.mjs "$APPLE_MODE"
      - name: Record lane outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          APPLE_MODE: ${{ matrix.mode }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const directory = `browser-results/apple-${process.env.APPLE_MODE}`;
          mkdirSync(directory, { recursive: true });
          writeFileSync(`${directory}/workflow.json`, JSON.stringify({
            sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, status: process.env.JOB_STATUS,
            mode: process.env.APPLE_MODE, image: process.env.ImageOS,
            imageVersion: process.env.ImageVersion,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualification-apple-${{ matrix.mode }}
          path: frontend/browser-results/apple-${{ matrix.mode }}
          if-no-files-found: error
          overwrite: true
          retention-days: 90
