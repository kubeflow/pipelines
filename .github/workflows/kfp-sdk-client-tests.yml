name: KFP Python Client Tests

on:
  merge_group:
    types: [checks_requested]
    branches: [master]
  push:
    branches: [master, main]

  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/kfp-sdk-client-tests.yml'
      - '.github/actions/setup-python/**'
      - '.github/workflows/image-builds.yml'
      - '.github/workflows/ci-images.yml'
      - '.github/actions/shared-ci-images/**'
      - '.github/actions/create-cluster/**'
      - '.github/actions/deploy/**'
      - '.github/actions/download-artifact-with-retry/**'
      - '.github/resources/**'
      - 'sdk/python/**'
      - 'api/v2alpha1/**'
      - 'backend/**'
      - '!**/*.md'
      - '!**/OWNERS'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_BUILD_PKG_VERSION: "1.3.0"

permissions:
  contents: read

jobs:
  sdk-client-tests:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        k8s_version: [ "v1.33.12", "v1.36.1" ]
    name: KFP SDK Client Tests - K8s ${{ matrix.k8s_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # This must occur after "Free up space" step
      # otherwise python version will be overridden
      - name: Setup Python with uv
        uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'

      - name: Install protobuf dependencies & generate proto files
        uses: ./.github/actions/protobuf

      - name: Create KFP cluster
        id: create-kfp-cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: ${{ matrix.k8s_version }}
        continue-on-error: true

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy
        if: ${{ steps.create-kfp-cluster.outcome == 'success' }}
        with:
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000

      - name: Forward API port
        id: forward-api-port
        if: ${{ steps.deploy.outcome == 'success' }}
        run: ./.github/resources/scripts/forward-port.sh "kubeflow" "ml-pipeline" 8888 8888
        continue-on-error: true

      - name: Install Test dependencies
        run: uv sync --extra ci --frozen

      - name: Build and install the unified SDK
        uses: ./.github/actions/kfp-k8s

      - name: Run tests
        id: tests
        if: ${{ steps.forward-api-port.outcome == 'success' }}
        env:
          apiUrl: "http://localhost:8888"
          namespace: "kubeflow"
          SETUP_ENV: false
        run: |
          ./test/presubmit-tests-sdk-client.sh
        continue-on-error: true

      - name: Collect failed logs
        if: ${{ !cancelled() && (failure() || steps.create-kfp-cluster.outcome != 'success' || steps.deploy.outcome != 'success' || steps.forward-api-port.outcome != 'success' || steps.tests.outcome != 'success') }}
        run: |
          ./.github/resources/scripts/collect-logs.sh --ns kubeflow --output /tmp/tmp.log/tmp_pod_log.txt
          exit 1

      - name: Collect test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: periodic-functional-artifacts-k8s-${{ matrix.k8s_version }}
          path: /tmp/tmp*/*
