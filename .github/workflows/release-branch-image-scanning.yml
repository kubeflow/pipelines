name: Release Branch Image Scanning
on:
  workflow_run:
    workflows: [pre-commit]
    branches: [release-2.18]
    types: [completed]
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:

permissions: {}

# A late completion wakes a scan of the current branch head. Unrelated events
# cannot replace pending valid scans in GitHub's single pending-run slot.
concurrency:
  group: >-
    release-2.18-image-scanning-${{ github.repository == 'kubeflow/pipelines' &&
    (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_run' ||
    (github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.path == '.github/workflows/pre-commit.yml' &&
    github.event.workflow_run.head_branch == 'release-2.18' &&
    github.event.workflow_run.repository.full_name == 'kubeflow/pipelines' &&
    github.event.workflow_run.head_repository.full_name == 'kubeflow/pipelines')) && github.ref || 'ignored' }}
  cancel-in-progress: false

env:
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  PYTHONPATH: ${{ github.workspace }}/tooling/release

jobs:
  inventory:
    if: >-
      github.repository == 'kubeflow/pipelines' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      request-id: ${{ steps.source.outputs.request-id }}
      version: ${{ steps.inventory.outputs.version }}
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r tooling/.github/scripts/requirements.txt
      - name: Validate wakeup and resolve current release branch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m kfpr.branch_scan resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubeflow/pipelines
          ref: refs/heads/release-2.18
          path: source
          persist-credentials: false
      # The literal branch establishes trust; the guard preserves exact identity.
      - name: Verify exact release source
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: |
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$(git -C source rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::release-2.18 moved or source identity is invalid; retry against the current branch head."
            exit 1
          fi
      - name: Read exact source version and release image matrix
        id: inventory
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          REQUEST_ID: ${{ steps.source.outputs.request-id }}
        run: python -m kfpr.branch_scan inventory --source source

  images:
    permissions:
      contents: read
    needs: inventory
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.inventory.outputs.source-sha }}
      VERSION: ${{ needs.inventory.outputs.version }}
      REQUEST_ID: ${{ needs.inventory.outputs.request-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubeflow/pipelines
          ref: refs/heads/release-2.18
          path: source
          persist-credentials: false
      # The literal branch establishes trust; the guard preserves exact identity.
      - name: Verify exact release source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.inventory.outputs.source-sha }}
        run: |
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$(git -C source rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::release-2.18 moved or source identity is invalid; retry against the current branch head."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r tooling/.github/scripts/requirements.txt
      - uses: ./tooling/.github/actions/setup-osv-scanner
        with:
          arch: ${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
      - name: Build and scan exact release image without publishing
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m kfpr.ci_images_runner lane --source source \
            --name "$IMAGE_NAME" --platform "$IMAGE_PLATFORM" --output evidence --scanner osv
      - name: Preserve lane evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kfpr-lane-${{ needs.inventory.outputs.request-id }}-${{ github.run_attempt }}-${{ matrix.name }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    permissions:
      contents: read
    needs: [inventory, images]
    if: ${{ always() && needs.inventory.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ needs.inventory.outputs.source-sha }}
      VERSION: ${{ needs.inventory.outputs.version }}
      REQUEST_ID: ${{ needs.inventory.outputs.request-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubeflow/pipelines
          ref: refs/heads/release-2.18
          path: source
          persist-credentials: false
      # The literal branch establishes trust; the guard preserves exact identity.
      - name: Verify exact release source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.inventory.outputs.source-sha }}
        run: |
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$(git -C source rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::release-2.18 moved or source identity is invalid; retry against the current branch head."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r tooling/.github/scripts/requirements.txt
      - name: Require every source lane from this exact attempt
        id: expected-lanes
        run: python -m kfpr.branch_scan required-lanes --source source
      - uses: ./tooling/.github/actions/download-artifact-with-retry
        with:
          pattern: kfpr-lane-${{ needs.inventory.outputs.request-id }}-${{ github.run_attempt }}-*
          path: lanes
          required-files: ${{ steps.expected-lanes.outputs.required-files }}
      - name: Validate complete immutable raw evidence
        run: |
          python -m kfpr.ci_images_runner aggregate --source source \
            --lanes lanes --output qualified --scanner osv
      - name: Preserve every verified OSV finding as SARIF
        run: python -m kfpr.branch_scan convert --source source --evidence qualified
      - name: Upload complete validated scans and SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release218-scans-${{ needs.inventory.outputs.request-id }}-${{ github.run_attempt }}
          path: qualified/
          if-no-files-found: error
          retention-days: 30

  upload:
    # Manual candidate runs validate complete artifacts without publishing
    # findings from unmerged workflow code into the release branch.
    if: github.ref == 'refs/heads/master'
    needs: [inventory, aggregate]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubeflow/pipelines
          ref: refs/heads/release-2.18
          path: source
          persist-credentials: false
      # The literal branch establishes trust; the guard preserves exact identity.
      - name: Verify exact release source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.inventory.outputs.source-sha }}
        run: |
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$(git -C source rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::release-2.18 moved or source identity is invalid; retry against the current branch head."
            exit 1
          fi
      - uses: ./tooling/.github/actions/download-artifact-with-retry
        with:
          name: release218-scans-${{ needs.inventory.outputs.request-id }}-${{ github.run_attempt }}
          path: qualified
          required-files: |
            manifest.json
            sarif/${{ matrix.name }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}.sarif
      - name: Publish verified release branch findings
        uses: github/codeql-action/upload-sarif@256d634097be96e792d6764f9edaefc4320557b1 # v4
        with:
          sarif_file: qualified/sarif/${{ matrix.name }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}.sarif
          category: release-2.18-image-${{ matrix.name }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          sha: ${{ needs.inventory.outputs.source-sha }}
          ref: refs/heads/release-2.18
          checkout_path: source

  third-party-evidence:
    needs: inventory
    uses: ./.github/workflows/third-party-image-scanning.yml
    permissions:
      contents: read
      actions: read
