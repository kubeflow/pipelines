name: Sync Maintainer Review Project Label

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - master
    paths:
      - OWNERS
      - .github/dependabot.yml
      - .github/resources/scripts/maintainer_project_label.js
      - .github/workflows/sync-maintainer-project-label.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-label:
    # Dependabot-triggered pull_request_target runs have a read-only token.
    # Dependabot applies the label from dependabot.yml; scheduled reconciliation
    # is the backstop for existing or missed bot PRs.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'all-open-prs' }}
      cancel-in-progress: true

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile project tracking label
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const fs = require("fs");
            const path = require("path");
            const {
              parseRootApprovers,
              reconcilePullRequest,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github/resources/scripts/maintainer_project_label.js"
            ));

            const trackingLabel = "project/maintainer-review";
            const approvers = parseRootApprovers(
              fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, "OWNERS"), "utf8")
            );

            const pullRequests = context.eventName === "pull_request_target"
              ? [context.payload.pull_request]
              : await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  per_page: 100,
                });

            const counts = {added: 0, removed: 0, unchanged: 0};
            for (const pullRequest of pullRequests) {
              const result = await reconcilePullRequest({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                pullRequest,
                approvers,
                trackingLabel,
              });
              counts[result] += 1;
              core.info(`PR #${pullRequest.number} (${pullRequest.user.login}): ${result}`);
            }

            core.info(`Reconciliation summary: ${JSON.stringify(counts)}`);

