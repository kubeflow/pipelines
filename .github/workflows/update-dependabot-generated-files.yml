# Apply generated outputs from the unprivileged validation workflow. Policy and
# validation code are loaded from the default branch, the pull request is
# checked out read-only, and SSH credentials exist only in the final push step.
name: Update Dependabot Generated Files

on:
  workflow_run:
    workflows: ["Validate Generated Files"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: update-dependabot-generated-files-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  update-generated-files:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Locate the generated artifact and validate its pull request
        id: prepare
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const run = context.payload.workflow_run;
            const artifactName = `dependabot-generated-files-${run.head_sha}`;
            core.setOutput("eligible", "false");

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              }
            );
            const matchingArtifacts = artifacts.filter((artifact) => artifact.name === artifactName);
            if (matchingArtifacts.length === 0) {
              core.info(`Workflow run ${run.id} has no ${artifactName} artifact; no update is needed.`);
              return;
            }
            if (matchingArtifacts.length !== 1) {
              core.setFailed(`Workflow run ${run.id} has multiple ${artifactName} artifacts.`);
              return;
            }

            let pullRequestReferences = run.pull_requests;
            if (pullRequestReferences.length === 0) {
              core.info(`Workflow run ${run.id} did not include a pull request; resolving ${run.head_sha} through the API.`);
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              pullRequestReferences = response.data;
            }
            const pullRequests = await Promise.all(
              pullRequestReferences.map(async ({ number }) => {
                const response = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: number,
                });
                return response.data;
              })
            );
            const openPullRequests = pullRequests.filter((pullRequest) => pullRequest.state === "open");
            if (openPullRequests.length !== 1) {
              core.setFailed(
                `Expected one open pull request for workflow run ${run.id}; found ${openPullRequests.length}.`
              );
              return;
            }

            const pullRequest = openPullRequests[0];
            const pullNumber = pullRequest.number;
            if (pullRequest.user.login !== "dependabot[bot]") {
              core.setFailed(`PR #${pullNumber} is not authored by dependabot[bot].`);
              return;
            }
            if (pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR #${pullNumber} does not use a same-repository branch.`);
              return;
            }
            if (!pullRequest.head.ref.startsWith("dependabot/go_modules/")) {
              core.setFailed(`Artifact-producing PR #${pullNumber} is not a Dependabot Go modules update.`);
              return;
            }
            if (pullRequest.head.sha !== run.head_sha) {
              core.info(`PR #${pullNumber} moved from ${run.head_sha} to ${pullRequest.head.sha}; skipping stale output.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const unexpectedPaths = files
              .map((file) => file.filename)
              .filter((filename) => !/(^|\/)go\.(mod|sum)$/.test(filename));
            if (unexpectedPaths.length > 0) {
              core.setFailed(
                `PR #${pullNumber} contains non-module changes before regeneration: ${unexpectedPaths.join(", ")}`
              );
              return;
            }

            core.setOutput("eligible", "true");
            core.setOutput("artifact_name", artifactName);
            core.setOutput("head_ref", pullRequest.head.ref);
            core.setOutput("head_sha", pullRequest.head.sha);
            core.setOutput("pr_number", String(pullNumber));

      - name: Download generated changes
        if: steps.prepare.outputs.eligible == 'true'
        uses: ./trusted/.github/actions/download-artifact-with-retry
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/dependabot-generated-files
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate artifact metadata and claimed paths
        if: steps.prepare.outputs.eligible == 'true'
        shell: bash
        env:
          EXPECTED_HEAD_REF: ${{ steps.prepare.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          EXPECTED_PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
        run: |
          jq -e \
            --arg head_ref "$EXPECTED_HEAD_REF" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg pr_number "$EXPECTED_PR_NUMBER" \
            '.head_ref == $head_ref and .head_sha == $head_sha and .pr_number == $pr_number' \
            "$RUNNER_TEMP/dependabot-generated-files/generated-files-metadata.json"
          python3 trusted/.github/resources/scripts/generated_files_dependency_change.py \
            --check-generated-paths \
            "$RUNNER_TEMP/dependabot-generated-files/generated-files-paths.txt"

      - name: Check out the current Dependabot head read-only
        if: steps.prepare.outputs.eligible == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.prepare.outputs.head_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Apply and validate generated changes with trusted policy
        if: steps.prepare.outputs.eligible == 'true'
        working-directory: source
        shell: bash
        run: |
          git apply --check "$RUNNER_TEMP/dependabot-generated-files/generated-files.patch"
          git apply "$RUNNER_TEMP/dependabot-generated-files/generated-files.patch"
          python3 ../trusted/.github/resources/scripts/generated_files_dependency_change.py \
            --write-worktree-paths "$RUNNER_TEMP/applied-generated-files-paths.txt"
          diff -u \
            "$RUNNER_TEMP/dependabot-generated-files/generated-files-paths.txt" \
            "$RUNNER_TEMP/applied-generated-files-paths.txt"
          python3 ../trusted/.github/resources/scripts/generated_files_dependency_change.py \
            --check-generated-paths "$RUNNER_TEMP/applied-generated-files-paths.txt"

      - name: Commit generated changes with DCO sign-off
        if: steps.prepare.outputs.eligible == 'true'
        working-directory: source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --signoff -m "chore(deps): regenerate generated files"

      - name: Confirm the pull request head is still current
        if: steps.prepare.outputs.eligible == 'true'
        uses: actions/github-script@v8
        env:
          EXPECTED_HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
        with:
          retries: 3
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pullRequest.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed(
                `PR #${process.env.PR_NUMBER} moved from ${process.env.EXPECTED_HEAD_SHA} to ${pullRequest.head.sha}.`
              );
            }

      - name: Push generated commit
        if: steps.prepare.outputs.eligible == 'true'
        working-directory: source
        shell: bash
        env:
          HEAD_REF: ${{ steps.prepare.outputs.head_ref }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          ssh_directory="$RUNNER_TEMP/dependabot-generated-files-ssh"
          install -d -m 700 "$ssh_directory"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_directory/private-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_directory/known-hosts"
          chmod 600 "$ssh_directory/private-key" "$ssh_directory/known-hosts"
          GIT_SSH_COMMAND="ssh -i $ssh_directory/private-key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_directory/known-hosts" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
