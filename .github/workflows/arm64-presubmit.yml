name: KFP ARM64 Presubmit

on:
  pull_request:
    paths:
      - '.github/workflows/arm64-presubmit.yml'
      - '.github/workflows/image-builds.yml'
      - '.github/workflows/ci-images.yml'
      - '.github/actions/shared-ci-images/**'
      - '.github/actions/arm64-smoke/**'
      - '.github/actions/create-cluster/**'
      - '.github/actions/github-disk-cleanup/**'
      - '.github/actions/download-artifact-with-retry/**'
      - '.github/resources/scripts/**'
      - '.github/resources/buildkitd.toml'
      - '.github/resources/curl-retry/**'
      - '.dockerignore'
      - 'api/**'
      - 'backend/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - 'kubernetes_platform/**'
      - 'manifests/kustomize/**'
      - 'pyproject.toml'
      - 'samples/**'
      - 'sdk/python/**'
      - 'third_party/**'
      - 'uv.lock'
      - '!**/*.md'
      - '!**/OWNERS'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arm64-presubmit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    permissions:
      actions: read
      contents: read
    name: Native ARM64 installation and pipeline
    runs-on: ubuntu-24.04-arm
    # Includes the formerly separate 30-minute image-build dependency.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download verified shared ARM images
        uses: ./.github/actions/shared-ci-images
        with:
          architecture: arm64
          path: arm64-images
          layout: flat
      - name: Install KFP and run a pipeline natively
        uses: ./.github/actions/arm64-smoke
        with:
          image_records: arm64-images
          image_archives: arm64-images
          image_mode: local
          source_sha: ${{ github.sha }}
