name: Isolated APF image import diagnosis
on:
  push:
    branches: ['codex/apf-representative-smoke-20261014']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 6bea51e2003f9072a55068fb85e03cdb9391435d
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded smoke prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.2
          curl --fail --silent --show-error --location --max-time 120 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          kubectl version --client
      - name: Download and verify exact image inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python harness/experiment/provision/download_images.py
          --manifest harness/experiment/inputs/discovery-manifest.json
          --output "$RUNNER_TEMP/apf-images"
      - name: Diagnose exact API image import without workloads
        run: >-
          python harness/experiment/nextstage/diagnose_import.py
          --images "$RUNNER_TEMP/apf-images/image-inputs.json"
          --cluster "kfp-apf-diag-${{ github.run_id }}-${{ github.run_attempt }}"
          --out "$RUNNER_TEMP/apf-image-diagnosis"
      - name: Upload digest-only image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apf-image-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apf-image-diagnosis
          if-no-files-found: error
          retention-days: 7
