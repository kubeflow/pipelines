name: Isolated four-seat APF calibrated pair
on:
  push:
    branches: ['codex/apf-representative-smoke-20261014']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 6bea51e2003f9072a55068fb85e03cdb9391435d
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded smoke prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.2
          curl --fail --silent --show-error --location --max-time 120 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          kubectl version --client
      - name: Download and verify exact image inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python harness/experiment/provision/download_images.py
          --manifest harness/experiment/inputs/discovery-manifest.json
          --output "$RUNNER_TEMP/apf-images"
      - name: Prepare private configuration
        run: >-
          python harness/experiment/coordinator/prepare_smoke.py
          --images "$RUNNER_TEMP/apf-images/image-inputs.json"
          --fixtures harness/experiment/fixtures --source source
          --suffix "${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RUNNER_TEMP/apf-config.json"
      - name: Mark distinct constrained scenario
        run: |
          python - <<'PYCONFIG'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'apf-config.json'
          c=json.loads(p.read_text());c['scenario_id']='constrained-fixed-four-seat-bulk-list-v3'
          p.write_text(json.dumps(c))
          PYCONFIG
      - name: Provision owned disposable cluster and real tenant fixtures
        run: >-
          python harness/experiment/coordinator/provision_smoke.py
          --config "$RUNNER_TEMP/apf-config.json" --state "$RUNNER_TEMP/apf-state"
          --provision harness/experiment/provision
          --output "$RUNNER_TEMP/apf-smoke-evidence/provision"
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
      - name: Build experiment clients from pinned dependency module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness/experiment/bin
          cd source
          go build -o ../harness/experiment/bin/workload ../harness/experiment/workload/main.go
          go build -o ../harness/experiment/bin/observer ../harness/experiment/observer/main.go
          go build -o ../harness/experiment/bin/scheduled ../harness/experiment/workload/scheduled/main.go
      - name: Create declared positive four-seat shared priority
        run: >-
          python harness/experiment/nextstage/prepare_policy.py
          --config "$RUNNER_TEMP/apf-config.json" --state "$RUNNER_TEMP/apf-state"
          --stock-policies harness/experiment/nextstage/stock-policy-specs.json
          --out "$RUNNER_TEMP/apf-pair-evidence/policy"
      - name: Prepare bounded same-priority candidate and offered rates
        run: >-
          python harness/experiment/nextstage/prepare_pair.py
          --provision-config "$RUNNER_TEMP/apf-config.json" --state "$RUNNER_TEMP/apf-state"
          --bundle harness/experiment --out "$RUNNER_TEMP/apf-pair-private"
          --evidence-out "$RUNNER_TEMP/apf-pair-evidence/preparation"
      - name: Prepare independent same-priority background identity
        run: >-
          python harness/experiment/nextstage/prepare_background.py
          --coordinator-dir harness/experiment/nextstage
          --config "$RUNNER_TEMP/apf-pair-private/coordinator.json"
          --quiet-template "$RUNNER_TEMP/apf-pair-private/observer.json"
          --out "$RUNNER_TEMP/apf-background-private"
      - name: Preserve bounded background seed and classification evidence
        run: |
          cp "$RUNNER_TEMP/apf-background-private/bulk-seed.json" "$RUNNER_TEMP/apf-pair-evidence/background-bulk-seed.json"
          cp "$RUNNER_TEMP/apf-background-private/classification.json" "$RUNNER_TEMP/apf-pair-evidence/background-classification.json"
      - name: Revalidate frozen64worker1000RPS pressure only
        shell: bash
        run: |
          set -euo pipefail
          python harness/experiment/nextstage/scenario.py \
            --out "$RUNNER_TEMP/apf-pair-evidence/calibration" \
            --observer-binary "$GITHUB_WORKSPACE/harness/experiment/bin/observer" \
            --observer-template "$RUNNER_TEMP/apf-background-private/background-template.json" \
            --stock-policies "$RUNNER_TEMP/apf-pair-evidence/policy/expected-policies.json"
          cp "$RUNNER_TEMP/apf-background-private/classification.json" "$RUNNER_TEMP/apf-pair-evidence/background-classification.json"
          python - <<'PYCONFIG'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);p=root/'apf-pair-private/coordinator.json'
          c=json.loads(p.read_text());c['background_calibration']=str(root/'apf-pair-evidence/calibration/frozen-calibration.json');c['background_template']=str(root/'apf-background-private/background-template.json')
          p.write_text(json.dumps(c))
          PYCONFIG
      - name: Measure negative-only diagnostic continuation
        run: >-
          python harness/experiment/nextstage/run_pair.py
          --config "$RUNNER_TEMP/apf-pair-private/coordinator.json"
          --out "$RUNNER_TEMP/apf-pair-evidence"
      - name: Upload bounded sanitized measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apf-fixed-four-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apf-smoke-evidence
            ${{ runner.temp }}/apf-pair-evidence
          if-no-files-found: warn
          retention-days: 7
