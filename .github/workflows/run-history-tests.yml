name: Release run history transfer

on:
  pull_request:
    branches: [release-2.18]
    paths:
      - 'tools/run-history/**'
      - '.github/workflows/run-history-tests.yml'
  merge_group:
    types: [checks_requested]
    branches: [release-2.18]

permissions:
  contents: read

jobs:
  history-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: history-test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=history-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-pip-cache
        with:
          python-version: '3.11'
          cache-scope: history-transfer-mlmd
          cache-dependency-hash: ${{ hashFiles('tools/run-history/requirements.txt') }}
      - name: Install operator test dependencies
        run: python -m pip install -r tools/run-history/requirements.txt
      - name: Test SQL transactions and real MLMD graph storage
        env:
          KFP_HISTORY_REQUIRE_MLMD: '1'
          KFP_HISTORY_MYSQL_CONFIG: '{"host":"127.0.0.1","port":3306,"user":"root","password":"history-test"}'
        run: python -m unittest discover -s tools/run-history -p 'test_*.py' -v
