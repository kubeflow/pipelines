name: Contributor Report

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  contributor-report:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contributor report
        # v1.3.3
        uses: jdiegosierra/contributor-report@9f7de3ce980ae2d00fa99a1b3d93b1477ebe0ff8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          on-fail: comment
          dry-run: 'false'
          verbose-details: failed
          # Keep negative reactions informational instead of gating the report.
          threshold-negative-reactions: '999'
          new-account-action: neutral
          new-account-threshold-days: '30'
          trusted-users: >-
            dependabot[bot],renovate[bot],github-actions[bot],codecov[bot],sonarcloud[bot],google-oss-prow
