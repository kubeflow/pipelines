name: Contributor Report

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  contributor-report:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'copybara-service[bot]'
    concurrency:
      group: contributor-report-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@v7
        with:
          # Release branches may not contain the script used by this workflow.
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/contributor-report.py
            .github/scripts/kubeflow_membership.py
            .github/scripts/requirements.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install workflow script dependencies
        run: python3 -m pip install -r .github/scripts/requirements.txt

      - name: Generate contributor report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/contributor-report.py
