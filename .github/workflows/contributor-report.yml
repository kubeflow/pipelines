name: Contributor Report

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  contributor-report:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contributor report
        # v1
        uses: jdiegosierra/contributor-report@9f7de3ce980ae2d00fa99a1b3d93b1477ebe0ff8
        env:
          # contributor-report v1 currently accepts only pull_request context.
          # pull_request_target provides the fork-safe token permissions we need
          # for PR comments, so present the compatible event name to the action.
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          on-fail: comment
          dry-run: 'false'
          verbose-details: failed
          # Keep negative reactions informational instead of gating the report.
          threshold-negative-reactions: '999'
          new-account-action: neutral
          new-account-threshold-days: '30'
          trusted-users: >-
            dependabot[bot],renovate[bot],github-actions[bot],codecov[bot],sonarcloud[bot],google-oss-prow
