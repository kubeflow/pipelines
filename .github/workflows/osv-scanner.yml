name: OSV-Scanner Vulnerability Scan
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '39 19 * * 5'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksum-pinned scanner
        env:
          VERSION: '2.5.0'
          SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          echo "$SHA256  /tmp/osv-scanner" | sha256sum --check --strict
          chmod +x /tmp/osv-scanner
      - name: Scan retained dependencies
        run: |
          status=0
          /tmp/osv-scanner scan source --recursive --no-resolve --format sarif --output-file osv-results.sarif . || status=$?
          # Findings are reported; scanner failures must still fail the job.
          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then exit "$status"; fi
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('osv-results.sarif') != ''
        with:
          sarif_file: osv-results.sarif
          category: native-kfp-dependencies
