name: KFP SDK Docformatter Test

on:
  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact queue candidate SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_ref:
        description: Queue target branch, release-2.18 (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_sha:
        description: Current target branch SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
  merge_group:
    types: [checks_requested]
    branches: [release-2.18]
  push:
    branches: [master]

  pull_request:
    paths:
      - 'sdk/python/**'
      - 'test/presubmit-docformatter-sdk.sh'
      - '.github/workflows/sdk-docformatter.yml'
      - '.github/actions/setup-python-pip-cache/**'
      - '!**/*.md'
      - '!**/OWNERS'


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  queue-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    permissions:
      contents: read
    uses: ./.github/workflows/queue-dispatch-guard.yml
    with:
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_ref: ${{ inputs.queue_base_ref }}
      queue_base_sha: ${{ inputs.queue_base_sha }}

  test-docformatter-kfp-sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python-pip-cache
        with:
          python-version: 3.9
          cache-scope: sdk-docformatter
          cache-dependency-hash: ${{ hashFiles('sdk/python/requirements-dev.txt') }}

      - name: Run docformatter tests
        run: ./test/presubmit-docformatter-sdk.sh
