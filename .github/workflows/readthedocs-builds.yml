name: KFP Readthedocs Release Readiness

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - api/**
      - sdk/**
      - kubernetes_platform/**
      - release/**
      - .github/workflows/readthedocs-builds.yml
      - .github/actions/setup-python/**
      - .readthedocs.yml


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-readthedocs-builds:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Install protobuf dependencies & generate proto files
        uses: ./.github/actions/protobuf

      - name: Install kfp & kfp-kubernetes from source
        uses: ./.github/actions/kfp-k8s

      - name: Test release automation
        run: uv run --with-editable ./release python -m unittest release.kfpr.cli_test release.kfpr.steps_test release.kfpr.rtd_test release.kfpr.core_test

      - name: Build KFP SDK Docs
        working-directory: docs/sdk
        run: |
          uv run sphinx-build -b html . _build/html

      - name: Build KFP Kubernetes SDK Docs
        working-directory: kubernetes_platform/python/docs
        run: |
          uv run sphinx-build -b html . _build/html

      - name: Test unified SDK release step
        run: |
          KFP_VERSION="$(uv run python -c 'import kfp; print(kfp.__version__)')"
          RELEASE_TYPE="patch"
          case "$KFP_VERSION" in *.0) RELEASE_TYPE="minor" ;; esac
          uv run --with-editable ./release kfpr run create-sdk-tag \
            --release-type "$RELEASE_TYPE" \
            --version "$KFP_VERSION" \
            --fork-remote upstream \
            --dry-run
