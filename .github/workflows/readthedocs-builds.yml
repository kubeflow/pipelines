name: KFP Readthedocs Release Readiness

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - api/**
      - sdk/**
      - kubernetes_platform/**
      - release/**
      - .github/workflows/readthedocs-builds.yml
      - .github/actions/setup-python/**
      - .readthedocs.yml


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-readthedocs-builds:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.10"

      - name: Install protobuf dependencies & generate proto files
        uses: ./.github/actions/protobuf

      - name: Install kfp & kfp-kubernetes from source
        uses: ./.github/actions/kfp-k8s

      - name: Install release automation package
        run: |
          uv pip install -e release
          uv pip install --upgrade 'typer>=0.16,<1.0'

      - name: Test release automation
        run: uv run python -m unittest release.kfpr.cli_test release.kfpr.steps_test release.kfpr.rtd_test release.kfpr.core_test

      - name: Build KFP SDK Docs
        working-directory: docs/sdk
        run: |
          uv run sphinx-build -b html . _build/html

      - name: Build KFP Kubernetes SDK Docs
        working-directory: kubernetes_platform/python/docs
        run: |
          uv run sphinx-build -b html . _build/html

      - name: Test K8s platform docs release step
        run: |
          KFP_KUBERNETES_VERSION="$(python -c 'from kfp.kubernetes.__init__ import __version__; print(__version__)')"
          RELEASE_TYPE=patch
          case "$KFP_KUBERNETES_VERSION" in *.0) RELEASE_TYPE=minor ;; esac
          kfpr run create-kfp-kubernetes-docs-branch \
            --release-type "$RELEASE_TYPE" \
            --version "$KFP_KUBERNETES_VERSION" \
            --fork-remote upstream \
            --dry-run
