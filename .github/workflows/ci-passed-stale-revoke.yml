# Revoke a stale ci-passed success the moment the development branch advances, narrowing the
# window between a base advance and the next scheduled recovery sweep (#14762).
# Only trusted base-branch code runs here; the same freshness determination as
# CI Check decides which greens are stale. This writes only the commit status.
name: Revoke Stale CI Passed

on:
  push:
    branches: [master, main]

# Serialize push-triggered revocations: a delayed job for an older tip must not
# run concurrently with a newer push's job. revokeStaleGreens additionally bails
# out when the live branch tip no longer matches the triggering push.
concurrency:
  group: revoke-stale-ci-passed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  revoke_stale:
    name: revoke_stale
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Revoke stale ci-passed statuses
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUSH_TIP: ${{ github.event.after || github.sha }}
        with:
          script: |
            const {revokeStaleGreens} = require('./.github/resources/scripts/ci_passed.js');
            const revoked = await revokeStaleGreens({github, context, tip: process.env.PUSH_TIP});
            core.info(`Revoked ${revoked} stale ci-passed status(es).`);
