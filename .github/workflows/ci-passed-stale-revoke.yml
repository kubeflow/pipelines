# Compatibility entry point for master pushes. Current-head CI remains valid
# across base movement; the hook writes no statuses. CI Check re-evaluates
# trusted workflow requirements and checks, while merge policy owns freshness.
name: Revoke Stale CI Passed

on:
  push:
    branches: [master]

# Retain the existing scheduling contract while older events drain.
concurrency:
  group: revoke-stale-ci-passed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  revoke_stale:
    name: revoke_stale
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preserve current-head CI evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUSH_TIP: ${{ github.event.after || github.sha }}
        with:
          script: |
            const {revokeStaleGreens} = require('./.github/resources/scripts/ci_passed.js');
            const revoked = await revokeStaleGreens({github, context, tip: process.env.PUSH_TIP});
            core.info(`Compatibility hook wrote ${revoked} status(es); base movement alone preserves CI evidence.`);
