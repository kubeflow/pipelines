name: KFP upgrade tests

env:
  CLUSTER_NAME: kfp-mlmd-upgrade

on:
  merge_group:
    types: [checks_requested]
    branches: [master, main, release-2.18]
  push:
    branches: [master, main]

  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact queue candidate SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_ref:
        description: Queue target branch, master, main, or release-2.18 (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_sha:
        description: Current target branch SHA (internal queue dispatch)
        required: false
        type: string
        default: ''

  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/upgrade-test.yml'
      - 'backend/Dockerfile'
      - '.github/workflows/image-builds.yml'
      - '.github/workflows/ci-images.yml'
      - '.github/workflows/shared-ci-images-ready.yml'
      - '.github/actions/shared-ci-images/**'
      - '.github/actions/create-cluster/**'
      - '.github/actions/deploy/**'
      - '.github/actions/download-artifact-with-retry/**'
      - '.github/actions/test-and-report/**'
      - '.github/resources/**'
      - 'backend/api/v2/**'
      - 'backend/api/v2beta1/**'
      - 'backend/src/**'
      - 'backend/test/v2/api/**'
      - 'manifests/kustomize/**'
      - 'test_data/sdk_compiled_pipelines/**'
      - '!**/*.md'
      - '!**/OWNERS'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  queue-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    permissions:
      contents: read
    uses: ./.github/workflows/queue-dispatch-guard.yml
    with:
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_ref: ${{ inputs.queue_base_ref }}
      queue_base_sha: ${{ inputs.queue_base_sha }}

  image-artifacts-ready:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/shared-ci-images-ready.yml

  upgrade-test:
    needs: image-artifacts-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        upgrade_mode: [cli-first, startup-only]
        k8s_version: ['v1.36.1']
    name: KFP upgrade tests - ${{ matrix.upgrade_mode }} (K8s ${{ matrix.k8s_version }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Install upgrade script dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/src/apiserver/migration/mlmd/fixturetools/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Create cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: ${{ matrix.k8s_version }}
          cluster_name: ${{ env.CLUSTER_NAME }}

      - name: Download and verify the target images
        uses: ./.github/actions/shared-ci-images
        with:
          ready-state: ${{ needs.image-artifacts-ready.outputs.state }}
          kind: images
          path: ${{ runner.temp }}/upgrade-images

      - name: Load the target API server
        run: |
          docker load -i "$RUNNER_TEMP/upgrade-images/apiserver/apiserver.tar"
          docker tag kind-registry:5000/apiserver:latest kfp-api-server:upgrade-ci
          kind load docker-image --name "$CLUSTER_NAME" kfp-api-server:upgrade-ci
          if docker run --rm --entrypoint /bin/mlmd-migrate kfp-api-server:upgrade-ci --check-release-eligibility > "$RUNNER_TEMP/mlmd-cli-hold.log" 2>&1; then
            echo "The release CLI unexpectedly enabled migration" >&2
            exit 1
          fi
          grep -q 'production MLMD migration is disabled' "$RUNNER_TEMP/mlmd-cli-hold.log"

      - name: Build and load the disposable migration binaries
        run: |
          bin_dir="$(mktemp -d)"
          go build -tags=mlmd_migration_test -o "$bin_dir/apiserver" ./backend/src/apiserver
          go build -tags=mlmd_migration_test -o "$RUNNER_TEMP/mlmd-migrate-test" ./backend/src/apiserver/migration/mlmd/cmd/mlmd-migrate
          docker build -t kfp-api-server:mlmd-cutover-test -f - "$bin_dir" <<'DOCKERFILE'
          FROM kfp-api-server:upgrade-ci
          COPY apiserver /bin/apiserver
          RUN /bin/apiserver -help > /dev/null 2>&1
          DOCKERFILE
          kind load docker-image --name "$CLUSTER_NAME" kfp-api-server:mlmd-cutover-test

      - name: Deploy pinned KFP 2.18.0
        run: |
          release=555bfa60a70da88c594960bdacfd78fa7c061043
          kubectl apply -k "https://github.com/kubeflow/pipelines/manifests/kustomize/cluster-scoped-resources?ref=$release"
          kubectl wait crd/applications.app.k8s.io --for=condition=Established --timeout=60s
          kubectl apply -k "https://github.com/kubeflow/pipelines/manifests/kustomize/env/platform-agnostic?ref=$release"
          kubectl -n kubeflow rollout status deployment/mysql --timeout=240s
          kubectl -n kubeflow rollout status deployment/ml-pipeline --timeout=240s

      - name: Verify pinned upgrade and rollback
        env:
          UPGRADE_MODE: ${{ matrix.upgrade_mode }}
        run: >-
          bash .github/resources/scripts/run-mlmd-upgrade.sh
          "$UPGRADE_MODE" kfp-api-server:mlmd-cutover-test
          "$RUNNER_TEMP/mlmd-migrate-test" kfp-api-server:upgrade-ci

      - name: Inspect upgrade failure
        if: failure()
        run: |
          kubectl -n kubeflow get pods
          kubectl -n kubeflow get events --sort-by=.lastTimestamp
          kubectl -n kubeflow logs deployment/ml-pipeline --all-containers --tail=150
