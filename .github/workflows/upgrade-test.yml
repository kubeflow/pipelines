name: KFP upgrade tests

env:
  TESTS_DIR: "./backend/test/v2/api"
  TESTS_LABEL: "ApiServerTests"
  NUMBER_OF_PARALLEL_NODES: 15
  CLUSTER_NAME: "kfp"
  NAMESPACE: "kubeflow"
  PYTHON_VERSION: "3.11"

on:
  merge_group:
    types: [checks_requested]
    branches: [master, main, release-2.18]
  push:
    branches: [master, main]

  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/upgrade-test.yml'
      - '.github/workflows/image-builds.yml'
      - '.github/workflows/ci-images.yml'
      - '.github/workflows/shared-ci-images-ready.yml'
      - '.github/actions/shared-ci-images/**'
      - '.github/actions/create-cluster/**'
      - '.github/actions/deploy/**'
      - '.github/actions/download-artifact-with-retry/**'
      - '.github/actions/test-and-report/**'
      - '.github/resources/**'
      - 'backend/api/v2/**'
      - 'backend/api/v2beta1/**'
      - 'backend/src/**'
      - 'backend/test/v2/api/**'
      - 'frontend/**'
      - 'manifests/kustomize/**'
      - 'test/frontend-integration-test/**'
      - 'test_data/sdk_compiled_pipelines/**'
      - '!**/*.md'
      - '!**/OWNERS'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-artifacts-ready:
    if: ${{ false }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/shared-ci-images-ready.yml

  upgrade-test:
    needs: image-artifacts-ready
    # TODO(#14029): Remove this checked-in pause once the MLMD-to-native migration and startup gate are implemented.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        k8s_version: [ "v1.36.1" ]
    name: KFP upgrade tests - K8s ${{ matrix.k8s_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.11

      - name: Get last release tag
        shell: bash
        id: get-tag
        run: |
          lastRelease=""
          for attempt in 1 2 3; do
            lastRelease=$(curl -sSL --fail-with-body --connect-timeout 10 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/kubeflow/pipelines/releases/latest" | jq -r .tag_name 2>/dev/null || echo "")
            if [[ -n "$lastRelease" && "$lastRelease" != "null" ]]; then
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Attempt $attempt: Failed to fetch release tag. Retrying in 5s..."
              sleep 5
            fi
          done

          if [[ -z "$lastRelease" || "$lastRelease" == "null" ]]; then
            echo "::error::Could not fetch latest release tag from GitHub API after 3 attempts."
            exit 1
          fi

          echo "Fetched last release tag: $lastRelease"
          echo "lastRelease=$lastRelease" >> "$GITHUB_OUTPUT"

      - name: Create cluster
        uses: ./.github/actions/create-cluster
        id: create-cluster
        with:
          k8s_version: ${{ matrix.k8s_version }}

      - name: Deploy Last Release
        shell: bash
        id: deploy-release
        run: |
          kubectl apply -k https://github.com/kubeflow/pipelines/manifests/kustomize/cluster-scoped-resources?ref=${{ steps.get-tag.outputs.lastRelease }}
          kubectl apply -k https://github.com/kubeflow/pipelines/manifests/kustomize/env/platform-agnostic?ref=${{ steps.get-tag.outputs.lastRelease }}
          source "./.github/resources/scripts/helper-functions.sh"
          wait_for_pods || EXIT_CODE=$?
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "Deploy unsuccessful. Not all pods running."
            exit 1
          fi

      - name: Forward API port
        id: forward-api-port
        if: ${{ steps.deploy-release.outcome == 'success' }}
        shell: bash
        run: ./.github/resources/scripts/forward-port.sh "kubeflow" "ml-pipeline" 8888 8888

      - name: Prepare for Upgrade
        id: prepare-upgrade
        if: ${{ steps.forward-api-port.outcome == 'success' }}
        working-directory: ${{ env.TESTS_DIR }}
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r -v --cover -p --keep-going --github-output=true --nodes=${{ env.NUMBER_OF_PARALLEL_NODES }} -v --label-filter="UpgradePreparation" -- -useLegacyAPIPrefix=true

      - name: Stop port forwarding
        if: ${{ always() }}
        run: |
          pkill -f "port-forward"
        continue-on-error: true

      - name: Deploy from Branch
        uses: ./.github/actions/deploy
        if: ${{ steps.prepare-upgrade.outcome == 'success' }}
        id: deploy
        with:
          image_ready_state: ${{ needs.image-artifacts-ready.outputs.state }}
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
          forward_port: 'true'

      - name: Verify Upgrade
        uses: ./.github/actions/test-and-report
        if: ${{ steps.prepare-upgrade.outcome == 'success' && steps.deploy.outcome == 'success' }}
        with:
          test_directory: ${{ env.TESTS_DIR }}
          test_label: "UpgradeVerification"
          num_parallel_nodes: ${{ env.NUMBER_OF_PARALLEL_NODES }}
          default_namespace: ${{ env.NAMESPACE }}
          python_version: ${{ env.PYTHON_VERSION }}
          report_name: "Upgrade Verification"

  profile-upgrade-test:
    needs: image-artifacts-ready
    # TODO(#14029): Enable alongside the API upgrade job after wiring the supported migration below.
    if: ${{ false }}
    name: Two-profile browser upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create a disposable cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: v1.36.1
          cluster_name: kfp

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install browser test dependencies
        working-directory: frontend/scripts/ui-smoke-test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          node --test profile-auth-gateway.unit.cjs profile-catalog-assertions.unit.cjs

      - name: Deploy the latest published 2.18 MLMD source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/resources/scripts/deploy-profile-upgrade-source.sh

      - name: Create runs in both profiles through the released UI
        run: bash test/frontend-integration-test/run-profile-upgrade.sh source

      # TODO(#14029): Run the supported MLMD migration on this cluster before
      # starting the native candidate. Keep the source databases and storage.
      - name: Deploy the CI candidate in place
        uses: ./.github/actions/deploy
        with:
          image_ready_state: ${{ needs.image-artifacts-ready.outputs.state }}
          cluster_name: kfp
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
          cache_enabled: 'false'
          multi_user: 'true'
          db_type: mysql
          forward_port: 'false'

      - name: Verify retained UI journeys and submit new runs
        run: bash test/frontend-integration-test/run-profile-upgrade.sh target

      - name: Collect cluster diagnostics
        if: failure()
        run: |
          kubectl -n kubeflow get pods -o wide || true
          kubectl -n kubeflow get events --sort-by=.metadata.creationTimestamp | tail -40 || true

      - name: Retain fixture evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile-upgrade/
          if-no-files-found: ignore
