name: KFP upgrade tests

env:
  TESTS_DIR: "./backend/test/v2/api"
  TESTS_LABEL: "ApiServerTests"
  NUMBER_OF_PARALLEL_NODES: 15
  CLUSTER_NAME: "kfp"
  NAMESPACE: "kubeflow"
  PYTHON_VERSION: "3.11"

on:
  push:
    branches: [master, release-2.18]

  workflow_dispatch:
    inputs:
      readiness_schedules:
        description: 'Run isolated multi-user schedule readiness acceptance (release-2.18 only)'
        type: boolean
        default: false

  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/upgrade-test.yml'
      - '.github/workflows/image-builds.yml'
      - '.github/actions/create-cluster/**'
      - '.github/actions/deploy/**'
      - '.github/actions/test-and-report/**'
      - '.github/resources/**'
      - 'tools/upgrade-readiness/**'
      - 'backend/api/v2beta1/**'
      - 'backend/src/**'
      - 'backend/test/v2/api/**'
      - 'manifests/kustomize/**'
      - 'test_data/sdk_compiled_pipelines/**'
      - '!**/*.md'
      - '!**/OWNERS'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # release-2.18 retains MLMD; master still requires the #14029 migration gate.
    if: >-
      ${{ github.base_ref == 'release-2.18' ||
          github.ref == 'refs/heads/release-2.18' ||
          vars.KFP_ENABLE_MLMD_UPGRADE_TESTS == 'true' }}
    uses: ./.github/workflows/image-builds.yml

  upgrade-test:
    # release-2.18 retains MLMD; master still requires the #14029 migration gate.
    if: >-
      ${{ github.base_ref == 'release-2.18' ||
          github.ref == 'refs/heads/release-2.18' ||
          vars.KFP_ENABLE_MLMD_UPGRADE_TESTS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        k8s_version: [ "v1.36.1" ]
    name: KFP upgrade tests - K8s ${{ matrix.k8s_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Select source release
        shell: bash
        id: get-tag
        env:
          RELEASE_218: ${{ github.base_ref == 'release-2.18' || github.ref == 'refs/heads/release-2.18' }}
        run: |
          if [[ "$RELEASE_218" == "true" ]]; then
            echo "Using pinned 2.18 upgrade source: 2.17.2"
            echo "lastRelease=2.17.2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lastRelease=""
          for attempt in 1 2 3; do
            lastRelease=$(curl -sSL --fail-with-body --connect-timeout 10 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/kubeflow/pipelines/releases/latest" | jq -r .tag_name 2>/dev/null || echo "")
            if [[ -n "$lastRelease" && "$lastRelease" != "null" ]]; then
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Attempt $attempt: Failed to fetch release tag. Retrying in 5s..."
              sleep 5
            fi
          done

          if [[ -z "$lastRelease" || "$lastRelease" == "null" ]]; then
            echo "::error::Could not fetch latest release tag from GitHub API after 3 attempts."
            exit 1
          fi

          echo "Fetched last release tag: $lastRelease"
          echo "lastRelease=$lastRelease" >> "$GITHUB_OUTPUT"

      - name: Create cluster
        uses: ./.github/actions/create-cluster
        id: create-cluster
        with:
          k8s_version: ${{ matrix.k8s_version }}

      - name: Deploy Last Release
        shell: bash
        id: deploy-release
        run: |
          kubectl apply -k https://github.com/kubeflow/pipelines/manifests/kustomize/cluster-scoped-resources?ref=${{ steps.get-tag.outputs.lastRelease }}
          kubectl apply -k https://github.com/kubeflow/pipelines/manifests/kustomize/env/platform-agnostic?ref=${{ steps.get-tag.outputs.lastRelease }}
          source "./.github/resources/scripts/helper-functions.sh"
          EXIT_CODE=0
          wait_for_pods || EXIT_CODE=$?
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "Deploy unsuccessful. Not all pods running."
            exit 1
          fi

      - name: Forward API port
        id: forward-api-port
        if: ${{ steps.deploy-release.outcome == 'success' }}
        shell: bash
        run: ./.github/resources/scripts/forward-port.sh "kubeflow" "ml-pipeline" 8888 8888

      - name: Prepare for Upgrade
        id: prepare-upgrade
        if: ${{ steps.forward-api-port.outcome == 'success' }}
        working-directory: ${{ env.TESTS_DIR }}
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r -v --cover -p --keep-going --github-output=true --nodes=${{ env.NUMBER_OF_PARALLEL_NODES }} -v --label-filter="UpgradePreparation"

      - name: Stop port forwarding
        run: |
          pkill -f "port-forward"
        continue-on-error: true

      - name: Deploy from Branch
        uses: ./.github/actions/deploy
        if: ${{ success() && steps.prepare-upgrade.outcome == 'success' }}
        id: deploy
        with:
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
          forward_port: 'true'

      - name: Verify Upgrade
        uses: ./.github/actions/test-and-report
        if: ${{ steps.deploy.outcome == 'success' }}
        with:
          test_directory: ${{ env.TESTS_DIR }}
          test_label: "UpgradeVerification"
          num_parallel_nodes: ${{ env.NUMBER_OF_PARALLEL_NODES }}
          default_namespace: ${{ env.NAMESPACE }}
          python_version: ${{ env.PYTHON_VERSION }}
          report_name: "Upgrade Verification"


  readiness-schedules:
    # Opt in only after the authorized scheduling and audit policy are integrated.
    if: >-
      ${{ (github.base_ref == 'release-2.18' || github.ref == 'refs/heads/release-2.18') &&
          (inputs.readiness_schedules == true || vars.KFP_ENABLE_READINESS_SCHEDULE_TESTS == 'true') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      CLUSTER_NAME: kfp-readiness
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python-pip-cache
        with:
          python-version: '3.11'
          cache-scope: readiness-schedules
          cache-dependency-hash: ${{ hashFiles('.github/workflows/upgrade-test.yml') }}

      - name: Install fixture manifest reader
        run: python3 -m pip install 'PyYAML==6.0.3'

      - name: Require integrated scheduling policy
        run: bash .github/resources/scripts/readiness-schedules.sh preflight

      - name: Create isolated readiness cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: 'v1.36.1'
          cluster_name: kfp-readiness

      - name: Populate 2.17.2 and capture target predictions
        run: bash .github/resources/scripts/readiness-schedules.sh source

      - name: Deploy same-run candidate images
        uses: ./.github/actions/deploy
        with:
          cluster_name: kfp-readiness
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
          forward_port: 'false'

      - name: Compare live enforce and audit schedule outcomes
        run: bash .github/resources/scripts/readiness-schedules.sh target

      - name: Upload sanitized readiness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: readiness-schedules-${{ github.run_id }}
          path: ${{ runner.temp }}/readiness-schedules/reports/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove isolated readiness cluster
        if: ${{ always() }}
        run: kind delete cluster --name kfp-readiness
