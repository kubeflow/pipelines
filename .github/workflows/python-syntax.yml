name: Python Syntax

on:
  merge_group:
    types: [checks_requested]
    branches: [master]
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/python-syntax.yml'

permissions:
  contents: read

jobs:
  python-syntax:
    name: Check Python 3.11 syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Check tracked Python syntax
        run: python3 .github/resources/scripts/check_python_syntax.py
