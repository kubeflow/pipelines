name: Python Syntax

on:
  merge_group:
    types: [checks_requested]
    branches: [release-2.18]
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/python-syntax.yml'

permissions:
  contents: read

jobs:
  python-syntax:
    name: Check Python 3.9 syntax
    # actions/setup-python publishes no Python 3.9 build for Ubuntu 26.04, which
    # ubuntu-latest now selects. ast feature_version is best-effort, so keep
    # checking with a real 3.9 interpreter.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Check tracked Python syntax
        run: python3 .github/resources/scripts/check_python_syntax.py
