name: Legacy cache rolling upgrade

on:
  workflow_dispatch:
  push:
    branches: [release-2.18]
    paths:
      - 'backend/src/cache/**'
      - 'backend/Dockerfile.cacheserver'
      - 'backend/src/apiserver/config/config.json'
      - 'manifests/kustomize/base/installs/generic/pipeline-install-config.yaml'
      - 'test/cache-rolling-upgrade/**'
      - '.github/workflows/cache-rolling-upgrade.yml'
  pull_request:
    branches: [release-2.18]
    paths:
      - 'backend/src/cache/**'
      - 'backend/Dockerfile.cacheserver'
      - 'backend/src/apiserver/config/config.json'
      - 'manifests/kustomize/base/installs/generic/pipeline-install-config.yaml'
      - 'test/cache-rolling-upgrade/**'
      - '.github/workflows/cache-rolling-upgrade.yml'

permissions:
  contents: read

jobs:
  cache-rolling-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Test acceptance assertions
        run: python3 -m unittest discover -s test/cache-rolling-upgrade -p 'test_*.py'
      - name: Create disposable cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: v1.36.1
          cluster_name: cache-rolling
      - name: Build candidate cache server
        run: |
          source .github/resources/scripts/helper-functions.sh
          retry 2 10 docker build -f backend/Dockerfile.cacheserver -t kfp-cache-server:rolling-candidate .
      - name: Load source, target and fixture images
        run: |
          set -euo pipefail
          for image in ghcr.io/kubeflow/kfp-cache-server:2.17.2 mysql:8.0 busybox:1.37; do
            bash .github/resources/scripts/docker-pull-with-retry.sh "$image"
            kind load docker-image --name cache-rolling "$image"
          done
          cache_image=$(python3 -c 'import json; print(json.load(open("backend/src/apiserver/config/config.json"))["CACHE_IMAGE"])')
          bash .github/resources/scripts/docker-pull-with-retry.sh "$cache_image"
          kind load docker-image --name cache-rolling "$cache_image"
          kind load docker-image --name cache-rolling kfp-cache-server:rolling-candidate
      - name: Validate populated rolling upgrade and converged isolation
        run: python3 test/cache-rolling-upgrade/validate.py
      - name: Diagnose failed fixture
        if: failure()
        run: |
          kubectl -n cache-a get pods,deployments,replicasets,endpoints -o wide || true
          kubectl -n cache-a logs mysql --tail=60 || true
          kubectl -n kube-system logs -l component=kube-apiserver --tail=100 || true
          kubectl -n cache-a get events --sort-by=.metadata.creationTimestamp || true
          kubectl -n cache-a logs -l app=cache-server --all-containers --prefix --tail=150 || true
      - name: Retain phase evidence
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: cache-rolling-upgrade-${{ github.run_id }}
          path: |
            /tmp/cache-rolling-report.json
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name cache-rolling

  cache-helper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Pull configured cache helper
        run: |
          cache_image=$(python3 -c 'import json; print(json.load(open("backend/src/apiserver/config/config.json"))["CACHE_IMAGE"])')
          bash .github/resources/scripts/docker-pull-with-retry.sh "$cache_image"
      - name: Install pinned OSV scanner
        env:
          OSV_SCANNER_VERSION: '2.5.0'
          OSV_SCANNER_SHA256: 'edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c'
        run: |
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output osv-scanner
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
      - name: Verify cache helper package coverage
        run: python3 test/cache-rolling-upgrade/scan_helper.py --output /tmp/cache-helper-scan
      - name: Retain package coverage evidence
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: cache-helper-scan-${{ github.run_id }}
          path: /tmp/cache-helper-scan/
