name: KFP backend visualization tests

on:
  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact queue candidate SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_ref:
        description: Queue target branch, release-2.18 (internal queue dispatch)
        required: false
        type: string
        default: ''
      queue_base_sha:
        description: Current target branch SHA (internal queue dispatch)
        required: false
        type: string
        default: ''
  merge_group:
    types: [checks_requested]
    branches: [release-2.18]
  push:
    branches: [ master ]

  pull_request:
    paths:
      - '.github/workflows/backend-visualization.yml'
      - '.github/actions/setup-python-pip-cache/**'
      - 'backend/src/apiserver/visualization/**'
      - 'test/presubmit-backend-visualization.sh'
      - '!**/*.md'
      - '!**/OWNERS'


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  queue-dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/')
    permissions:
      contents: read
    uses: ./.github/workflows/queue-dispatch-guard.yml
    with:
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_ref: ${{ inputs.queue_base_ref }}
      queue_base_sha: ${{ inputs.queue_base_sha }}

  backend-visualization-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python-pip-cache
        with:
          python-version: '3.11'
          cache-scope: backend-visualization
          cache-dependency-hash: ${{ hashFiles('backend/src/apiserver/visualization/requirements*.txt') }}

      - name: Install dependencies
        run: make install-backend-visualization-deps

      - name: Run tests
        run: make test-backend-visualization
