# Register the release-only workflow for API dispatch from the default branch.
# Queue dispatch executes the real implementation at the release candidate ref.
name: KFP backend visualization tests
on:
  workflow_dispatch:
    inputs:
      queue_head_sha:
        description: Exact release queue candidate SHA
        type: string
        required: true
      queue_base_ref:
        description: Release queue target branch
        type: string
        required: true
      queue_base_sha:
        description: Exact release queue base SHA
        type: string
        required: true
permissions: {}
jobs:
  release-only:
    runs-on: ubuntu-latest
    steps:
      - name: Reject execution outside the release implementation
        run: |
          echo "::error::Dispatch this workflow on a verified release queue ref, not the default branch."
          exit 1
