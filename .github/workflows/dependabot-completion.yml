name: Complete Dependabot updates
on:
  workflow_run:
    workflows: ['Dependabot completion request']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: dependabot-completion-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  generate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Inspect live bot proposal with trusted code
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/resources/scripts/dependabot_completion.py prepare
      - uses: astral-sh/setup-uv@v7
        if: steps.plan.outputs.kind == 'python'
        with:
          version: '0.10.3'
          enable-cache: false
      - uses: ./.github/actions/setup-go
        if: steps.plan.outputs.kind == 'go' || steps.plan.outputs.kind == 'argo'
        with:
          # Read only the trusted compiler policy; never execute proposal tooling.
          cache: false
      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.kind == 'go'
      - name: Install the selected gh-aw release with a trusted installer
        if: steps.plan.outputs.kind == 'gh-aw'
        uses: ./.github/actions/setup-gh-aw
        with:
          version: ${{ steps.plan.outputs.version }}
      - name: Install trusted workflow inventory parser
        if: steps.plan.outputs.kind == 'gh-aw'
        run: python3 -m pip install -r .github/scripts/requirements.txt
      - name: Generate without a write token or PR scripts
        id: generate
        if: steps.plan.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/resources/scripts/dependabot_completion.py generate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.generate.outputs.changed == 'true'
        with:
          name: dependency-completion-${{ github.run_attempt }}
          path: ${{ runner.temp }}/completion.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          name: dependency-completion-${{ github.run_attempt }}
          path: ${{ runner.temp }}
          required-files: completion.json
      - name: Validate data before acquiring write credentials
        run: python3 .github/resources/scripts/dependabot_completion.py validate
      - name: Require explicitly configured publication identity
        env:
          APP_ID: ${{ vars.DEPENDABOT_COMPLETION_APP_ID }}
          APP_KEY: ${{ secrets.DEPENDABOT_COMPLETION_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo '::error::Configure the Dependabot completion GitHub App described in docs/agents/dependabot.md. Generated changes are available in the workflow artifact.'
            exit 1
          fi
      - name: Create a repository-scoped writer token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DEPENDABOT_COMPLETION_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_COMPLETION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write
      - name: Configure the App's DCO identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          login="${APP_SLUG}[bot]"
          id="$(gh api "users/$login" --jq .id)"
          git config user.name "$login"
          git config user.email "${id}+${login}@users.noreply.github.com"
      - name: Revalidate live head and atomically append generated files
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .github/resources/scripts/dependabot_completion.py publish
