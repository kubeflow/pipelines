name: AI Issue Quality Analyzer
on:
  issues:
    types: [opened]

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Install GitHub Models Extension
        run: gh extension install github/gh-models

      - name: Execute AI Issue Triage
        id: ai_logic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          RAW_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_MODEL: "openai/gpt-4o-mini"
        run: python .github/scripts/ai_triage.py

      - name: Post Issue Review or Validation Comment
        if: ${{ steps.ai_logic.outputs.analysis != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPORT: ${{ steps.ai_logic.outputs.analysis }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "$REPORT"