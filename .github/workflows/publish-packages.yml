name: Publish Python Packages
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag associated with the release (e.g.: 2.14.0)"
      packages:
        type: choice
        required: true
        description: "Which package(s) to publish"
        options:
          - all
          - kfp-pipeline-spec
          - kfp-server-api
          - kfp
          - kfp-kubernetes
      dry_run:
        type: boolean
        required: true
        default: true
        description: "Dry run - build packages without publishing to PyPI"

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.10.3"
  # Twine 7 validates current Hatch metadata and requires Python >=3.10.
  TWINE_VERSION: "7.0.0"
  TWINE_PYTHON_VERSION: "3.12"

jobs:
  publish-kfp-pipeline-spec:
    if: ${{ github.event.inputs.packages == 'all' || github.event.inputs.packages == 'kfp-pipeline-spec' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      # The selected tag may predate repository-local uv actions.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build kfp-pipeline-spec
        run: |
          make -C api python
          uvx --python "${TWINE_PYTHON_VERSION}" --from "twine==${TWINE_VERSION}" twine check api/v2alpha1/python/dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: api/v2alpha1/python/dist/
          print-hash: true

      - name: Upload artifacts (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: kfp-pipeline-spec-dist
          path: api/v2alpha1/python/dist/

  publish-kfp-server-api:
    if: ${{ github.event.inputs.packages == 'all' || github.event.inputs.packages == 'kfp-server-api' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build kfp-server-api
        run: |
          rm -rf backend/api/v2beta1/python_http_client/dist
          # A source-path build supports pyproject.toml and legacy setup.py tags.
          uv build backend/api/v2beta1/python_http_client --out-dir backend/api/v2beta1/python_http_client/dist
          uvx --python "${TWINE_PYTHON_VERSION}" --from "twine==${TWINE_VERSION}" twine check backend/api/v2beta1/python_http_client/dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/api/v2beta1/python_http_client/dist/
          print-hash: true

      - name: Upload artifacts (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: kfp-server-api-dist
          path: backend/api/v2beta1/python_http_client/dist/

  publish-kfp:
    if: ${{ github.event.inputs.packages == 'all' || github.event.inputs.packages == 'kfp' }}
    # Uncomment once all packages in PyPi are configured to be released from this repo.
    # needs: [publish-kfp-pipeline-spec, publish-kfp-server-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build kfp
        run: |
          make -C sdk python
          uvx --python "${TWINE_PYTHON_VERSION}" --from "twine==${TWINE_VERSION}" twine check sdk/python/dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          print-hash: true

      - name: Upload artifacts (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: kfp-dist
          path: sdk/python/dist/

  publish-kfp-kubernetes:
    if: ${{ github.event.inputs.packages == 'all' || github.event.inputs.packages == 'kfp-kubernetes' }}
    # Uncomment once all packages in PyPi are configured to be released from this repo.
    # needs: [publish-kfp-pipeline-spec, publish-kfp]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build kfp-kubernetes
        run: |
          make -C kubernetes_platform python
          uvx --python "${TWINE_PYTHON_VERSION}" --from "twine==${TWINE_VERSION}" twine check kubernetes_platform/python/dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: kubernetes_platform/python/dist/
          print-hash: true

      - name: Upload artifacts (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: kfp-kubernetes-dist
          path: kubernetes_platform/python/dist/
