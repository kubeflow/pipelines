# Presubmit gate for the Python tooling and CI action wiring under .github:
# the unit tests use the `*_test.py` suffix, so select
# that pattern explicitly because it is not unittest discover's default.
name: CI Scripts Tests

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '**/go.mod'
      - '**/package.json'
      - '**/requirements*.txt'
      - '**/setup.py'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/action.yml'
      - '**/action.yaml'
      - '.pre-commit-config.yaml'
      - '.github/actions/create-cluster/**'
      - '.github/actions/deploy/**'
      - '.github/actions/download-artifact-with-retry/**'
      - '.github/resources/curl-retry/**'
      - '.github/resources/buildkitd.toml'
      - '.github/resources/runtime-base-images.txt'
      - '.github/resources/scripts/*.py'
      - '.github/resources/scripts/*.js'
      - '.github/resources/ci-workflow-inventory.json'
      # Any trigger change must update the expected-workflow inventory.
      - '.github/workflows/**'
      - '.github/scripts/*.py'
      - '.github/resources/ci-health-dashboard/**'
      # The observability shell scripts are covered by Python-driven tests.
      - '.github/resources/scripts/*.sh'
      - '.github/resources/scripts/kfp-readiness/**'
      - '.github/actions/junit-summary/**'
      # The pipefail and workflow-privilege guards are repo-wide, so they
      # must also run for workflows not enumerated below.
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/ci-checks.yml'
      - '.github/workflows/create-manifest.yml'
      - '.github/actions/upload-artifact-with-retry/**'
      - '.github/actions/test-and-report/**'
      - '.github/workflows/api-server-tests.yml'
      - '.github/workflows/create-manifest.yml'
      - '.github/actions/publish-ci-result/**'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/e2e-test-frontend.yml'
      - '.github/workflows/image-builds.yml'
      - '.github/workflows/validate-generated-files.yml'
      - '.github/workflows/osv-scanner.yml'
      - '.github/workflows/build-tools-images.yml'
      - '.github/workflows/runtime-base-images.yml'
      - '.github/workflows/ci-scripts-tests.yml'
      - '.github/workflows/check-requirements-txt.yml'
      - '.github/workflows/check-uv-lock.yml'
      - '.github/workflows/publish-packages.yml'
      - '.github/workflows/pre-commit.yml'
      - '.github/workflows/pr-gate.yml'
      - '.github/workflows/ci-health-report.yml'
      - '.github/workflows/gh-workflow-approve.yml'
      - '.github/workflows/contributor-report.yml'
      # Inputs read by the v2 deployment contract and profile-controller tests.
      - 'manifests/kustomize/**'
      - '.github/resources/manifests/**'
      - 'backend/api/v2beta1/**'
      - 'backend/Dockerfile.visualization'
      - 'backend/src/apiserver/visualization/**'
      - 'frontend/src/apisv2beta1/visualization/**'
      - 'docs/_static/kfp_api_single_file.swagger.json'
      - 'Makefile'
      - 'backend/src/v2/Makefile'
      - 'release/kfpr/core.py'
      - 'test_data/sdk_compiled_pipelines/valid/**'
      - '.github/workflows/legacy-v2-api-integration-tests.yml'
      - 'backend/Dockerfile'
      - 'backend/api/build_kfp_server_api_python_package.sh'
      - 'hack/update-requirements.sh'
      - '.readthedocs.yml'
      - 'kubernetes_platform/python/docs/.readthedocs.yml'
      - 'sdk/python/kfp/version.py'
      - 'kubernetes_platform/python/kfp/kubernetes/__init__.py'
      - 'kubernetes_platform/python/release.sh'
      - 'backend/src/common/types.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/install-argo-cli.sh'
      - 'third_party/argo/COMPATIBILITY_VERSION'
      - 'third_party/argo/Makefile'
      - 'third_party/argo/UPGRADE.md'
      - 'third_party/argo/VERSION'
      - 'test_data/sdk_compiled_pipelines/valid/critical/modelcar/Dockerfile'

permissions:
  contents: read

jobs:
  profile-controller-tests:
    name: Run profile-controller unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run profile-controller tests
        working-directory: manifests/kustomize/base/installs/multi-user/pipelines-profile-controller
        run: bash run_tests.sh

  python-script-tests:
    name: Run .github scripts unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install workflow script dependencies
        run: python3 -m pip install -r .github/scripts/requirements.txt
      - name: Run Python resource script unit tests
        working-directory: .github/resources/scripts
        run: python3 -m unittest discover -v -p '*_test.py'
      - name: Run repo-local workflow script unit tests
        working-directory: .github/scripts
        run: python3 -m unittest discover -v -p '*_test.py'
      - name: Run JUnit summary action unit tests
        working-directory: .github/actions/junit-summary
        run: python3 -m unittest discover -v -p '*_test.py'
