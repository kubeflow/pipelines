name: KFP SDK Upgrade Test

on:
  push:
    branches: [master, main]

  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - 'sdk/python/**'
      - 'test/presubmit-test-sdk-upgrade.sh'
      - '.github/workflows/sdk-upgrade.yml'
      - '.github/actions/setup-python/**'
      - '!**/*.md'
      - '!**/OWNERS'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-upgrade-kfp-sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python with uv
        uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'

      - name: Install protobuf dependencies & generate proto files
        uses: ./.github/actions/protobuf

      - name: Run SDK upgrade tests
        env:
          SETUP_ENV: false
        run: ./test/presubmit-test-sdk-upgrade.sh
