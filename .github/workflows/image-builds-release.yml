name: Build and Push for Release
on:
  workflow_dispatch:
    inputs:
      src_branch:
        type: string
        default: 'release-X.Y'
        description: 'Source branch to build KFP from'
        required: true
      target_tag:
        type: string
        default: 'X.Y.Z'
        description: 'Target Image Tag'
        required: true
      overwrite_imgs:
        type: string
        default: 'true'
        description: 'Overwrite images in GHCR if they already exist for this tag.'
        required: true
      set_latest:
        type: string
        default: 'true'
        description: 'Set latest tag on build images.'
        required: true
      add_sha_tag:
        type: string
        default: 'true'
        description: 'Add a sha image tag.'
        required: false
      enforce_profile_isolation:
        description: Require metadata isolation as well as owner compatibility
        type: boolean
        default: false
        required: false
      dry_run:
        type: boolean
        default: false
        description: 'Dry run mode - build images without pushing to registry or creating tags.'
        required: false
jobs:
  resolve-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.src_branch == github.ref_name && github.sha || inputs.src_branch }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-images-for-release:
    needs: resolve-candidate
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: kfp-api-server
            dockerfile: backend/Dockerfile
            context: .
          - name: kfp-frontend
            dockerfile: frontend/Dockerfile
            context: .
          - name: kfp-persistence-agent
            dockerfile: backend/Dockerfile.persistenceagent
            context: .
          - name: kfp-scheduled-workflow-controller
            dockerfile: backend/Dockerfile.scheduledworkflow
            context: .
          - name: kfp-viewer-crd-controller
            dockerfile: backend/Dockerfile.viewercontroller
            context: .
          - name: kfp-visualization-server
            dockerfile: backend/Dockerfile.visualization
            context: .
          - name: kfp-tensorboard
            dockerfile: backend/Dockerfile.tensorboard
            context: .
          - name: kfp-launcher
            dockerfile: backend/Dockerfile.launcher
            context: .
          - name: kfp-profile-controller
            dockerfile: manifests/kustomize/base/installs/multi-user/pipelines-profile-controller/Dockerfile
            context: manifests/kustomize/base/installs/multi-user/pipelines-profile-controller
          - name: kfp-driver
            dockerfile: backend/Dockerfile.driver
            context: .
          - name: kfp-cache-deployer
            dockerfile: backend/src/cache/deployer/Dockerfile
            context: .
          - name: kfp-cache-server
            dockerfile: backend/Dockerfile.cacheserver
            context: .
          - name: kfp-metadata-envoy
            dockerfile: third_party/metadata_envoy/Dockerfile
            context: .
          - name: kfp-metadata-writer
            dockerfile: backend/metadata_writer/Dockerfile
            context: .
          - name: kfp-inverse-proxy-agent
            dockerfile: proxy/Dockerfile
            context: ./proxy

        arch:
          - arch_name: amd64
            runs_on: ubuntu-latest
            platform: linux/amd64
          - arch_name: arm64
            runs_on: ubuntu-24.04-arm
            platform: linux/arm64

        exclude:
          - image: { name: kfp-metadata-writer }
            arch: { arch_name: arm64 }

          - image: { name: kfp-inverse-proxy-agent }
            arch: { arch_name: arm64 }

    uses: ./.github/workflows/build-and-push.yml
    with:
      src_branch: ${{ needs.resolve-candidate.outputs.sha }}
      target_tag: ${{ inputs.target_tag }}
      arch_tag: ${{ matrix.arch.arch_name }}
      overwrite_imgs: ${{ inputs.overwrite_imgs }}
      set_latest: ${{ inputs.set_latest }}
      add_sha_tag: ${{ inputs.add_sha_tag }}
      app_to_build: ${{ matrix.image.name }}
      image_context: ${{ matrix.image.context }}
      docker_file: ${{ matrix.image.dockerfile }}
      platforms: ${{ matrix.arch.platform }}
      runs_on: ${{ matrix.arch.runs_on }}
      push: ${{ !inputs.dry_run }}

  qualify-profile-upgrade:
    name: Two-profile release upgrade acceptance
    needs: [resolve-candidate, build-images-for-release]
    if: ${{ !inputs.dry_run && (github.ref_name == 'release-2.18' || startsWith(inputs.target_tag, '2.18.')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - uses: ./.github/actions/download-artifact-with-retry
        with:
          path: ${{ runner.temp }}/profile-release-digests
          pattern: digests-*-amd64
      - uses: ./.github/actions/profile-upgrade
        with:
          target-tag: ${{ inputs.target_tag }}
          release-digests: ${{ runner.temp }}/profile-release-digests
          metadata-isolation: ${{ (inputs.enforce_profile_isolation || vars.KFP_ENFORCE_PROFILE_ISOLATION == 'true') && 'enforce' || 'report' }}

  create-manifests:
    needs: [build-images-for-release, qualify-profile-upgrade]
    if: >-
      ${{ always() && !cancelled() && !inputs.dry_run &&
          needs.build-images-for-release.result == 'success' &&
          (needs.qualify-profile-upgrade.result == 'success' ||
           (github.ref_name != 'release-2.18' && !startsWith(inputs.target_tag, '2.18.') &&
            needs.qualify-profile-upgrade.result == 'skipped')) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component:
          - image: kfp-api-server
          - image: kfp-frontend
          - image: kfp-persistence-agent
          - image: kfp-scheduled-workflow-controller
          - image: kfp-viewer-crd-controller
          - image: kfp-visualization-server
          - image: kfp-tensorboard
          - image: kfp-launcher
          - image: kfp-profile-controller
          - image: kfp-driver
          - image: kfp-cache-deployer
          - image: kfp-cache-server
          - image: kfp-metadata-writer
          - image: kfp-metadata-envoy
          - image: kfp-inverse-proxy-agent
    uses: ./.github/workflows/create-manifest.yml
    with:
      target_tag: ${{ inputs.target_tag }}
      app_to_build: ${{ matrix.component.image }}
      set_latest: ${{ inputs.set_latest }}
