# Keep the legacy file path: CI Check matches paths from the PR base.
name: Python Ruff Format

on:
  push:
    branches: [master, main]

  pull_request:
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - '**/*.py'
      - '**/*.pyi'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'test/presubmit-ruff.sh'
      - '.github/workflows/sdk-yapf.yml'
      - '.github/actions/setup-python/**'
      - '!**/*.md'
      - '!**/OWNERS'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Python with uv
      uses: ./.github/actions/setup-python
      with:
        python-version: '3.11'

    - name: Check Python formatting with Ruff
      run: uv run --frozen --extra lint ruff format --check .
