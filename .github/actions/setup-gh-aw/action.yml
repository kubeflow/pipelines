name: Set up the pinned gh-aw compiler
description: Install the compiler used to generate ai-analyzer.lock.yml
inputs:
  version:
    description: Exact compiler release selected by a validated update
    required: false
    default: v0.87.2
runs:
  using: composite
  steps:
    - name: Install gh-aw
      uses: github/gh-aw/actions/setup-cli@d46b759176d4402dd99ea454e40841ad3c88c85e # v0.87.2
      with:
        version: ${{ inputs.version }}
