name: "Download artifact with retry"
description: "Download workflow artifacts and retry one failed or incomplete download"

inputs:
  name:
    description: "Name of the artifact to download; empty downloads all matching artifacts"
    required: false
    default: ''
  path:
    description: "Absolute or workspace-relative destination path"
    required: true
  pattern:
    description: "Glob pattern matching artifacts to download"
    required: false
    default: ''
  merge-multiple:
    description: "Extract multiple artifacts into the same destination directory"
    required: false
    default: 'false'
  github-token:
    description: "Token for downloads from another workflow run or repository"
    required: false
    default: ''
  repository:
    description: "Repository containing the artifacts"
    required: false
    default: ${{ github.repository }}
  run-id:
    description: "Workflow run containing the artifacts"
    required: false
    default: ${{ github.run_id }}
  retry-delay-seconds:
    description: "Delay before the retry attempt"
    required: false
    default: '20'
  required-files:
    description: "Newline-separated paths relative to the destination that each attempt must download as nonempty files"
    required: true

outputs:
  download-path:
    description: "Absolute path where artifacts were downloaded"
    value: ${{ steps.retry.outputs.download-path || steps.primary.outputs.download-path }}

runs:
  using: "composite"
  steps:
    - name: Prepare required artifact files
      id: prepare-primary
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DOWNLOAD_PATH: ${{ inputs.path }}
        REQUIRED_FILES: ${{ inputs.required-files }}
      run: bash "$ACTION_PATH/required-files.sh" prepare

    # The client can fail during transport or succeed with an incomplete list
    # of artifacts. Validate the extracted files before accepting either attempt.
    - name: Download artifact
      id: primary
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ inputs.repository }}
        run-id: ${{ inputs.run-id }}
      continue-on-error: true

    - name: Verify required artifact files
      id: verify-primary
      if: ${{ !cancelled() && steps.primary.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DOWNLOAD_PATH: ${{ steps.primary.outputs.download-path || inputs.path }}
        REQUIRED_FILES: ${{ inputs.required-files }}
      run: |
        if bash "$ACTION_PATH/required-files.sh" verify; then
          echo 'complete=true' >> "$GITHUB_OUTPUT"
        else
          echo 'complete=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Wait before retrying artifact download
      if: ${{ !cancelled() && (steps.primary.outcome == 'failure' || steps.verify-primary.outputs.complete == 'false') }}
      shell: bash
      env:
        RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
      run: |
        echo "Artifact download failed or is incomplete; retrying in ${RETRY_DELAY_SECONDS}s"
        sleep "$RETRY_DELAY_SECONDS"

    - name: Prepare required artifact files for retry
      id: prepare-retry
      if: ${{ !cancelled() && (steps.primary.outcome == 'failure' || steps.verify-primary.outputs.complete == 'false') }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DOWNLOAD_PATH: ${{ inputs.path }}
        REQUIRED_FILES: ${{ inputs.required-files }}
      run: bash "$ACTION_PATH/required-files.sh" prepare

    - name: Retry artifact download
      id: retry
      if: ${{ !cancelled() && steps.prepare-retry.outcome == 'success' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ inputs.repository }}
        run-id: ${{ inputs.run-id }}
      continue-on-error: true

    - name: Verify required artifact files after retry
      id: verify-retry
      if: ${{ !cancelled() && steps.retry.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DOWNLOAD_PATH: ${{ steps.retry.outputs.download-path || inputs.path }}
        REQUIRED_FILES: ${{ inputs.required-files }}
      run: |
        if bash "$ACTION_PATH/required-files.sh" verify; then
          echo 'complete=true' >> "$GITHUB_OUTPUT"
        else
          echo 'complete=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Verify artifact download
      if: ${{ always() && !cancelled() }}
      shell: bash
      env:
        PREPARE_OUTCOME: ${{ steps.prepare-primary.outcome }}
        RETRY_PREPARE_OUTCOME: ${{ steps.prepare-retry.outcome }}
        PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
        PRIMARY_FILES_COMPLETE: ${{ steps.verify-primary.outputs.complete }}
        RETRY_OUTCOME: ${{ steps.retry.outcome }}
        RETRY_FILES_COMPLETE: ${{ steps.verify-retry.outputs.complete }}
      run: |
        if [[ "$PRIMARY_OUTCOME" == "success" && "$PRIMARY_FILES_COMPLETE" == "true" ]] ||
           [[ "$RETRY_OUTCOME" == "success" && "$RETRY_FILES_COMPLETE" == "true" ]]; then
          exit 0
        fi
        if [[ "$PREPARE_OUTCOME" != "success" ]]; then
          echo "::error::Artifact download did not start: required-file preparation failed"
        elif [[ "$RETRY_PREPARE_OUTCOME" == "failure" ]]; then
          echo "::error::Artifact retry did not start: required-file preparation failed after the first download"
        else
          attempts=0
          for outcome in "$PRIMARY_OUTCOME" "$RETRY_OUTCOME"; do
            case "$outcome" in
              success|failure) attempts=$((attempts + 1)) ;;
            esac
          done
          echo "::error::Artifact download failed or is incomplete after $attempts attempt(s)"
        fi
        exit 1
