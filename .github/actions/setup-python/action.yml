name: "Setup Python with uv"
description: "Install Python, uv, and CI dependencies"
inputs:
  python-version:
    description: "Python version to use"
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Install dependencies
      run: uv sync --python ${{ inputs.python-version }} --extra ci --frozen
      shell: bash

    - name: Use the workspace virtual environment
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      shell: bash
