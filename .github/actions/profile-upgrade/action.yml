name: Two-profile upgrade acceptance
description: Preserve existing profile data and authorization across an in-place KFP upgrade
inputs:
  image-artifacts-ready:
    description: Whether this run has published CI image tarballs
    default: 'false'
  release-digests:
    description: Absolute path to the candidate release's AMD64 digest artifacts, when qualifying a release
    default: ''
  metadata-isolation:
    description: Enforce metadata isolation or report confirmed failures during the revert window
    default: enforce
runs:
  using: composite
  steps:
    - name: Start the upgrade cluster
      uses: ./.github/actions/create-cluster
      with:
        k8s_version: v1.36.1
        cluster_name: kfp
    - name: Deploy previous release
      shell: bash
      run: bash .github/resources/scripts/deploy-profile-upgrade-source.sh
    - name: Set up Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: frontend/.nvmrc
    - name: Install browser test dependencies
      shell: bash
      working-directory: frontend/scripts/ui-smoke-test
      run: |
        npm ci
        npx playwright install --with-deps --only-shell chromium
        node --test profile-catalog-assertions.unit.cjs
    - name: Sign in, upload pipelines and create pre-upgrade runs
      id: history
      shell: bash
      env:
        PROFILE_UI_URL: http://127.0.0.1:3000
        PROFILE_PIPELINE_FILE: ${{ runner.temp }}/profile-pipeline.yaml
        PROFILE_RUN_OUTPUT: ${{ runner.temp }}/profile-source-runs.env
      run: |
        set -euo pipefail
        kubectl -n kubeflow port-forward service/ml-pipeline-ui 3000:80 > "$RUNNER_TEMP/profile-source-forward.log" 2>&1 &
        forward_pid=$!
        trap 'kill "$forward_pid" 2>/dev/null || true; wait "$forward_pid" 2>/dev/null || true' EXIT
        for attempt in {1..60}; do
          if curl --silent --fail --max-time 3 --output /dev/null "$PROFILE_UI_URL/"; then break; fi
          if [[ $attempt == 60 ]]; then
            echo "Timed out waiting for the upgrade fixture frontend" >&2
            exit 1
          fi
          sleep 2
        done
        fixture_output=$(mktemp)
        GITHUB_OUTPUT="$fixture_output" bash test/frontend-integration-test/prepare-profile-run.sh
        source "$fixture_output"
        export PROFILE_OWNER="$owner" PROFILE_FOREIGN="$foreign"
        export PROFILE_OWNER_NAMESPACE="$owner_namespace" PROFILE_FOREIGN_NAMESPACE="$foreign_namespace"
        node --test frontend/scripts/ui-smoke-test/profile-run-create.e2e.cjs
        cat "$fixture_output" "$PROFILE_RUN_OUTPUT" >> "$GITHUB_OUTPUT"
        source "$PROFILE_RUN_OUTPUT"
        PROFILE_RUN_ID="$run_id" PROFILE_FOREIGN_RUN_ID="$foreign_run_id" \
          bash test/frontend-integration-test/check-profile-upgrade-history.sh capture "$RUNNER_TEMP/profile-history.json"
    - name: Upgrade to the CI candidate
      if: inputs.release-digests == ''
      uses: ./.github/actions/deploy
      with:
        image_artifacts_ready: ${{ inputs.image-artifacts-ready }}
        cluster_name: kfp
        image_path: images_${{ github.run_id }}
        image_tag: latest
        image_registry: kind-registry:5000
        cache_enabled: 'false'
        multi_user: 'true'
        db_type: mysql
        forward_port: 'false'
    - name: Upgrade to the release candidate digests
      if: inputs.release-digests != ''
      shell: bash
      env:
        PROFILE_RELEASE_DIGESTS: ${{ inputs.release-digests }}
      run: bash .github/resources/scripts/deploy-profile-upgrade-source.sh --candidate "$PROFILE_RELEASE_DIGESTS"
    - name: Wait for the candidate API and frontend rollouts
      shell: bash
      run: |
        kubectl -n kubeflow rollout status deployment/ml-pipeline --timeout=240s
        kubectl -n kubeflow rollout status deployment/ml-pipeline-ui --timeout=240s
    - name: Verify historical browser journeys and submit new runs
      shell: bash
      env:
        PROFILE_UI_URL: http://127.0.0.1:3000
        PROFILE_PIPELINE_FILE: ${{ runner.temp }}/profile-pipeline.yaml
        PROFILE_RUN_OUTPUT: ${{ runner.temp }}/profile-candidate-runs.env
        PROFILE_ISOLATION_MODE: ${{ inputs.metadata-isolation }}
        PROFILE_RUN_ID: ${{ steps.history.outputs.run_id }}
        PROFILE_RUN_NAME: ${{ steps.history.outputs.run_name }}
        PROFILE_COMPARISON_RUN_ID: ${{ steps.history.outputs.comparison_run_id }}
        PROFILE_COMPARISON_RUN_NAME: ${{ steps.history.outputs.comparison_run_name }}
        PROFILE_FOREIGN_RUN_NAME: ${{ steps.history.outputs.foreign_run_name }}
        PROFILE_FOREIGN_COMPARISON_RUN_ID: ${{ steps.history.outputs.foreign_comparison_run_id }}
        PROFILE_FOREIGN_COMPARISON_RUN_NAME: ${{ steps.history.outputs.foreign_comparison_run_name }}
        PROFILE_FOREIGN_RUN_ID: ${{ steps.history.outputs.foreign_run_id }}
        PROFILE_OWNER: ${{ steps.history.outputs.owner }}
        PROFILE_FOREIGN: ${{ steps.history.outputs.foreign }}
        PROFILE_OWNER_NAMESPACE: ${{ steps.history.outputs.owner_namespace }}
        PROFILE_FOREIGN_NAMESPACE: ${{ steps.history.outputs.foreign_namespace }}
      run: |
        set -euo pipefail
        kubectl -n kubeflow port-forward service/ml-pipeline-ui 3000:80 > "$RUNNER_TEMP/profile-target-forward.log" 2>&1 &
        forward_pid=$!
        trap 'kill "$forward_pid" 2>/dev/null || true; wait "$forward_pid" 2>/dev/null || true' EXIT
        for attempt in {1..60}; do
          if curl --silent --fail --max-time 3 --output /dev/null "$PROFILE_UI_URL/"; then break; fi
          if [[ $attempt == 60 ]]; then
            echo "Timed out waiting for the upgrade fixture frontend" >&2
            exit 1
          fi
          sleep 2
        done
        bash test/frontend-integration-test/check-profile-upgrade-history.sh verify "$RUNNER_TEMP/profile-history.json"
        bash test/frontend-integration-test/prepare-profile-run.sh --restore-fixture-network
        journey_status=0
        node --test frontend/scripts/ui-smoke-test/profile-artifact-catalog.e2e.cjs \
          frontend/scripts/ui-smoke-test/profile-run-comparison.e2e.cjs || journey_status=$?
        node --test frontend/scripts/ui-smoke-test/profile-run-create.e2e.cjs || journey_status=$?
        exit "$journey_status"
    - name: Collect upgrade diagnostics
      if: failure()
      shell: bash
      run: |
        kubectl -n kubeflow get pods -o wide || true
        kubectl -n kubeflow get events --sort-by=.metadata.creationTimestamp | tail -40 || true
    - name: Record candidate revision
      if: always()
      shell: bash
      run: git rev-parse HEAD > "$RUNNER_TEMP/profile-candidate-sha.txt"
    - name: Retain profile upgrade evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: profile-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/profile-candidate-sha.txt
          ${{ runner.temp }}/profile-history.json
          ${{ runner.temp }}/profile-source-runs.env
          ${{ runner.temp }}/profile-candidate-runs.env
        if-no-files-found: error
