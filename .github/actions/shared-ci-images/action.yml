name: Download shared CI images
description: Resolve exact source and producer attempt, then verify immutable image archives
inputs:
  architecture:
    description: Native image architecture
    default: amd64
  kind:
    description: Branch images, runtime dependencies, or both (images, runtime, all)
    default: images
  path:
    description: Local destination for verified archives
    required: true
  layout:
    description: Use nested directories for deploy or flat files for ARM smoke
    default: nested
  ready-state:
    description: Validated state from this workflow's shared image readiness job
    default: ''
  image-artifact-id:
    description: Same-run verified application image bundle from readiness
    default: ''
  state:
    description: Pin one producer run and attempt across runtime and branch downloads
    default: ${{ runner.temp }}/kfp-shared-images.json
outputs:
  run-id:
    description: Validated producer run ID
    value: ${{ steps.resolve.outputs.run-id }}
  run-attempt:
    description: Validated producer run attempt
    value: ${{ steps.resolve.outputs.run-attempt }}
  repository:
    description: Validated producer repository
    value: ${{ steps.resolve.outputs.repository }}
  state:
    description: Local state pinning the verified source and producer attempt
    value: ${{ inputs.state }}
  artifact-ids:
    description: Exact immutable artifact IDs consumed
    value: ${{ steps.resolve.outputs.artifact-ids }}
runs:
  using: composite
  steps:
    - name: Ensure GitHub CLI is available
      shell: bash
      run: bash .github/resources/scripts/setup-github-cli.sh
    - name: Resolve shared image producer
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE_ARCHITECTURE: ${{ inputs.architecture }}
        IMAGE_KIND: ${{ inputs.kind }}
        PRODUCER_STATE: ${{ inputs.state }}
        SHARED_IMAGE_READY_STATE: ${{ inputs.ready-state }}
      run: |
        command=resolve
        if [[ -n "$SHARED_IMAGE_READY_STATE" ]]; then
          command=import-ready
        fi
        python3 .github/resources/scripts/shared_ci_images.py "$command" \
          --architecture "$IMAGE_ARCHITECTURE" --kind "$IMAGE_KIND" \
          --state "$PRODUCER_STATE" --output "$GITHUB_OUTPUT"
    - name: Download exact shared image artifacts
      if: ${{ !inputs.image-artifact-id || inputs.kind == 'runtime' }}
      uses: ./.github/actions/download-artifact-with-retry
      with:
        artifact-ids: ${{ steps.resolve.outputs.artifact-ids }}
        repository: ${{ steps.resolve.outputs.repository }}
        run-id: ${{ steps.resolve.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}
        merge-multiple: 'true'
        required-files: ${{ steps.resolve.outputs.required-files }}
    - name: Download verified application images from this workflow run
      if: ${{ inputs.image-artifact-id && inputs.kind != 'runtime' }}
      uses: ./.github/actions/download-artifact-with-retry
      with:
        artifact-ids: ${{ inputs.image-artifact-id }}
        path: ${{ inputs.path }}
        merge-multiple: 'true'
        required-files: ${{ steps.resolve.outputs.images-required-files }}
    - name: Download runtime images from the pinned producer
      if: ${{ inputs.image-artifact-id && inputs.kind == 'all' }}
      uses: ./.github/actions/download-artifact-with-retry
      with:
        artifact-ids: ${{ steps.resolve.outputs.runtime-artifact-ids }}
        repository: ${{ steps.resolve.outputs.repository }}
        run-id: ${{ steps.resolve.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}
        merge-multiple: 'true'
        required-files: ${{ steps.resolve.outputs.runtime-required-files }}
    - name: Verify source, attempt, and archive checksums
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PRODUCER_STATE: ${{ inputs.state }}
        IMAGE_DIRECTORY: ${{ inputs.path }}
        IMAGE_LAYOUT: ${{ inputs.layout }}
        IMAGE_ARTIFACT_ID: ${{ inputs.image-artifact-id }}
        IMAGE_KIND: ${{ inputs.kind }}
      run: |
        options=()
        if [[ -n "$IMAGE_ARTIFACT_ID" ]]; then
          options+=(--require-pinned-images)
        fi
        python3 .github/resources/scripts/shared_ci_images.py verify \
          --state "$PRODUCER_STATE" --directory "$IMAGE_DIRECTORY" \
          --layout "$IMAGE_LAYOUT" --kind "$IMAGE_KIND" "${options[@]}"
