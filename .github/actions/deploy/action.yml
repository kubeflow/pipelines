name: "Set up KFP on KinD"
description: "Step to start and configure KFP on Kind"

inputs:
  tune_kubernetes_client:
    description: "Use bounded 20 QPS / 40 burst API-server Kubernetes clients in CI. Independent of profiling."
    default: 'false'
    required: false
  profile_runtime_timings:
    description: "Enable opt-in runtime timing on the initial API-server deployment."
    default: 'false'
    required: false
  cluster_name:
    description: "Kind cluster name"
    default: 'kfp'
    required: false
  pipeline_store:
    description: "Flag to deploy KFP with K8s Native API"
    default: 'database'
    required: false
  proxy:
    description: "If KFP should be deployed with proxy configuration"
    required: false
    default: 'false'
  cache_enabled:
    description: "If KFP should be deployed with cache enabled globally"
    required: false
    default: 'true'
  image_tag:
    required: true
    description: "Provide the image tag your image was tagged with"
  image_path:
    required: true
    description: "Path within github artifacts where your image tarball is stored"
  image_registry:
    required: true
    description: "Image Registry address of the images"
  multi_user:
    description: "If KFP should be deployed in multi-user mode"
    required: false
    default: 'false'
  artifact_proxy:
    description: "Enables artifact proxy"
    required: false
    default: 'false'
  argo_version:
    required: false
    description: "Argo version to use for the cluster"
  db_type:
    description: "The type of database to deploy for testing (mysql or pgx)."
    required: false
    default: ""
  forward_port:
    required: false
    default: 'true'
    description: "If you want to forward API server port to localhost:8888"
  pod_to_pod_tls_enabled:
    description: "If KFP should be deployed with TLS pod-to-pod communication."
    required: false
    default: 'false'
  load_modelcar_fixture:
    description: "Load the prebuilt Modelcar test fixture image into Kind."
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Download and import branch images as they become available
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE_PATH: ${{ inputs.image_path }}
        CLUSTER_NAME: ${{ inputs.cluster_name }}
        IMAGE_REGISTRY: ${{ inputs.image_registry }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        LOAD_MODELCAR_FIXTURE: ${{ inputs.load_modelcar_fixture }}
        RUNTIME_ARGO_VERSION: ${{ inputs.argo_version }}
        RUNTIME_DB_TYPE: ${{ inputs.db_type }}
      run: |
        ./.github/resources/scripts/wait-for-image-artifacts.sh \
          ./.github/resources/scripts/load-ready-image-artifacts.sh

    - name: Deploy Tinyproxy
      id: deploy-tinyproxy
      if: ${{ inputs.proxy == 'true' }}
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster_name }}
      run: ./.github/resources/tinyproxy/deploy-tinyproxy.sh

    - name: Configure Args
      shell: bash
      id: configure
      run: |
        ARGS=""

        if [ "${{ inputs.proxy }}" = "true" ]; then
          echo "Enabling Proxy"
          ARGS="${ARGS} --proxy"
        fi

        if [ "${{inputs.cache_enabled }}" = "false" ]; then
          echo "Disabling Cache"
          ARGS="${ARGS} --cache-disabled"
        fi

        if [ "${{inputs.pipeline_store }}" = "kubernetes" ]; then
          echo "Deploying in native K8s API Mode"
          ARGS="${ARGS} --deploy-k8s-native"
        fi

        if [ "${{ inputs.multi_user }}" = "true" ]; then
          echo "Deploying in Multi User Mode"
          ARGS="${ARGS} --multi-user"
        fi

        if [ "${{ inputs.artifact_proxy }}" = "true" ]; then
          echo "Enabling artifact proxy"
          ARGS="${ARGS} --artifact-proxy"
        fi

        if [ -n "${{ inputs.argo_version }}" ]; then
          echo "Deploying with argo version ${{ inputs.argo_version }}"
          ARGS="${ARGS} --argo-version ${{ inputs.argo_version }}"
        fi

        if [ "${{inputs.pod_to_pod_tls_enabled }}" = "true" ]; then
          ARGS="${ARGS} --tls-enabled"
        fi

        if [ -n "${{ inputs.db_type }}" ]; then
          echo "Deploying with database type ${{ inputs.db_type }}"
          ARGS="${ARGS} --db-type ${{ inputs.db_type }}"
        fi

        echo "ARGS=$ARGS" >> "$GITHUB_OUTPUT"

    - name: Deploy KFP
      id: deploy-kfp
      if: ${{ steps.configure.outcome == 'success' }}
      env:
        TUNE_KUBERNETES_CLIENT: ${{ inputs.tune_kubernetes_client }}
        PROFILE_RUNTIME_TIMINGS: ${{ inputs.profile_runtime_timings }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        max_attempts: 2
        timeout_minutes: 15
        command: ./.github/resources/scripts/deploy-kfp.sh ${{ steps.configure.outputs.ARGS }}

    - name: Forward API port
      id: forward-api-port
      shell: bash
      if: ${{ steps.deploy-kfp.outcome == 'success' && inputs.forward_port == 'true'}}
      run: ./.github/resources/scripts/forward-port.sh "kubeflow" "ml-pipeline" 8888 8888
