name: "Set up KFP on KinD"
description: "Step to start and configure KFP on Kind"

inputs:
  cluster_name:
    description: "Kind cluster name"
    default: 'kfp'
    required: false
  pipeline_store:
    description: "Flag to deploy KFP with K8s Native API"
    default: 'database'
    required: false
  proxy:
    description: "If KFP should be deployed with proxy configuration"
    required: false
    default: 'false'
  cache_enabled:
    description: "If KFP should be deployed with cache enabled globally"
    default: 'true'
    required: false
  image_tag:
    required: true
    description: "Provide the image tag your image was tagged with"
  image_path:
    required: true
    description: "Path within github artifacts where your image tarball is stored"
  image_registry:
    required: true
    description: "Image Registry address of the images"
  multi_user:
    description: "If KFP should be deployed in multi-user mode"
    required: false
    default: 'false'
  artifact_proxy:
    description: "Enables artifact proxy"
    required: false
    default: 'false'
  argo_version:
    required: false
    description: "Argo version to use for the cluster"
  forward_port:
    required: false
    default: 'true'
    description: "If you want to forward API server port to localhost:8888"
  pod_to_pod_tls_enabled:
    description: "If KFP should be deployed with TLS pod-to-pod communication."
    required: false
    default: 'false'
  load_modelcar_fixture:
    description: "Load the prebuilt Modelcar test fixture image into Kind."
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Wait for branch image artifacts
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./.github/resources/scripts/wait-for-image-artifacts.sh

    - name: Download Docker Images
      uses: ./.github/actions/download-artifact-with-retry
      with:
        path: "images_${{ github.run_id }}"
        pattern: "!*.dockerbuild"

    - name: Load Control Plane Images Into Kind
      shell: bash
      run: |
        set -euo pipefail

        source .github/resources/scripts/ci-image-artifacts.sh

        case "$(uname -m)" in
          x86_64)
            ARCH_NAME="amd64"
            ;;
          aarch64|arm64)
            ARCH_NAME="arm64"
            ;;
          *)
            echo "::error::Unsupported runner architecture: $(uname -m)"
            exit 1
            ;;
        esac

        echo "Loading ${ARCH_NAME} control-plane images into Kind"

        # The image archives contain tags ending in -${ARCH_NAME}, while the
        # CI manifests intentionally reference the local :latest tag. Load
        # each archive into Docker, retag it to the manifest tag, and then
        # import that exact tag into Kind. Loading the archive directly into
        # Kind leaves the architecture suffix on the image and causes every
        # KFP deployment to fail with ImagePullBackOff.
        for app in "${CONTROL_PLANE_IMAGE_ARTIFACTS[@]}"; do
          ARCHIVE="${{ inputs.image_path }}/${app}-${ARCH_NAME}/${app}-${ARCH_NAME}.tar"
          SOURCE_IMAGE="${{ inputs.image_registry }}/${app}:${{ inputs.image_tag }}-${ARCH_NAME}"
          TARGET_IMAGE="${{ inputs.image_registry }}/${app}:${{ inputs.image_tag }}"

          docker image load -i "${ARCHIVE}"
          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
          kind --name "${{ inputs.cluster_name }}" load docker-image "${TARGET_IMAGE}"

          rm "${ARCHIVE}"
          docker image rm "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
        done

    - name: Load Driver and Launcher Images Into Kind
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64)
            ARCH_NAME="amd64"
            ;;
          aarch64|arm64)
            ARCH_NAME="arm64"
            ;;
          *)
            echo "::error::Unsupported runner architecture: $(uname -m)"
            exit 1
            ;;
        esac

        echo "Loading ${ARCH_NAME} runtime images"

        source .github/resources/scripts/ci-image-artifacts.sh

        for app in "${RUNTIME_IMAGE_ARTIFACTS[@]}"; do
          ARCHIVE="${{ inputs.image_path }}/${app}-${ARCH_NAME}/${app}-${ARCH_NAME}.tar"
          SOURCE_IMAGE="${{ inputs.image_registry }}/${app}:${{ inputs.image_tag }}-${ARCH_NAME}"
          TARGET_IMAGE="${{ inputs.image_registry }}/${app}:ci"

          docker image load -i "${ARCHIVE}"
          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
          kind --name "${{ inputs.cluster_name }}" load docker-image "${TARGET_IMAGE}"

          rm "${ARCHIVE}"
          docker image rm "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
        done

    - name: Load Runtime Base Images Into Kind
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64)
            ARCH_NAME="amd64"
            ;;
          aarch64|arm64)
            ARCH_NAME="arm64"
            ;;
          *)
            echo "::error::Unsupported runner architecture: $(uname -m)"
            exit 1
            ;;
        esac

        RUNTIME_BASE_IMAGE_ARCHIVE="${{ inputs.image_path }}/runtime-base-images-${ARCH_NAME}/runtime-base-images-${ARCH_NAME}.tar"

        if [[ -f "${RUNTIME_BASE_IMAGE_ARCHIVE}" ]]; then
          if kind --name "${{ inputs.cluster_name }}" load image-archive "${RUNTIME_BASE_IMAGE_ARCHIVE}"; then
            rm "${RUNTIME_BASE_IMAGE_ARCHIVE}"
            exit 0
          fi

          echo "::warning::Failed to load runtime base image archive at ${RUNTIME_BASE_IMAGE_ARCHIVE}; pulling images directly."
        else
          echo "::warning::Runtime base image archive not found at ${RUNTIME_BASE_IMAGE_ARCHIVE}; pulling images directly."
        fi
        source .github/resources/scripts/helper-functions.sh
        load_runtime_base_images_into_kind .github/resources/runtime-base-images.txt "${{ inputs.cluster_name }}"

    - name: Load Modelcar Fixture Into Kind
      if: ${{ inputs.load_modelcar_fixture == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # The producer used to nest this archive as
        # runtime-base-images/modelcar.tar. It is now uploaded at the artifact
        # root so the downloaded path is images_<run>/modelcar.tar.
        MODELCAR_IMAGE_ARCHIVE="${{ inputs.image_path }}/modelcar.tar"
        if [[ ! -f "${MODELCAR_IMAGE_ARCHIVE}" ]]; then
          echo "::error::Modelcar fixture archive not found at ${MODELCAR_IMAGE_ARCHIVE}"
          exit 1
        fi

        source .github/resources/scripts/helper-functions.sh
        retry 3 10 kind --name "${{ inputs.cluster_name }}" \
          load image-archive "${MODELCAR_IMAGE_ARCHIVE}"
        rm "${MODELCAR_IMAGE_ARCHIVE}"

    - name: Deploy Tinyproxy
      id: deploy-tinyproxy
      if: ${{ inputs.proxy == 'true' }}
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster_name }}
      run: ./.github/resources/tinyproxy/deploy-tinyproxy.sh

    - name: Configure Args
      shell: bash
      id: configure
      run: |
        ARGS=""

        if [ "${{ inputs.proxy }}" = "true" ]; then
          echo "Enabling Proxy"
          ARGS="${ARGS} --proxy"
        fi

        if [ "${{inputs.cache_enabled }}" = "false" ]; then
          echo "Disabling Cache"
          ARGS="${ARGS} --cache-disabled"
        fi

        if [ "${{inputs.pipeline_store }}" = "kubernetes" ]; then
          echo "Deploying in native K8s API Mode"
          ARGS="${ARGS} --deploy-k8s-native"
        fi

        if [ "${{ inputs.multi_user }}" = "true" ]; then
          echo "Deploying in Multi User mode"
          ARGS="${ARGS} --multi-user"
        fi

        if [ "${{ inputs.artifact_proxy }}" = "true" ]; then
          echo "Enabling artifact proxy"
          ARGS="${ARGS} --artifact-proxy"
        fi

        if [ -n "${{ inputs.argo_version }}" ]; then
          echo "Deploying with argo version ${{ inputs.argo_version }}"
          ARGS="${ARGS} --argo-version ${{ inputs.argo_version }}"
        fi

        if [ "${{inputs.pod_to_pod_tls_enabled }}" = "true" ]; then
          ARGS="${ARGS} --tls-enabled"
        fi
        echo "ARGS=$ARGS" >> "$GITHUB_OUTPUT"

    - name: Deploy KFP
      id: deploy-kfp
      if: ${{ steps.configure.outcome == 'success' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        max_attempts: 2
        timeout_minutes: 15
        command: ./.github/resources/scripts/deploy-kfp.sh ${{ steps.configure.outputs.ARGS }}

    - name: Forward API port
      id: forward-api-port
      shell: bash
      if: ${{ steps.deploy-kfp.outcome == 'success' && inputs.forward_port == 'true'}}
      run: ./.github/resources/scripts/forward-port.sh "kubeflow" "ml-pipeline" 8888 8888
