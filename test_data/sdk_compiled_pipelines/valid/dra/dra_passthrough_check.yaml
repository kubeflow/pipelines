# PIPELINE DEFINITION
# Name: dra-passthrough-check
# Description: Verifies DRA ResourceClaims are forwarded through TaskConfig passthrough and applied to the task pod.
components:
  comp-verify-dra-passthrough:
    executorLabel: exec-verify-dra-passthrough
    inputDefinitions:
      parameters:
        task_config:
          isOptional: true
          parameterType: TASK_CONFIG
    taskConfigPassthroughs:
    - applyToTask: true
      field: KUBERNETES_RESOURCE_CLAIMS
deploymentSpec:
  executors:
    exec-verify-dra-passthrough:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - verify_dra_passthrough
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp>=2.16.1'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef verify_dra_passthrough(task_config: dsl.TaskConfig):\n    assert\
          \ task_config.resource_claims == [{\n        'name': 'dra-test-claim',\n\
          \        'resourceClaimTemplateName': 'dra-test-claim',\n    }]\n    print(f\"\
          resource_claims: {task_config.resource_claims}\")\n    print(\"DRA passthrough\
          \ check: PASS\")\n\n"
        image: python:3.11
pipelineInfo:
  description: Verifies DRA ResourceClaims are forwarded through TaskConfig passthrough
    and applied to the task pod.
  name: dra-passthrough-check
root:
  dag:
    tasks:
      verify-dra-passthrough:
        cachingOptions: {}
        componentRef:
          name: comp-verify-dra-passthrough
        taskInfo:
          name: verify-dra-passthrough
schemaVersion: 2.1.0
sdkVersion: kfp-2.15.2
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-verify-dra-passthrough:
          podResourceClaims:
          - resourceClaimTemplateName: dra-test-claim
