apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  annotations:
    workflows.argoproj.io/pod-name-format: v1
  generateName: pipeline-with-loops-
spec:
  arguments: {}
  entrypoint: entrypoint
  podMetadata:
    annotations:
      pipelines.kubeflow.org/v2_component: "true"
      sidecar.istio.io/inject: "false"
    labels:
      pipelines.kubeflow.org/v2_component: "true"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: pipeline-runner
  templates:
  - inputs:
      parameters:
      - name: task-name
      - name: parent-dag-task-id
      - default: "-1"
        name: iteration-index
      - default: ""
        name: kubernetes-config
    metadata: {}
    name: system-container-driver
    outputs:
      parameters:
      - name: pod-spec-patch
        valueFrom:
          default: ""
          jsonPath: $.pod-spec-patch
      - default: "false"
        name: cached-decision
        valueFrom:
          default: "false"
          jsonPath: $.cached-decision
      - name: condition
        valueFrom:
          default: "true"
          jsonPath: $.condition
    plugin:
      driver-plugin:
        args:
          cache_disabled: false
          http_proxy: ""
          https_proxy: ""
          iteration_index: '{{inputs.parameters.iteration-index}}'
          kfp_token_audience: pipelines.kubeflow.org/runs/{{workflow.uid}}
          kubernetes_config: '{{inputs.parameters.kubernetes-config}}'
          log_level: "1"
          ml_pipeline_server_address: ml-pipeline.kubeflow.svc.cluster.local
          ml_pipeline_server_port: "8887"
          ml_pipeline_tls_enabled: false
          namespace: '{{workflow.namespace}}'
          no_proxy: ""
          parent_task_id: '{{inputs.parameters.parent-dag-task-id}}'
          pipeline_name: pipeline-with-loops
          publish_logs: "true"
          run_display_name: ""
          run_id: '{{workflow.uid}}'
          run_name: '{{workflow.name}}'
          task_name: '{{inputs.parameters.task-name}}'
          type: CONTAINER
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{inputs.parameters.pod-spec-patch}}'
        name: executor
        template: system-container-impl
        when: '{{inputs.parameters.cached-decision}} != true'
    inputs:
      parameters:
      - name: pod-spec-patch
      - default: "false"
        name: cached-decision
      - default: "-1"
        name: iteration-index
    metadata: {}
    name: system-container-executor
    outputs: {}
  - container:
      command:
      - should-be-overridden-during-runtime
      env:
      - name: KFP_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: KFP_POD_UID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      envFrom:
      - configMapRef:
          name: metadata-grpc-configmap
          optional: true
      image: gcr.io/ml-pipeline/should-be-overridden-during-runtime
      name: ""
      resources: {}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
      - mountPath: /kfp-launcher
        name: kfp-launcher
      - mountPath: /var/run/secrets/kfp
        name: kfp-launcher-token
        readOnly: true
      - mountPath: /gcs
        name: gcs-scratch
      - mountPath: /s3
        name: s3-scratch
      - mountPath: /minio
        name: minio-scratch
      - mountPath: /.local
        name: dot-local-scratch
      - mountPath: /.cache
        name: dot-cache-scratch
      - mountPath: /.config
        name: dot-config-scratch
      - mountPath: /etc/kfp/launcher-config
        name: kfp-launcher-config
        readOnly: true
    initContainers:
    - args:
      - --copy
      - /kfp-launcher/launch
      command:
      - launcher-v2
      image: ghcr.io/kubeflow/kfp-launcher:latest
      name: kfp-launcher
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
      - mountPath: /kfp-launcher
        name: kfp-launcher
    inputs:
      parameters:
      - name: pod-spec-patch
    metadata:
      annotations:
        pipelines.kubeflow.org/runtime-role: launcher
        pipelines.kubeflow.org/template-name: system-container-impl
      labels:
        pipelines.kubeflow.org/pod-role: container-executor
    name: system-container-impl
    outputs: {}
    podSpecPatch: '{{inputs.parameters.pod-spec-patch}}'
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    volumes:
    - emptyDir: {}
      name: kfp-launcher
    - name: kfp-launcher-token
      projected:
        sources:
        - serviceAccountToken:
            audience: pipelines.kubeflow.org/runs/{{workflow.uid}}
            expirationSeconds: 7200
            path: token
    - emptyDir: {}
      name: gcs-scratch
    - emptyDir: {}
      name: s3-scratch
    - emptyDir: {}
      name: minio-scratch
    - emptyDir: {}
      name: dot-local-scratch
    - emptyDir: {}
      name: dot-cache-scratch
    - emptyDir: {}
      name: dot-config-scratch
    - configMap:
        name: kfp-launcher
        optional: true
      name: kfp-launcher-config
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: task-name
            value: print-text
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        name: print-text-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.print-text-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.print-text-driver.outputs.parameters.cached-decision}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        depends: print-text-driver.Succeeded
        name: print-text
        template: system-container-executor
    inputs:
      parameters:
      - name: parent-dag-task-id
      - default: "-1"
        name: iteration-index
    metadata: {}
    name: comp-for-loop-1
    outputs: {}
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: task-name
            value: print-struct
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        name: print-struct-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.print-struct-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.print-struct-driver.outputs.parameters.cached-decision}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        depends: print-struct-driver.Succeeded
        name: print-struct
        template: system-container-executor
      - arguments:
          parameters:
          - name: task-name
            value: print-text-2
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        name: print-text-2-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.print-text-2-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.print-text-2-driver.outputs.parameters.cached-decision}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        depends: print-text-2-driver.Succeeded
        name: print-text-2
        template: system-container-executor
      - arguments:
          parameters:
          - name: task-name
            value: print-text-3
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        name: print-text-3-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.print-text-3-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.print-text-3-driver.outputs.parameters.cached-decision}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        depends: print-text-3-driver.Succeeded
        name: print-text-3
        template: system-container-executor
    inputs:
      parameters:
      - name: parent-dag-task-id
      - default: "-1"
        name: iteration-index
    metadata: {}
    name: comp-for-loop-2
    outputs: {}
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: task-name
            value: print-struct-2
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        name: print-struct-2-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.print-struct-2-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.print-struct-2-driver.outputs.parameters.cached-decision}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        depends: print-struct-2-driver.Succeeded
        name: print-struct-2
        template: system-container-executor
      - arguments:
          parameters:
          - name: task-name
            value: print-text-4
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        name: print-text-4-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.print-text-4-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.print-text-4-driver.outputs.parameters.cached-decision}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        depends: print-text-4-driver.Succeeded
        name: print-text-4
        template: system-container-executor
      - arguments:
          parameters:
          - name: task-name
            value: print-text-5
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        name: print-text-5-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.print-text-5-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.print-text-5-driver.outputs.parameters.cached-decision}}'
          - name: iteration-index
            value: '{{inputs.parameters.iteration-index}}'
        depends: print-text-5-driver.Succeeded
        name: print-text-5
        template: system-container-executor
    inputs:
      parameters:
      - name: parent-dag-task-id
      - default: "-1"
        name: iteration-index
    metadata: {}
    name: comp-for-loop-4
    outputs: {}
  - inputs:
      parameters:
      - default: ""
        name: runtime-config
      - default: ""
        name: task-name
      - default: ""
        name: parent-dag-task-id
      - default: "-1"
        name: iteration-index
      - default: DAG
        name: driver-type
    metadata: {}
    name: system-dag-driver
    outputs:
      parameters:
      - name: task-id
        valueFrom:
          jsonPath: $.task-id
      - name: iteration-count
        valueFrom:
          default: "0"
          jsonPath: $.iteration-count
      - name: condition
        valueFrom:
          default: "true"
          jsonPath: $.condition
    plugin:
      driver-plugin:
        args:
          cache_disabled: false
          http_proxy: ""
          https_proxy: ""
          iteration_index: '{{inputs.parameters.iteration-index}}'
          kfp_token_audience: pipelines.kubeflow.org/runs/{{workflow.uid}}
          log_level: "1"
          ml_pipeline_server_address: ml-pipeline.kubeflow.svc.cluster.local
          ml_pipeline_server_port: "8887"
          ml_pipeline_tls_enabled: false
          namespace: '{{workflow.namespace}}'
          no_proxy: ""
          parent_task_id: '{{inputs.parameters.parent-dag-task-id}}'
          pipeline_name: pipeline-with-loops
          publish_logs: "true"
          run_display_name: ""
          run_id: '{{workflow.uid}}'
          run_name: '{{workflow.name}}'
          runtime_config: '{{inputs.parameters.runtime-config}}'
          task_name: '{{inputs.parameters.task-name}}'
          type: '{{inputs.parameters.driver-type}}'
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: task-name
            value: for-loop-1
        name: iteration-driver
        template: system-dag-driver
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{tasks.iteration-driver.outputs.parameters.task-id}}'
          - name: iteration-index
            value: '{{item}}'
        depends: iteration-driver.Succeeded
        name: iteration-iterations
        template: comp-for-loop-1
        withSequence:
          count: '{{tasks.iteration-driver.outputs.parameters.iteration-count}}'
    inputs:
      parameters:
      - name: parent-dag-task-id
    metadata: {}
    name: comp-for-loop-1-for-loop-1-iterator
    outputs: {}
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: task-name
            value: for-loop-2
        name: iteration-driver
        template: system-dag-driver
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{tasks.iteration-driver.outputs.parameters.task-id}}'
          - name: iteration-index
            value: '{{item}}'
        depends: iteration-driver.Succeeded
        name: iteration-iterations
        template: comp-for-loop-2
        withSequence:
          count: '{{tasks.iteration-driver.outputs.parameters.iteration-count}}'
    inputs:
      parameters:
      - name: parent-dag-task-id
    metadata: {}
    name: comp-for-loop-2-for-loop-2-iterator
    outputs: {}
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
          - name: task-name
            value: for-loop-4
        name: iteration-driver
        template: system-dag-driver
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{tasks.iteration-driver.outputs.parameters.task-id}}'
          - name: iteration-index
            value: '{{item}}'
        depends: iteration-driver.Succeeded
        name: iteration-iterations
        template: comp-for-loop-4
        withSequence:
          count: '{{tasks.iteration-driver.outputs.parameters.iteration-count}}'
    inputs:
      parameters:
      - name: parent-dag-task-id
    metadata: {}
    name: comp-for-loop-4-for-loop-4-iterator
    outputs: {}
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: task-name
            value: args-generator-op
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
        name: args-generator-op-driver
        template: system-container-driver
      - arguments:
          parameters:
          - name: pod-spec-patch
            value: '{{tasks.args-generator-op-driver.outputs.parameters.pod-spec-patch}}'
          - default: "false"
            name: cached-decision
            value: '{{tasks.args-generator-op-driver.outputs.parameters.cached-decision}}'
        depends: args-generator-op-driver.Succeeded
        name: args-generator-op
        template: system-container-executor
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
        name: for-loop-1
        template: comp-for-loop-1-for-loop-1-iterator
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
        depends: args-generator-op.Succeeded
        name: for-loop-2
        template: comp-for-loop-2-for-loop-2-iterator
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{inputs.parameters.parent-dag-task-id}}'
        name: for-loop-4
        template: comp-for-loop-4-for-loop-4-iterator
    inputs:
      parameters:
      - name: parent-dag-task-id
    metadata: {}
    name: root
    outputs: {}
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: runtime-config
            value: '{"parameterValues":{"loop_parameter":["a","b"]}}'
          - name: driver-type
            value: ROOT_DAG
        name: root-driver
        template: system-dag-driver
      - arguments:
          parameters:
          - name: parent-dag-task-id
            value: '{{tasks.root-driver.outputs.parameters.task-id}}'
          - name: condition
            value: ""
        depends: root-driver.Succeeded
        name: root
        template: root
    inputs: {}
    metadata: {}
    name: entrypoint
    outputs: {}
status:
  finishedAt: null
  startedAt: null
