[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kfp-kubernetes"
dynamic = ["version", "dependencies"]
description = "Kubernetes platform configuration library and generated protos."
readme = "README.md"
authors = [
    { name = "google", email = "kubeflow-pipelines@google.com" }
]
license = { text = "Apache 2.0" }
requires-python = ">=3.9.0"

[project.urls]
Documentation = "https://kfp-kubernetes.readthedocs.io/"
"Bug Tracker" = "https://github.com/kubeflow/pipelines/issues"
Source = "https://github.com/kubeflow/pipelines/tree/master/kubernetes_platform/python"

[project.optional-dependencies]
dev = [
    "docformatter==1.4",
    "isort==5.10.1",
    "mypy==0.941",
    "pre-commit==2.19.0",
    "pycln==2.1.1",
    "pytest==8.4.2; python_version < \"3.10\"",
    "pytest==9.0.3; python_version >= \"3.10\"",
    "pytest-xdist==3.8.0",
    "yapf==0.32.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["kfp.*"]

[tool.setuptools.dynamic]
version = {attr = "kfp.kubernetes.__version__"}
dependencies = {file = ["requirements.in"]}
