[project]
name = "kfp"
dynamic = ["version"]
description = "Kubeflow Pipelines SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "The Kubeflow Authors" }
]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1.8",
  "click-option-group>=0.5.7",
  "docstring-parser>=0.7.3,<1",
  "google-auth>=1.6.1,<3",
  # Generated pipeline specs import google.rpc; 1.69.2 supports protobuf 6.
  "googleapis-common-protos>=1.69.2",
  "kubernetes>=8.0.0",
  "protobuf>=6.33.5",
  "certifi",
  "python-dateutil",
  "six>=1.10",
  "PyYAML>=5.3,<7",
  "requests>=2.33.0,<3",
  "tabulate>=0.8.6,<1",
  # 2.6.0 removed HTTPResponse.getheader/getheaders used by the API client.
  "urllib3!=2.6.0",
]

[project.optional-dependencies]
all = ["kfp[kubernetes,notebooks]", "docker"]
# Compatibility extra: Kubernetes support is included in the unified SDK.
kubernetes = []
notebooks = [
  "nbclient>=0.10,<1",
  "ipykernel>=6",
  "jupyter_client>=7,<9",
]

[project.scripts]
kfp = "kfp.cli.__main__:main"
dsl-compile = "kfp.cli.compile_:main"

[project.urls]
Documentation = "https://kubeflow-pipelines.readthedocs.io/en/stable/"
"Bug Tracker" = "https://github.com/kubeflow/pipelines/issues"
Source = "https://github.com/kubeflow/pipelines/tree/master/sdk"
Changelog = "https://github.com/kubeflow/pipelines/blob/master/sdk/RELEASE.md"

[tool.hatch.version]
path = "kfp/version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["kfp", "hatch_build.py", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["kfp"]
exclude = [
  "**/*_test.py",
  "**/test_*.py",
  "**/*_tests.py",
  "**/testdata/**",
  "**/test_data/**",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
