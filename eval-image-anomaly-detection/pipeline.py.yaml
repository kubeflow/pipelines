# PIPELINE DEFINITION
# Name: image-anomaly-detection-pipeline
# Description: KFP v2 image processing, feature extraction, and anomaly detection pipeline.
# Inputs:
#    contamination: float [Default: 0.2]
#    num_images: int [Default: 20.0]
#    random_state: int [Default: 42.0]
#    target_height: int [Default: 224.0]
#    target_width: int [Default: 224.0]
components:
  comp-extract-visual-features:
    executorLabel: exec-extract-visual-features
    inputDefinitions:
      artifacts:
        raw_images_dir:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Input artifact directory holding raw image files.
      parameters:
        target_height:
          defaultValue: 224.0
          description: Standard target height for resizing.
          isOptional: true
          parameterType: NUMBER_INTEGER
        target_width:
          defaultValue: 224.0
          description: Standard target width for resizing.
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        features_dir:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-fetch-image-batch:
    executorLabel: exec-fetch-image-batch
    inputDefinitions:
      parameters:
        num_images:
          defaultValue: 20.0
          description: Total number of synthetic images to simulate in the batch.
          isOptional: true
          parameterType: NUMBER_INTEGER
        random_state:
          defaultValue: 42.0
          description: Random state seed for reproducible image generation.
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        raw_images_dir:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-train-anomaly-detector:
    executorLabel: exec-train-anomaly-detector
    inputDefinitions:
      artifacts:
        features_dir:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact directory holding the extracted feature

            CSV.'
      parameters:
        contamination:
          defaultValue: 0.2
          description: Proportion of expected outliers/anomalies in the dataset.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        random_state:
          defaultValue: 42.0
          description: Random state seed for reproducibility.
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        model_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-extract-visual-features:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - extract_visual_features
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy' 'pillow'\
          \ 'pandas'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef extract_visual_features(\n    raw_images_dir: dsl.Input[dsl.Artifact],\n\
          \    features_dir: dsl.Output[dsl.Artifact],\n    target_width: int = 224,\n\
          \    target_height: int = 224,\n):\n    \"\"\"Iterates through the raw image\
          \ paths, resizes them to standard\n    dimensions, flattens the arrays into\
          \ structural feature matrices, and\n    outputs the directory path.\n\n\
          \    Args:\n        raw_images_dir: Input artifact directory holding raw\
          \ image files.\n        features_dir: Output artifact directory for the\
          \ extracted feature\n          matrices.\n        target_width: Standard\
          \ target width for resizing.\n        target_height: Standard target height\
          \ for resizing.\n    \"\"\"\n    import os\n\n    import numpy as np\n \
          \   import pandas as pd\n    from PIL import Image\n\n    os.makedirs(features_dir.path,\
          \ exist_ok=True)\n\n    features_list = []\n    filenames = sorted([\n \
          \       f for f in os.listdir(raw_images_dir.path)\n        if f.lower().endswith(('.png',\
          \ '.jpg', '.jpeg'))\n    ])\n\n    for fname in filenames:\n        img_path\
          \ = os.path.join(raw_images_dir.path, fname)\n        with Image.open(img_path)\
          \ as img:\n            resized_img = img.resize((target_width, target_height))\n\
          \            arr = np.array(resized_img, dtype=np.float32) / 255.0\n   \
          \         flattened = arr.flatten()\n            mean_val = float(np.mean(flattened))\n\
          \            std_val = float(np.std(flattened))\n            max_val = float(np.max(flattened))\n\
          \            min_val = float(np.min(flattened))\n            # Structural\
          \ feature row: summary distribution statistics plus feature slice\n    \
          \        row = [mean_val, std_val, max_val, min_val\n                  ]\
          \ + flattened[:100].tolist()\n            features_list.append(row)\n\n\
          \    feature_matrix = pd.DataFrame(features_list)\n    features_csv = os.path.join(features_dir.path,\
          \ 'features.csv')\n    feature_matrix.to_csv(features_csv, index=False)\n\
          \    print(\n        f'Extracted feature matrix of shape {feature_matrix.shape}\
          \ saved to {features_csv}'\n    )\n\n"
        image: python:3.11
    exec-fetch-image-batch:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - fetch_image_batch
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy' 'pillow'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef fetch_image_batch(\n    raw_images_dir: dsl.Output[dsl.Artifact],\n\
          \    num_images: int = 20,\n    random_state: int = 42,\n):\n    \"\"\"\
          Simulates pulling a compressed batch of image arrays from an object\n  \
          \  store and unpacking them into a target staging path.\n\n    Args:\n \
          \       raw_images_dir: Output artifact directory representing the target\n\
          \          staging path.\n        num_images: Total number of synthetic\
          \ images to simulate in the batch.\n        random_state: Random state seed\
          \ for reproducible image generation.\n    \"\"\"\n    import io\n    import\
          \ os\n    import zipfile\n\n    import numpy as np\n    from PIL import\
          \ Image\n\n    np.random.seed(random_state)\n    os.makedirs(raw_images_dir.path,\
          \ exist_ok=True)\n\n    # Simulate pulling a compressed batch archive from\
          \ an object store\n    buffer = io.BytesIO()\n    with zipfile.ZipFile(buffer,\
          \ 'w', zipfile.ZIP_DEFLATED) as zip_file:\n        for i in range(num_images):\n\
          \            # Synthesize standard background vs structural anomaly distributions\n\
          \            if i % 5 == 0:\n                # Structural anomaly: high-contrast\
          \ distinct intensity patch\n                arr = np.random.randint(\n \
          \                   200, 256, size=(100, 100, 3), dtype=np.uint8)\n    \
          \        else:\n                # Regular background noise image array\n\
          \                arr = np.random.randint(\n                    0, 120, size=(100,\
          \ 100, 3), dtype=np.uint8)\n            img = Image.fromarray(arr)\n   \
          \         img_byte_arr = io.BytesIO()\n            img.save(img_byte_arr,\
          \ format='PNG')\n            zip_file.writestr(f'image_{i:03d}.png', img_byte_arr.getvalue())\n\
          \n    # Unpack the compressed batch into the target staging directory\n\
          \    buffer.seek(0)\n    with zipfile.ZipFile(buffer, 'r') as zip_file:\n\
          \        zip_file.extractall(raw_images_dir.path)\n\n    print(\n      \
          \  f'Successfully pulled and unpacked {num_images} images to {raw_images_dir.path}'\n\
          \    )\n\n"
        image: python:3.11
    exec-train-anomaly-detector:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_anomaly_detector
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy' 'pandas'\
          \ 'scikit-learn' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_anomaly_detector(\n    features_dir: dsl.Input[dsl.Artifact],\n\
          \    model_artifact: dsl.Output[dsl.Model],\n    metrics: dsl.Output[dsl.Metrics],\n\
          \    contamination: float = 0.2,\n    random_state: int = 42,\n):\n    \"\
          \"\"Loads the extracted features from the previous step to fit an Isolation\n\
          \    Forest or simple classifier to detect structural visual anomalies,\
          \ logging\n    the total execution time and final anomaly score.\n\n   \
          \ Args:\n        features_dir: Input artifact directory holding the extracted\
          \ feature\n          CSV.\n        model_artifact: Serialized model artifact\
          \ output.\n        metrics: Native KFP Metrics artifact output.\n      \
          \  contamination: Proportion of expected outliers/anomalies in the dataset.\n\
          \        random_state: Random state seed for reproducibility.\n    \"\"\"\
          \n    import os\n    import time\n\n    import joblib\n    import numpy\
          \ as np\n    import pandas as pd\n    from sklearn.ensemble import IsolationForest\n\
          \n    start_time = time.time()\n\n    features_csv = os.path.join(features_dir.path,\
          \ 'features.csv')\n    df = pd.read_csv(features_csv)\n\n    clf = IsolationForest(\n\
          \        contamination=contamination,\n        random_state=random_state,\n\
          \    )\n    clf.fit(df)\n\n    predictions = clf.predict(df)\n    scores\
          \ = clf.decision_function(df)\n\n    execution_time = float(time.time()\
          \ - start_time)\n    num_anomalies = int(np.sum(predictions == -1))\n  \
          \  mean_anomaly_score = float(np.mean(scores))\n\n    # Log metrics to native\
          \ KFP Metrics artifact\n    metrics.log_metric('execution_time_seconds',\
          \ execution_time)\n    metrics.log_metric('final_anomaly_score', mean_anomaly_score)\n\
          \    metrics.log_metric('anomaly_score', mean_anomaly_score)\n    metrics.log_metric('num_anomalies_detected',\
          \ num_anomalies)\n\n    os.makedirs(os.path.dirname(model_artifact.path),\
          \ exist_ok=True)\n    joblib.dump(clf, model_artifact.path)\n\n    print(f'Execution\
          \ Time: {execution_time:.4f}s')\n    print(f'Anomalies Detected: {num_anomalies}')\n\
          \    print(f'Final Anomaly Score: {mean_anomaly_score:.4f}')\n\n"
        image: python:3.11
pipelineInfo:
  description: KFP v2 image processing, feature extraction, and anomaly detection
    pipeline.
  name: image-anomaly-detection-pipeline
root:
  dag:
    tasks:
      extract-visual-features:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-extract-visual-features
        dependentTasks:
        - fetch-image-batch
        inputs:
          artifacts:
            raw_images_dir:
              taskOutputArtifact:
                outputArtifactKey: raw_images_dir
                producerTask: fetch-image-batch
          parameters:
            target_height:
              componentInputParameter: target_height
            target_width:
              componentInputParameter: target_width
        taskInfo:
          name: extract-visual-features
      fetch-image-batch:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-fetch-image-batch
        inputs:
          parameters:
            num_images:
              componentInputParameter: num_images
            random_state:
              componentInputParameter: random_state
        taskInfo:
          name: fetch-image-batch
      train-anomaly-detector:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-anomaly-detector
        dependentTasks:
        - extract-visual-features
        inputs:
          artifacts:
            features_dir:
              taskOutputArtifact:
                outputArtifactKey: features_dir
                producerTask: extract-visual-features
          parameters:
            contamination:
              componentInputParameter: contamination
            random_state:
              componentInputParameter: random_state
        taskInfo:
          name: train-anomaly-detector
  inputDefinitions:
    parameters:
      contamination:
        defaultValue: 0.2
        description: Expected outlier contamination rate for Isolation Forest.
        isOptional: true
        parameterType: NUMBER_DOUBLE
      num_images:
        defaultValue: 20.0
        description: Number of raw image arrays to simulate in the batch.
        isOptional: true
        parameterType: NUMBER_INTEGER
      random_state:
        defaultValue: 42.0
        description: Random state seed for reproducibility.
        isOptional: true
        parameterType: NUMBER_INTEGER
      target_height:
        defaultValue: 224.0
        description: Height to resize raw images to.
        isOptional: true
        parameterType: NUMBER_INTEGER
      target_width:
        defaultValue: 224.0
        description: Width to resize raw images to.
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
