# The IAM database users. These are not secret, but they are referenced through
# a Secret because that is what the base deployments read the username from.
#
# They are separate from mysql-secret so that each component authenticates as
# its own database user, which is the per-component attribution IAM buys.
apiVersion: v1
kind: Secret
metadata:
  name: kfp-db-users
stringData:
  apiserverUser: kfp_apiserver
  cacheUser: kfp_cache
