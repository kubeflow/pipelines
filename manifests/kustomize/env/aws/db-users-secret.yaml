# The IAM database user. This is not secret, but it is referenced through a
# Secret because that is what the base deployment reads the username from.
#
# It is separate from mysql-secret, whose username and password belong to the
# password-authenticated path a rollback returns to.
apiVersion: v1
kind: Secret
metadata:
  name: kfp-db-users
stringData:
  apiserverUser: kfp_apiserver
