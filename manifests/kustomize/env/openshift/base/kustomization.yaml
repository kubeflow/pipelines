apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow
labels:
  - includeSelectors: true
    pairs:
      application-crd-id: kubeflow-pipelines
resources:
  - ../../../cluster-scoped-resources
  - ../../../env/platform-agnostic
  - route.yaml

patches:
  # Disable the optional TensorBoard viewer controller on OpenShift
  - path: patches/viewer-crd.yaml
    target:
      kind: Deployment
      name: ml-pipeline-viewer-crd

  # Openshift provides its own default restricted SCC's
  # Thus the following can be omitted:

  # Remove fixed UID from init containers so OpenShift SCC can assign UIDs
  - path: patches/remove-sc-init.json
    target:
      group: apps
      kind: Deployment
      name: ml-pipeline
      version: v1
  - path: patches/remove-sc-init.json
    target:
      group: apps
      kind: Deployment
      name: ml-pipeline-persistenceagent
      version: v1
  - path: patches/remove-sc-init.json
    target:
      group: apps
      kind: Deployment
      name: ml-pipeline-scheduledworkflow
      version: v1

  - path: patches/remove-sc.json
    target:
      group: apps
      kind: Deployment
      name: minio
      version: v1
  - path: patches/remove-sc.json
    target:
      group: apps
      kind: Deployment
      name: seaweedfs
      version: v1
  - path: patches/remove-sc.json
    target:
      group: apps
      kind: Deployment
      name: ml-pipeline
      version: v1
  - path: patches/remove-sc.json
    target:
      group: apps #
      kind: Deployment
      name: ml-pipeline-persistenceagent
      version: v1
  - path: patches/remove-sc.json
    target:
      group: apps
      kind: Deployment
      name: ml-pipeline-scheduledworkflow
      version: v1
  - path: patches/remove-sc.json
    target:
      group: apps
      kind: Deployment
      name: ml-pipeline-ui
      version: v1
  - path: patches/remove-sc.json
    target:
      group: apps
      kind: Deployment
      name: ml-pipeline-viewer-crd
      version: v1
  - path: patches/remove-sc.json
    target:
      group: apps
      kind: Deployment
      name: mysql
      version: v1
  - path: patches/remove-sc.json
    target:
      group: batch
      kind: Job
      name: init-seaweedfs
      version: v1
  - path: patches/remove-sc-pod.json
    target:
      group: apps
      kind: Deployment
      name: mysql
      version: v1
  - path: patches/remove-sc-pod.json
    target:
      group: apps
      kind: Deployment
      name: minio
      version: v1
  - path: patches/remove-sc-pod.json
    target:
      group: apps
      kind: Deployment
      name: seaweedfs
      version: v1
  - path: patches/remove-sc-pod.json
    target:
      group: batch
      kind: Job
      name: init-seaweedfs
      version: v1
