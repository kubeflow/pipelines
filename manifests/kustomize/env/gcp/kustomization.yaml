apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/installs/generic
- ../../third-party/argo/installs/namespace
- cloudsql-proxy


namespace: kubeflow

patches:
- path: gcp-configurations-patch.yaml

# Used by Kustomize
configMapGenerator:
- behavior: merge
  envs:
  - params.env
  name: pipeline-install-config

# Retain this label in existing immutable workload selectors during upgrades.
# The legacy Application controller is no longer installed.
labels:
- includeSelectors: true
  pairs:
    application-crd-id: kubeflow-pipelines

replacements:
- source:
    kind: ConfigMap
    name: pipeline-install-config
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: ConfigMap
      name: workflow-controller-configmap
    fieldPaths:
    - data.artifactRepository
    options:
      delimiter: .
      index: 1

- source:
    kind: ConfigMap
    name: pipeline-install-config
    fieldPath: data.bucketName
  targets:
  - select:
      kind: ConfigMap
      name: workflow-controller-configmap
    fieldPaths:
    - data.artifactRepository
    options:
      delimiter: '"'
      index: 3
