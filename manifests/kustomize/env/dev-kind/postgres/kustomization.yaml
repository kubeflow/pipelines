apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../platform-agnostic-postgresql
  - ./default-allow-same-namespace-networkpolicy.yaml

namespace: kubeflow

patches:
  # UI NodePort
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ml-pipeline-ui
        namespace: kubeflow
      spec:
        ports:
          - $patch: replace
          - name: http
            port: 80
            protocol: TCP
            targetPort: 3000
            nodePort: 30300
        type: NodePort
  # PostgreSQL NodePort
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30432
    target:
      kind: Service
      name: postgres-service
  # MinIO NodePort
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs
        namespace: kubeflow
      spec:
        ports:
          - $patch: replace
          - port: 9000
            protocol: TCP
            targetPort: 8333
            nodePort: 30900
        type: NodePort
  # ml-pipeline deployment - set replicas to 0 (run locally)
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-pipeline
        namespace: kubeflow
      spec:
        replicas: 0
  # ml-pipeline service - configure for external endpoint
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ml-pipeline
        namespace: kubeflow
      spec:
        clusterIP: None
        ports:
        - $patch: replace
        - name: http
          port: 8888
          protocol: TCP
          targetPort: 8888
        - name: grpc
          port: 8887
          protocol: TCP
          targetPort: 8887
        - name: webhook
          port: 8443
          protocol: TCP
          targetPort: 8443
        selector:
          $patch: delete
  # ml-pipeline-ui environment variables
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-pipeline-ui
        namespace: kubeflow
      spec:
        template:
          spec:
            containers:
              - name: ml-pipeline-ui
                env:
                  - name: ML_PIPELINE_SERVICE_HOST
                    value: ml-pipeline
                  - name: ML_PIPELINE_SERVICE_PORT
                    value: "8888"
                  - name: DISABLE_GKE_METADATA
                    value: "true"
  # SeaweedFS NetworkPolicy
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: seaweedfs
        namespace: kubeflow
      spec:
        ingress:
        - from:
          - namespaceSelector:
              matchExpressions:
              - key: app.kubernetes.io/part-of
                operator: In
                values:
                - kubeflow-profile
          ports:
          - port: 8333
        - from:
          - namespaceSelector:
              matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                - istio-system
        - from:
          - ipBlock:
              cidr: 0.0.0.0/0
          ports:
          - port: 8333
        podSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - seaweedfs
        policyTypes:
        - Ingress
  # PostgreSQL sslmode: the base platform-agnostic-postgresql overlay intentionally
  # leaves sslmode unset so that CreatePostgreSQLConfig fails fast (secure-by-default).
  # Local development explicitly opts into sslmode=disable here.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-pipeline
        namespace: kubeflow
      spec:
        template:
          spec:
            containers:
              - name: ml-pipeline-api-server
                env:
                  - name: DBCONFIG_POSTGRESQLCONFIG_EXTRAPARAMS
                    value: '{"sslmode":"disable"}'
                    valueFrom: null
images:
  - name: ghcr.io/kubeflow/kfp-api-server
    newTag: master
