apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Multi-user + PostgreSQL configuration.
# See ../platform-agnostic-postgresql/README.md for the required explicit
# PostgreSQL sslmode configuration.
resources:
  - ../../third-party/metacontroller/base
  - ../../base/installs/multi-user
  - ../../base/metadata/base
  - ../../base/metadata/options/istio
  - ../../third-party/argo/installs/cluster
  - ../../third-party/postgresql/base
  - ../../third-party/postgresql/options/istio
  - ../../third-party/seaweedfs/istio

patches:
  - path: apiserver-patch.yaml
  - path: cache-server-patch.yaml
  - path: mlmd-patch.yaml

configMapGenerator:
  - name: pipeline-install-config
    behavior: merge
    literals:
      - DBDriverName=pgx
      - pipelineDb=mlpipeline
      - cacheDb=cachedb
      - postgresHost=postgres-service
      - postgresPort=5432
      # Operators must explicitly set this in their overlay. Leaving it empty
      # makes the API and cache servers fail closed rather than using plaintext.
      - postgresExtraParams=
      - BLOCK_V1_PIPELINES=false
      - V1_ALLOWED_NAMESPACES=

# !!! If you want to customize the namespace,
# please also update base/cache-deployer/cluster-scoped/cache-deployer-clusterrolebinding.yaml
namespace: kubeflow

# Identifier for application manager to apply ownerReference.
# The ownerReference ensures the resources get garbage collected
# when application is deleted.
labels:
  - includeSelectors: true
    pairs:
      application-crd-id: kubeflow-pipelines

replacements:
  - source:
      kind: ConfigMap
      name: pipeline-install-config
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ConfigMap
          name: workflow-controller-configmap
        fieldPaths:
          - data.artifactRepository
        options:
          delimiter: .
          index: 1

  - source:
      kind: ConfigMap
      name: pipeline-install-config
      fieldPath: data.bucketName
    targets:
      - select:
          kind: ConfigMap
          name: workflow-controller-configmap
        fieldPaths:
          - data.artifactRepository
        options:
          delimiter: '"'
          index: 3
