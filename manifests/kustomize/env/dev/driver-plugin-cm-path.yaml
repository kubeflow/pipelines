apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-pipeline-driver-agent
data:
  sidecar.container: |
    name: driver-plugin
    image: ghcr.io/kubeflow/kfp-driver:master
    env:
      - name: KFP_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: LOG_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: mlpipeline-minio-artifact
            key: accesskey
      - name: LOG_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: mlpipeline-minio-artifact
            key: secretkey
    ports:
      - containerPort: 8080
    resources:
      requests:
        cpu: "0.1"
        memory: "64Mi"
      limits:
        cpu: "0.5"
        memory: 0.5Gi
    securityContext:
      # Match Argo's agent init UID to read the shared authentication token.
      runAsNonRoot: true
      runAsUser: 8737
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: var-run-argo
      mountPath: /kfp/log
      readOnly: false
