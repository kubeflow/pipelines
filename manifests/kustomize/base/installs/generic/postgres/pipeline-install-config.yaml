apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-install-config
data:
  warning: |
    1. Do not use kubectl to edit this configmap, because some values are used
    during kustomize build. Instead, change the configmap and apply the entire
    kustomize manifests again.
    2. After updating the configmap, some deployments may need to be restarted
    until the changes take effect. A quick way to restart all deployments in a
    namespace: `kubectl rollout restart deployment -n <your-namespace>`.
  appName: pipeline
  appVersion: 2.0.0
  dbType: postgres
  postgresHost: postgres
  postgresPort: "5432"
  mlmdDb: metadb
  cacheDb: cachedb
  pipelineDb: mlpipeline
  bucketName: mlpipeline
  ## defaultPipelineRoot: Optional. Default pipeline root in v2 compatible mode.
  ## https://www.kubeflow.org/docs/components/pipelines/sdk/v2/v2-compatibility/
  ##
  ## If the field is not set, kfp-launcher configmaps won't be created and
  ## v2 compatible mode defaults to minio://mlpipeline/v2/artifacts as pipeline
  ## root.
  ##
  ## When not in Kubeflow Pipelines multi-user mode, the config works as you
  ## would normally expect.
  ##
  ## In Kubeflow Pipelines multi-user mode, the config creates default
  ## kfp-launcher configmaps in each user's namespace. Users can edit the
  ## kfp-launcher configmap's defaultPipelineRoot field afterwards to configure
  ## namespace-specific default pipeline root. The namespace specific changes in
  ## kfp-launcher configmap won't be overridden by pipeline-install-config.
  ##
  ## Caveat: when you update the config from a non-empty value, only new
  ## namespaces get the updated config by default. Owners of existing namespaces
  ## must delete the kfp-launcher configmap to get the new default config value.
  ##
  ## Examples:
  ## defaultPipelineRoot: minio://mlpipeline/v2/artifacts
  ## defaultPipelineRoot: gs://your-bucket/path/to/artifacts
  ## defaultPipelineRoot: s3://your-bucket/path/to/artifacts
  ##
  ## V2 Compatible Mode Feature stage:
  ## [Beta](https://github.com/kubeflow/pipelines/blob/master/docs/release/feature-stages.md#beta)
  defaultPipelineRoot: ""
  ## autoUpdatePipelineDefaultVersion: States if the pipeline version
  ## should be updated by defult for a versioned pipeline or not when a new
  ## version is uploaded. This sets the deployment wide definition.
  autoUpdatePipelineDefaultVersion: "true"
  ## cronScheduleTimezone: States the timezone which should be used for
  ## the cron scheduler. If not specified the local timezone of the
  ## cluster will be used. Valid values are UTC, Local or values according to
  ## the IANA Time Zone database, such as "America/New_York" and "Asia/Shanghai".
  ## Feature stage:
  ## [Alpha](https://github.com/kubeflow/pipelines/blob/master/docs/release/feature-stages.md#alpha)
  cronScheduleTimezone: "UTC"
  ## cacheImage is the image that the mutating webhook will use to patch
  ## cached steps with. Will be used to echo a message announcing that
  ## the cached step result will be used. If not set it will default to
  ## 'ghcr.io/containerd/busybox'
  cacheImage: "ghcr.io/containerd/busybox"
  ## cacheNodeRestrictions the dummy container runing if output is cached
  ## will run with the same affinity and node selector as the default pipeline
  ## step. This is defaulted to 'false' to allow the pod to be scheduled on
  ## any node and avoid defaulting to specific nodes. Allowed values are:
  ## 'false' and 'true'.
  cacheNodeRestrictions: "false"
  ## MAXIMUM_CACHE_STALENESS configures caching according to
  ## https://www.kubeflow.org/docs/components/pipelines/overview/caching/ and
  ## https://www.kubeflow.org/docs/components/pipelines/overview/caching-v2/.
  ## Larger than MAXIMUM_CACHE_STALENESS per pipeline user set values are
  ## reduced to MAXIMUM_CACHE_STALENESS.
  ## The administrator of the storage backend can rely on it to delete old cache
  ## artifacts.
  MAXIMUM_CACHE_STALENESS: ""
  ## MAXIMUM_CACHE_STALENESS: "P30D"
  ## DEFAULT_CACHE_STALENESS configures caching according to
  ## https://www.kubeflow.org/docs/components/pipelines/overview/caching/ and
  ## https://www.kubeflow.org/docs/components/pipelines/overview/caching-v2/.
  ## This value is used if the user did not set a value in the pipeline.
  DEFAULT_CACHE_STALENESS: ""
  ## DEFAULT_CACHE_STALENESS: "P7D"
  ## CACHE_RESOLVE_IMAGE_DIGEST controls whether the API server asks the container
  ## driver to resolve mutable image tags to content digests when computing v2
  ## cache fingerprints. Default "false" preserves historical behavior (image
  ## reference string as-is). Set to "true" to enable.
  ## When enabled, resolution failures (network, auth, unsupported registry)
  ## fall back to the original image reference so the run continues; mutable-tag
  ## cache hits remain possible in that fail-open path. Enabling this flag also
  ## normalizes resolved refs (e.g. ubuntu:22.04 -> docker.io/library/ubuntu@sha256:...),
  ## which invalidates previously written cache entries that used the tag string.
  CACHE_RESOLVE_IMAGE_DIGEST: "false"
  ## CACHE_IMAGE_DIGEST_DOCKER_CONFIG_SECRET is an optional Secret name of type
  ## kubernetes.io/dockerconfigjson. When set (and CACHE_RESOLVE_IMAGE_DIGEST is
  ## true), the Secret is mounted into container-driver pods for private
  ## registry authentication during digest resolution.
  CACHE_IMAGE_DIGEST_DOCKER_CONFIG_SECRET: ""
  ## CACHE_IMAGE_DIGEST_DOCKERHUB_REGISTRY_HOST overrides the registry API host
  ## used for short-name Docker Hub images (e.g. ubuntu:22.04). Default empty
  ## uses registry-1.docker.io. Token realm/service come from WWW-Authenticate.
  CACHE_IMAGE_DIGEST_DOCKERHUB_REGISTRY_HOST: ""
  ## CACHE_IMAGE_DIGEST_INSECURE_REGISTRIES is a comma-separated list of registry
  ## hosts that should use HTTP (not HTTPS) for digest resolution.
  CACHE_IMAGE_DIGEST_INSECURE_REGISTRIES: ""
  ## ConMaxLifeTime will set the connection max lifetime for MySQL
  ## this is very important to setup when using external databases.
  ## See this issue for more details: https://github.com/kubeflow/pipelines/issues/5329
  ## Note: this value should be a string that can be parsed by `time.ParseDuration`.
  ## If this value doesn't include a unit abbreviation, the units will be assumed
  ## to be nanoseconds.
  ConMaxLifeTime: "120s"
  LOG_LEVEL: "info"
  ## ARTIFACTS_PROXY_ENABLED: Controls whether the artifact proxy is enabled
  ## to support accessing out-of-kubeflow scope buckets. The artifact proxy
  ## has known security and architectural flaws, so it should only be enabled
  ## if you specifically need to access unique pipeline root buckets per
  ## namespace that are outside the kubeflow namespace's access.
  ## Valid values are 'true' and 'false'. Defaults to 'false'.
  ## For more information see: https://github.com/kubeflow/pipelines/issues/11987
  ARTIFACTS_PROXY_ENABLED: "false"
  ## Default security context for customer workload containers.
  ## Leave empty to disable (default). When set, SDK-specified values
  ## for the corresponding field are ignored.
  ## Does NOT affect executor, driver, or sidecar containers.
  defaultSecurityContextRunAsUser: ""
  defaultSecurityContextRunAsGroup: ""
  defaultSecurityContextRunAsNonRoot: ""
  ## Default pod-level setting (PodSpec.hostUsers) controlling Linux user
  ## namespace isolation for customer workloads. When "false", UID 0 inside
  ## the pod maps to an unprivileged host UID. Set "" to disable.
  defaultSecurityContextHostUsers: "false"
  ## BLOCK_V1_PIPELINES: Controls whether v1 pipelines are allowed to be created and run.
  ## Valid values are 'true' and 'false'. Defaults to 'false'.
  BLOCK_V1_PIPELINES: "false"
  ## V1_ALLOWED_NAMESPACES: Comma-separated list of namespaces that are allowed to use v1 pipelines
  ## when BLOCK_V1_PIPELINES is set to true. This is only evaluated if BLOCK_V1_PIPELINES is set to true.
  V1_ALLOWED_NAMESPACES: ""
  ## USERID_HEADER and USERID_PREFIX define the multi-user identity contract shared
  ## by the API server, the UI, and the scheduled-workflow controller. They are only
  ## consumed by the multi-user overlay; in single-user installs they are ignored.
  ## USERID_HEADER is the HTTP header carrying the authenticated user's identity and
  ## must match what the auth proxy (e.g. Istio/oidc-authservice) injects.
  ## USERID_PREFIX is stripped from the header value before it is used as the user id.
  USERID_HEADER: "kubeflow-userid"
  USERID_PREFIX: ""
  ## Custom labels and annotations for driver pods (JSON format).
  ## Useful for enabling Istio sidecar injection or other infrastructure integration.
  ## Every value must be a JSON string, for example "true" rather than true.
  ## Keys with the prefix "pipelines.kubeflow.org/" are reserved and will be filtered out.
  ## Example: '{"sidecar.istio.io/inject":"true"}'
  DRIVER_POD_LABELS: ""
  DRIVER_POD_ANNOTATIONS: ""
