apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ml-pipeline
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - delete
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - kubeflow.org
  resources:
  - scheduledworkflows
  verbs:
  - create
  - get
  - list
  - update
  - patch
  - delete
- apiGroups:
  - kubeflow.org
  resources:
  - scheduledworkflows/finalizers
  verbs:
  - update
- apiGroups:
  - pipelines.kubeflow.org
  resources:
  - pipelines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - kfp-launcher
  - workflow-controller-configmap
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - kfp-mlflow-credentials
  verbs:
  - get
# Argo nodeStatusOffLoad upgrade checklist (API server):
# 1. Read Secret names from workflow-controller-configmap
#    persistence.{postgresql,mysql}.{userNameSecret,passwordSecret} (do not
#    hard-code names here; grant get in a site overlay).
# 2. Ensure those Secrets are in the same namespace the API server reads for
#    persistence credentials (usually the workflow-controller ConfigMap
#    namespace, unless overridden).
# 3. Allow network from ml-pipeline-apiserver to the offload DB used by Argo.
# 4. Before enabling offload cleanup / relying on hydrate-on-finalize: confirm
#    logs show "Argo offload hydrator initialized", or dry-run hydrate a known
#    offloaded Workflow. Terminal reports fail closed without hydration rather
#    than persisting a bare offload pointer.
# See manifests/kustomize/README.md#argo-nodestatusoffload-api-server.
