apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeflow-pipelines-profile-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeflow-pipelines-profile-webhook-auth-init
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [kubeflow-pipelines-profile-webhook-auth]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeflow-pipelines-profile-webhook-auth-init
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeflow-pipelines-profile-webhook-auth-init
subjects:
- kind: ServiceAccount
  name: kubeflow-pipelines-profile-controller
