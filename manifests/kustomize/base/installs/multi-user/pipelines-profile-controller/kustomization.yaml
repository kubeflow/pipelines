apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow
configurations:
- configuration.yaml
resources:
- service.yaml
- deployment.yaml
- decorator-controller.yaml
- networkpolicy.yaml
- webhook-auth-secret.yaml
- webhook-auth-rbac.yaml
configMapGenerator:
- files:
  - sync.py
  - init_webhook_auth.py
  name: kubeflow-pipelines-profile-controller-code
- envs:
  - params.env
  name: kubeflow-pipelines-profile-controller-env
labels:
- includeSelectors: true
  pairs:
    app: kubeflow-pipelines-profile-controller
