apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-envoy-deployment
  labels:
    component: metadata-envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      component: metadata-envoy
  template:
    metadata:
      labels:
        component: metadata-envoy
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: container
        image: ghcr.io/kubeflow/kfp-metadata-envoy:dummy
        args:  [  "/etc/envoy/envoy-config.yaml" ]
        ports:
        - name: md-envoy
          containerPort: 9090
        - name: envoy-admin
          containerPort: 9901
        # Readiness: Envoy's /ready returns 200 only while it is LIVE (503 while
        # initializing or draining). Liveness: /server_info returns 200 in every
        # state, including draining, and stops answering if Envoy is frozen.
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-admin
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /server_info
            port: envoy-admin
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: envoy-config
            mountPath: /etc/envoy
      volumes:
        - name: envoy-config
          configMap:
            name: metadata-envoy-configmap
