apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ml-pipeline-ui
  name: ml-pipeline-ui
spec:
  selector:
    matchLabels:
      app: ml-pipeline-ui
  template:
    metadata:
      labels:
        app: ml-pipeline-ui
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config-volume
        configMap:
          name: ml-pipeline-ui-configmap
      containers:
      - image: ghcr.io/kubeflow/kfp-frontend:dummy
        imagePullPolicy: IfNotPresent
        name: ml-pipeline-ui
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: VIEWER_TENSORBOARD_POD_TEMPLATE_SPEC_PATH
            value: /etc/config/viewer-pod-template.json
          - name: MINIO_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: mlpipeline-minio-artifact
                key: accesskey
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: mlpipeline-minio-artifact
                key: secretkey
          - name: ALLOW_CUSTOM_VISUALIZATIONS
            value: "true"
          - name: FRONTEND_SERVER_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: ARGO_ARCHIVE_LOGS
            value: "true"
          - name: DISABLE_GKE_METADATA
            value: "true"
          # Namespace-ownership resolution for objects the artifact database does not track.
          # The default "artifact-then-prefix" checks the
          # "private-artifacts/<namespace>/" object-key prefix after an Artifact API miss.
          # The legacy "mlmd-then-prefix" alias remains supported. Use "artifact-only" for
          # strict Artifact API validation; the legacy "mlmd-only" value is also supported.
          - name: ARTIFACT_NAMESPACE_OWNERSHIP_MODE
            valueFrom:
              configMapKeyRef:
                name: pipeline-install-config
                key: ARTIFACT_NAMESPACE_OWNERSHIP_MODE
                optional: true
          # Leading object-key segment used to derive ownership for objects that the artifact
          # database does not track, such as archived logs. Override only when a customized
          # Argo keyFormat / pipeline root changes the "<prefix>/<namespace>/" convention.
          - name: ARTIFACT_NAMESPACE_KEY_PREFIX
            valueFrom:
              configMapKeyRef:
                name: pipeline-install-config
                key: ARTIFACT_NAMESPACE_KEY_PREFIX
                optional: true
          - name: CLUSTER_DOMAIN
            valueFrom:
              configMapKeyRef:
                name: pipeline-install-config
                key: CLUSTER_DOMAIN
                optional: true
          - name: ARTIFACTS_SERVICE_PROXY_ENABLED
            valueFrom:
              configMapKeyRef:
                name: pipeline-install-config
                key: ARTIFACTS_PROXY_ENABLED
                optional: true
        readinessProbe:
          httpGet:
            path: /apis/v1beta1/healthz
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /apis/v1beta1/healthz
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 70Mi
      serviceAccountName: ml-pipeline-ui
