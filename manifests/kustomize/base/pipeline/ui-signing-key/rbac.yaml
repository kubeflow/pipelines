apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-pipeline-ui-signing-key-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-pipeline-ui-signing-key-init
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ml-pipeline-ui-tensorboard-proxy]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-pipeline-ui-signing-key-init
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-pipeline-ui-signing-key-init
subjects:
  - kind: ServiceAccount
    name: ml-pipeline-ui-signing-key-init
