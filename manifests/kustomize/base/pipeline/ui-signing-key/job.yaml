apiVersion: batch/v1
kind: Job
metadata:
  # The generated ConfigMap hash also names the Job, allowing image/template upgrades.
  name: ml-pipeline-ui-signing-key-init
spec:
  backoffLimit: 3
  # No activeDeadlineSeconds: a Job deadline also counts image pull time, so a
  # slow pull would fail the Job before the initializer starts and leave the UI
  # waiting for the Secret field indefinitely. Retries stay bounded by
  # backoffLimit and the initializer's own retry loop.
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ml-pipeline-ui-signing-key-init
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: ghcr.io/kubeflow/kfp-frontend:dummy
          imagePullPolicy: IfNotPresent
          workingDir: /server
          command: [node, dist/initialize-tensorboard-signing-key.js]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SIGNING_SECRET_NAME
              valueFrom:
                configMapKeyRef:
                  name: ml-pipeline-ui-signing-key-init
                  key: secretName
            - name: SIGNING_SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: ml-pipeline-ui-signing-key-init
                  key: secretKey
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
