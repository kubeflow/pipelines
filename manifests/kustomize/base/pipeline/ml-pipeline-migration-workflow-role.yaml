apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ml-pipeline-migration-workflow-reader
rules:
- apiGroups: [argoproj.io]
  resources: [workflows]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ml-pipeline-migration-workflow-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ml-pipeline-migration-workflow-reader
subjects:
- kind: ServiceAccount
  name: ml-pipeline
  namespace: kubeflow
