apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow

resources:
- seaweedfs-deployment.yaml
- seaweedfs-pvc.yaml
- seaweedfs-networkpolicy.yaml
- seaweedfs-service.yaml
- seaweedfs-service-account.yaml
- admin-credentials.yaml

configMapGenerator:
- name: seaweedfs-credential-rotation
  files:
  - rotate-admin-credentials.py
- name: seaweedfs-s3-auth
  literals:
  - 's3-auth.json={"identities":[]}'
