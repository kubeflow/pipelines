apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: kubeflow
  labels:
    app: seaweedfs
spec:
  selector:
    matchLabels:
      app: seaweedfs
  strategy:
    type: Recreate
  # Single container setup not scalable
  replicas: 1
  template:
    metadata:
      labels:
        app: seaweedfs
        application-crd-id: kubeflow-pipelines
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      automountServiceAccountToken: false
      initContainers:
      - name: prepare-storage-credentials
        image: ghcr.io/kubeflow/kfp-api-server:dummy
        command: ["/bin/credential-rotation", "--mode=bootstrap"]
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: bootstrap-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      containers:
      - name: seaweedfs
        # Explicit required keys prevent starting against an empty bootstrap Secret.
        env:
        - name: accesskey
          valueFrom:
            secretKeyRef:
              name: seaweedfs-admin-credentials
              key: accesskey
        - name: secretkey
          valueFrom:
            secretKeyRef:
              name: seaweedfs-admin-credentials
              key: secretkey
        # The separate IAM listener does not read -s3.config. Bootstrap both
        # listeners with authentication before dynamic identities are registered.
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: seaweedfs-admin-credentials
              key: accesskey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: seaweedfs-admin-credentials
              key: secretkey
        image: ghcr.io/chrislusf/seaweedfs:4.50
        args:
        - "server"
        - "-dir=/data"
        - "-s3"
        # An explicit empty static configuration enables authentication before
        # postStart registers the dynamic identity, without masking tenant IAM.
        - "-s3.config=/etc/seaweedfs-auth/s3-auth.json"
        - "-iam"
        - "-filer"
        - "-master.volumePreallocate=false"
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Wait up to 120 seconds  for SeaweedFS master to be ready
                for i in $(seq 1 60); do
                  if wget -q --spider http://127.0.0.1:8333/status; then
                    break
                  fi
                  if [ "$i" -eq 60 ]; then
                    echo "ERROR: SeaweedFS master did not become ready within 120 seconds"
                    exit 1
                  fi
                  sleep 2
                done

                # Create bucket with retries (maximum 25 seconds)
                for attempt in $(seq 1 5); do
                  if bucket_listing=$(echo "s3.bucket.list" | /usr/bin/weed shell 2>/dev/null); then
                    if printf '%s\n' "$bucket_listing" | grep -Eq '^[[:space:]]*mlpipeline[[:space:]]'; then
                      break
                    fi
                    if echo "s3.bucket.create --name mlpipeline" | /usr/bin/weed shell >/dev/null 2>&1 &&
                      bucket_listing=$(echo "s3.bucket.list" | /usr/bin/weed shell 2>/dev/null) &&
                      printf '%s\n' "$bucket_listing" | grep -Eq '^[[:space:]]*mlpipeline[[:space:]]'; then
                      break
                    fi
                  fi
                  if [ "$attempt" -eq 5 ]; then
                    echo "ERROR: Could not verify or create mlpipeline bucket after 5 attempts"
                    exit 1
                  fi
                  sleep 5
                done

                # Configure admin user with retries (25s max)
                for i in $(seq 1 5); do
                  if echo "s3.configure -user kubeflow-admin -access_key $accesskey -secret_key $secretkey -actions Admin -apply" | /usr/bin/weed shell >/dev/null 2>&1; then
                    break
                  fi
                  if [ "$i" -eq 5 ]; then
                    echo "ERROR: Failed to configure kubeflow-admin after 5 attempts"
                    exit 1
                  fi
                  sleep 5
                done

                # Verify bucket is accessible
                if ! echo "s3.bucket.list" | /usr/bin/weed shell | grep -q mlpipeline; then
                  echo "ERROR: mlpipeline bucket verification failed"
                  exit 1
                fi

                # Signal successful initialization for the startup probe
                touch /tmp/initialization-complete
        ports:
        - containerPort: 8333
        - containerPort: 8111
        - containerPort: 9333
        - containerPort: 19333
        - containerPort: 8888
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -f /tmp/initialization-complete && echo "s3.bucket.list" | /usr/bin/weed shell | grep -q mlpipeline
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 24
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /status
            port: 8333
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /status
            port: 8333
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        securityContext: # Using restricted profile
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          # image defaults to root user
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/seaweedfs-auth
          name: s3-auth
          readOnly: true
        - mountPath: /data
          name: data
        resources:
          requests:
            cpu: 64m
            memory: 256Mi
      volumes:
      # Only the short init process receives an API token; the storage server
      # does not receive the bootstrap Role's permission to create Jobs.
      - name: bootstrap-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: s3-auth
        configMap:
          name: seaweedfs-s3-auth
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-pvc
      serviceAccountName: seaweedfs
