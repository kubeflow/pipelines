# Runtime-owned data: never populate this manifest with credentials. Preserve
# this Secret across upgrades, including GitOps prune/recreate operations.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-admin-credentials
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-credential-rotation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-credential-rotation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["seaweedfs-admin-credentials", "mlpipeline-minio-artifact"]
  verbs: ["get", "patch"]
# Kubernetes cannot scope create by resourceNames. This is needed only for the
# legacy Secret on new installations; the controller creates no tenant Secrets.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["seaweedfs", "ml-pipeline", "ml-pipeline-ui", "kubeflow-pipelines-profile-controller"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["seaweedfs", "ml-pipeline", "ml-pipeline-ui", "kubeflow-pipelines-profile-controller"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-credential-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seaweedfs-credential-rotation
subjects:
- kind: ServiceAccount
  name: seaweedfs-credential-rotation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-credential-rotation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs-credential-rotation
  template:
    metadata:
      labels:
        app: seaweedfs-credential-rotation
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: seaweedfs-credential-rotation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reconcile
        image: docker.io/alpine/k8s:1.37.1
        command: ["python", "/controller/rotate-admin-credentials.py"]
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/credentials-ready"]
          periodSeconds: 10
        volumeMounts:
        - name: controller
          mountPath: /controller
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: controller
        configMap:
          name: seaweedfs-credential-rotation
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
