# Runtime-owned data: never populate this manifest with credentials. Preserve
# this Secret across upgrades, including GitOps prune/recreate operations.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-admin-credentials
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-credential-rotation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-credential-rotation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["seaweedfs-admin-credentials", "mlpipeline-minio-artifact"]
  verbs: ["get", "patch"]
# Kubernetes cannot scope create by resourceNames. This is needed only for the
# legacy Secret on new installations; the controller creates no tenant Secrets.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["seaweedfs", "ml-pipeline", "ml-pipeline-ui", "kubeflow-pipelines-profile-controller"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["seaweedfs", "ml-pipeline", "ml-pipeline-ui", "kubeflow-pipelines-profile-controller"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-credential-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seaweedfs-credential-rotation
subjects:
- kind: ServiceAccount
  name: seaweedfs-credential-rotation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-credential-bootstrap
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["seaweedfs-admin-credentials", "mlpipeline-minio-artifact"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
# Reads its own Pod to use the actual image selected by the installation overlay.
# The init process creates a revision-named Job and replaces obsolete immutable
# Job templates with foreground deletion. Kubernetes cannot restrict create by
# name; only the init container mounts a token for this Role.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-credential-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seaweedfs-credential-bootstrap
subjects:
- kind: ServiceAccount
  name: seaweedfs
