apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow

resources:
- seaweedfs/

# The binary is published in the existing API image. Release stamping replaces
# this branch tag with the containing release, not an older image without it.
images:
- name: ghcr.io/kubeflow/kfp-api-server
  newTag: master
