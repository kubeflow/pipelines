apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: metacontroller
  name: metacontroller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metacontroller
  serviceName: ""
  template:
    metadata:
      labels:
        app: metacontroller
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          command: ["/usr/bin/metacontroller"]
          args:
          - --zap-log-level=4
          - --discovery-interval=3600s
          livenessProbe:
            httpGet:
              port: 8081
              path: /healthz
          readinessProbe:
            httpGet:
              port: 8081
              path: /readyz
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            privileged: false
            allowPrivilegeEscalation: false
          name: metacontroller
          image: 'ghcr.io/metacontroller/metacontroller:v4.17.9@sha256:9c33122e55a130852b6c5f79755f9552eac2f7d42930fc3b228ba3be2e2545e6'
      serviceAccountName: meta-controller-service
  # Workaround for https://github.com/kubernetes-sigs/kustomize/issues/677
  volumeClaimTemplates: []
