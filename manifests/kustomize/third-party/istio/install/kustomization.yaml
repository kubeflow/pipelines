apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep the 1.31 manifest API/RBAC surface while taking the compatible image patch.
resources:
- https://github.com/kubeflow/community-distribution/common/istio/istio-install/base?ref=5f0edd216742560ba205775e17b6b522cee53ae2

images:
- name: docker.io/istio/install-cni
  newTag: 1.31.4-distroless
- name: docker.io/istio/pilot
  newTag: 1.31.4-distroless
- name: docker.io/istio/proxyv2
  newTag: 1.31.4-distroless

configMapGenerator:
- name: istio-sidecar-injector
  namespace: istio-system
  behavior: merge
  files:
  - values=injector-values.json

generatorOptions:
  disableNameSuffixHash: true

patches:
- target:
    version: v1
    kind: ConfigMap
    name: istio-cni-config
    namespace: kube-system
  patch: |-
    - op: replace
      path: /data/CURRENT_AGENT_VERSION
      value: 1.31.4
