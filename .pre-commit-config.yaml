repos:
  - repo: local
    hooks:
      - id: docformatter
        name: docformatter
        entry: uv run --frozen --extra lint docformatter --in-place
        language: system
        types: [python]
        exclude: _pb2\.py$
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --extra lint ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --extra lint ruff format
        language: system
        types: [python]
      - id: native-cleanup
        name: retired execution stack stays removed
        entry: uv run --frozen --extra test python -m pytest -q test/native_cleanup_test.py
        language: system
        pass_filenames: false
