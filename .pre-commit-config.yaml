exclude: (^backend/api/(v2|v2beta1)/python_http_client/|^sdk/python/kfp/server_api/|^components/google-cloud/|_pb2\.py$)

repos:
  # other fast helpful checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: end-of-file-fixer
        # Preserve Vite's emitted bytes, including third-party template strings.
        exclude: ^sdk/python/kfp/cli/viewer_assets/viewer\.(js|css)$
      - id: trailing-whitespace
        # Snapshots and bundled strings are owned by their generators.
        exclude: (^manifests/gcp_marketplace/test/|^frontend/.*\.snap$|^sdk/python/kfp/cli/viewer_assets/viewer\.(js|css)$)
      - id: debug-statements
      - id: check-merge-conflict
      - id: name-tests-test
      - id: no-commit-to-branch
        args: [--branch, master]
  # Format docstring prose before Ruff applies the final Python layout.
  - repo: https://github.com/pycqa/docformatter
    # v1.7.8 has continuation and blank-line tokenization regressions.
    rev: v1.7.7
    hooks:
      - id: docformatter
        name: docformatter
        language: python
        entry: docformatter -i -r
        # docformatter messes up certain sphinx link formatting.
        # The kubernetes_platform/python docstrings are heavy on links, so ignore.
        exclude: (sdk/python/kfp/compiler/compiler_test.py|sdk/python/kfp/kubernetes/|kubernetes_platform/python/)

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --extra lint ruff check
        language: system
        args: [--fix]
        require_serial: true
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --extra lint ruff format
        language: system
        require_serial: true
        types_or: [python, pyi]

  # Golang pre-submit hooks
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint
        name: golangci-lint
        description: Fast linters runner for Go.
        entry: >-
          bash -c 'base="${PRE_COMMIT_FROM_REF:-HEAD}";
          if git diff --quiet "${base}" -- "*.go"; then
            golangci-lint config verify &&
            golangci-lint run ./backend/src/common/plugins;
          else
            golangci-lint run --new-from-rev "${base}" --fix;
          fi'
        types: [go]
        language: golang
        require_serial: true
        pass_filenames: false
      - id: golangci-lint-fmt
        pass_filenames: true
      - id: golangci-lint-config-verify
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
