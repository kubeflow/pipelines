# PIPELINE DEFINITION
# Name: tensorboard-example
components:
  comp-tensorboard-metadata:
    executorLabel: exec-tensorboard-metadata
    outputDefinitions:
      artifacts:
        mlpipeline_ui_metadata:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-tensorboard-metadata:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - tensorboard_metadata
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef tensorboard_metadata(mlpipeline_ui_metadata: dsl.Output[dsl.Artifact]):\n\
          \    import json\n\n    with open(mlpipeline_ui_metadata.path, 'w') as metadata_file:\n\
          \        json.dump({\n            'outputs': [{\n                'type':\
          \ 'tensorboard',\n                'source': 'gs://ml-pipeline-dataset/tensorboard-train',\n\
          \            }],\n        }, metadata_file)\n\n"
        image: python:3.11-slim
pipelineInfo:
  name: tensorboard-example
root:
  dag:
    tasks:
      tensorboard-metadata:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-tensorboard-metadata
        taskInfo:
          name: tensorboard-metadata
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
