apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow
subjects:
  - kind: ServiceAccount
    name: argo-workflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-demo-cache
  labels:
    workflows.argoproj.io/configmap-type: Cache
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-demo-cache
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [argo-demo-cache]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-demo-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-demo-cache
subjects:
  - kind: ServiceAccount
    name: argo
